 "Benavente","Santa Croya de Tera","San Cristóbal de Entreviñas","Zamora","Zamora","Zamora","Zamora",
 "Villalpando","Toro","Puebla de Sanabria","Coomonte"];
function pueblo(id){ return PUEBLOS[id] || ""; }
function distancia_km(a,b){
  const A=SITIO[a], B=SITIO[b];
  if(!A||!B) return 60;
  const dy=(A[0]-B[0])*111, dx=(A[1]-B[1])*111*Math.cos(A[0]*Math.PI/180);
  return Math.sqrt(dx*dx+dy*dy);
}
const RADIO_FICHAJE = 45;   /* tres cuartos de hora de coche, poco más */
/* comarcas que se tratan aunque no queden al lado: el norte se mueve con Sanabria de siempre */
const COMARCAS = [[4,14,0,5,6,7,15]];
function sonVecinos(a,b){
  if(distancia_km(a,b) <= RADIO_FICHAJE) return true;
  return COMARCAS.some(g=>g.includes(a) && g.includes(b));
}

function tradesIA(){
  const noticias=[], movidos=new Set();
  const eqs = S.eq.filter(t=>t.id!==S.yo);
  eqs.forEach(a=>{
    if(movidos.has(a.id) || rnd()>0.75) return;
    const busca=puestoFlojo(a), suelta=puestoSobrado(a);
    if(busca===suelta) return;
    /* suelta al mejor de los que le sobran, sin tocar a sus intocables */
    const moneda = a.jug.filter(p=>p.pos===suelta && !esEstrella(a,p)).sort((x,y)=>y.med-x.med)[0];
    if(!moneda) return;
    /* solo con clubes de la zona, y antes con el más cercano */
    const socios = eqs.filter(b=>b.id!==a.id && !movidos.has(b.id) && puestosPorNecesidad(b).indexOf(suelta)<2
                                 && sonVecinos(a.id,b.id))
                      .sort((x,y)=>distancia_km(a.id,x.id)-distancia_km(a.id,y.id));
    let hecho=false;
    socios.forEach(b=>{
      if(hecho) return;
      const listón = mediaPuesto(a,busca);
      /* busca al que más se parezca en valor a lo que ofrece: así el trato le cuadra a los dos */
      const cand = b.jug.filter(p=>p.pos===busca && p.med>listón && !esEstrella(b,p))
        .sort((x,y)=>Math.abs(valorPara(b,x)-valorPara(b,moneda))-Math.abs(valorPara(b,y)-valorPara(b,moneda)))[0];
      if(!cand) return;
      if(!cuadraPlantilla(a,[moneda],[cand]) || !cuadraPlantilla(b,[cand],[moneda])) return;
      if(valorPara(a,cand)/valorPara(a,moneda) >= 1.01 && valorPara(b,moneda)/valorPara(b,cand) >= 0.97){
        traspasar(a,b,[moneda]); traspasar(b,a,[cand]);
        movidos.add(a.id); movidos.add(b.id); hecho=true;
        const km = Math.round(distancia_km(a.id,b.id));
        noticias.push(`${cand.n} (${cand.pos} ${cand.med}) pasa del ${b.n} al ${a.n} a cambio de ${moneda.n} (${moneda.pos} ${moneda.med})`+
          (km<=6 ? ", sin salir del pueblo." : `, a ${km} km de casa.`));
      }
    });
  });
  return noticias;
}








/* ============ EL VESTUARIO ============ */
/* En la provincial manda el que lleva años y se ha ganado el respeto, no el que mejor juega */
function liderazgo(p){
  return Math.round(cl((p.edad-17)*2.4 + (p.med-48)*0.9 + (p.pos==="POR"?4:0) + (p.ideal||0)*0.8, 1, 99));
}
function capitan(t){
  if(t.capitan!==undefined){ const c = t.jug.find(p=>p.id===t.capitan); if(c) return c; }
  const c = t.jug.slice().sort((a,b)=>liderazgo(b)-liderazgo(a))[0];
  t.capitan = c ? c.id : undefined;
  return c || null;
}
function lideres(t){
  const cap = capitan(t);
  return t.jug.filter(p=>!cap || p.id!==cap.id).sort((a,b)=>liderazgo(b)-liderazgo(a)).slice(0,2);
}
function veterania(t){                    /* cuánto peso tiene el vestuario */
  const c = capitan(t); if(!c) return 0;
  return liderazgo(c) + lideres(t).reduce((s,p)=>s+liderazgo(p),0)*0.4;
}
/* que el capitán esté o no en el campo se nota en el equipo */
function bonusCapitan(t){
  const c = capitan(t); if(!c) return 1;
  if(!disponible(c)) return 1;            /* lesionado no es culpa de nadie */
  if((t.once||[]).includes(c.id)) return 1.025;
  if(convocado(t,c)) return 1;
  return 0.98;                            /* ni convocado: el vestuario se resiente */
}
/* los chavales aprenden de los veteranos */
function tutela(t, p){
  if(p.edad>21) return 1;
  return 1 + cl(veterania(t)/600, 0, 0.25);
}

/* ============ EDAD, ENTRENAMIENTO Y DESARROLLO ============ */
const ENTRENOS = {
  fisico   :{n:"Físico",         d:"Aguantar los noventa minutos", campo:["fis","res"],        porteros:["vel","res"]},
  balon    :{n:"Con balón",      d:"Pase, regate y visión",        campo:["pas","reg","vis"],  porteros:["saq","col"]},
  remate   :{n:"Remate",         d:"Definir de cara a puerta",     campo:["tir","rem"],        porteros:["ref","par"]},
  defensa  :{n:"Defensa",        d:"Achique, entradas y cierre",   campo:["def","ent"],        porteros:["par","col"]},
  velocidad:{n:"Velocidad",      d:"Arrancar y repetir esfuerzos", campo:["rit","res"],        porteros:["vel","est"]},
  descanso :{n:"Recuperación",   d:"Piernas frescas y buen ánimo", campo:[],                   porteros:[]}
};
const INTENSIDAD = {
  suave :{n:"Suave",  f:0.55, fatiga: 4, lesion:0},
  normal:{n:"Normal", f:1.00, fatiga:-1, lesion:0.004},
  fuerte:{n:"Fuerte", f:1.55, fatiga:-6, lesion:0.014}
};
function factorEdad(e){
  if(e<21) return 1.70;
  if(e<26) return 1.35;
  if(e<32) return 1.00;
  if(e<36) return 0.45;
  return 0.10;
}
function plan(t){ if(!t.ent) t.ent={foco:(t.id===S.yo?"balon":"fisico"), int:"normal"}; return t.ent; }
function sincronizarEdades(){
  if(!S) return;
  S.eq.forEach(t=>t.jug.forEach(p=>{
    if(p.edad===undefined) p.edad = cl(Math.round(26 + gauss()*5), 17, 39);
    if(p.pot===undefined)  p.pot  = cl(p.med + (p.edad<23?ri(4,13):p.edad<27?ri(1,6):ri(0,2)), 30, 88);
  }));
}
/* lo que se trabaja entre semana */
function aplicarEntrenamiento(t){
  const pl = plan(t), cfg = ENTRENOS[pl.foco] || ENTRENOS.balon, inten = INTENSIDAD[pl.int] || INTENSIDAD.normal;
  t.mejoras = [];
  t.jug.forEach(p=>{
    if(p.les>0) return;                       /* el lesionado no entrena */
    if(pl.foco==="descanso"){
      p.fres = cl(p.fres+8,0,100);
      p.moral = cl(p.moral+2,0,100);
      return;
    }
    const claves = p.pos==="POR" ? cfg.porteros : cfg.campo;
    const fe = factorEdad(p.edad);
    const margen = cl((p.pot - p.med)/12, 0.12, 1.2);
    if(!p.xp) p.xp = {};
    claves.forEach(k=>{
      if(p.s[k]===undefined) return;
      p.xp[k] = (p.xp[k]||0) + 0.30*fe*inten.f*margen*tutela(t,p);
      while(p.xp[k] >= 1 && p.s[k] < Math.min(85, p.pot+6)){
        p.s[k]++; p.xp[k] -= 1;
        p.mejora = (p.mejora||0)+1;
        t.mejoras.push({n:p.n, k:LARGO[k]});
      }
    });
    if(p.edad>=36){                           /* al veterano se le va yendo la pierna */
      ["rit","fis","res","vel"].forEach(k=>{
        if(p.s[k]===undefined) return;
        p.xp[k] = (p.xp[k]||0) - 0.05;
        while(p.xp[k] <= -1 && p.s[k] > 25){ p.s[k]--; p.xp[k] += 1; }
      });
    }
    p.fres = cl(p.fres + inten.fatiga, 0, 100);
    if(rnd() < inten.lesion){
      p.les = ri(1,2); p.tocado = 0;
      t.mejoras.push({n:p.n, k:"se ha roto entrenando", malo:true});
    }
    p.med = media(p);
  });
}
/* al acabar la liga cada uno cumple años y se nota */
function desarrolloTemporada(){
  if(S.desarrollo) return;
  const informe = [];
  S.eq.forEach(t=>{
    t.jug.forEach(p=>{
      const antes = p.med;
      p.edad++;
      /* el salto o el bajón se reparte por todas sus cualidades */
      let paso = p.edad<21 ? ri(2,4) : p.edad<26 ? ri(1,3) : p.edad<32 ? ri(-1,1) : p.edad<36 ? ri(-2,0) : -ri(1,3);
      paso += Math.min(1, Math.round((p.mejora||0)/12));
      const claves = p.pos==="POR" ? ["est","par","saq","ref","vel","col"] : ["rit","tir","pas","reg","def","fis"];
      claves.concat(["rem","vis","ent","res"]).forEach(k=>{
        if(p.s[k]===undefined) return;
        const d = paso + (rnd()<0.3 ? (rnd()<0.5?1:-1) : 0);
        if(d>0) p.s[k] = Math.min(p.s[k]+d, Math.min(88, p.pot+4));
        if(d<0) p.s[k] = Math.max(p.s[k]+d, 25);
      });
      p.med = media(p);
      p.mejora = 0;
      if(t.id===S.yo) informe.push({n:p.n, pos:p.pos, edad:p.edad, antes, ahora:p.med});
    });
    t.jug.sort((x,y)=>["POR","DEF","MED","DEL"].indexOf(x.pos)-["POR","DEF","MED","DEL"].indexOf(y.pos) || y.med-x.med);
  });
  S.desarrollo = informe.sort((a,b)=>(b.ahora-b.antes)-(a.ahora-a.antes));
  guardar();
}

/* ============ LAS CINCO TEMPORADAS ============ */
/* Una partida es una carrera de cinco años en el club. Ni una más. */
const TEMPORADAS = 5;
function temporada(){ return (S && S.temp) || 1; }
function ultimaTemporada(){ return temporada() >= TEMPORADAS; }
function temporadaAcabada(){ return S.jor>=30 && !copaPendiente() && !superPendiente(); }
/* los chavales del 2008 solo andan libres dos años: al tercero ya son senior */
function juvenilesEnMercado(){ return temporada() <= 2; }

function anotarPalmares(){
  if(!S.palmares) S.palmares = [];
  if(S.palmares.some(x=>x.temp===temporada())) return;
  const tab = clasificacion(), yo = S.eq[S.yo];
  S.palmares.push({
    temp: temporada(),
    puesto: tab.indexOf(yo)+1,
    pts: pts(yo), gf: yo.gf, gc: yo.gc,
    liga: tab[0].id,
    copa: S.copa && S.copa.campeon!==null ? S.copa.campeon : null,
    sup:  S.super && S.super.jugado ? S.super.campeon : null,
    cumplido: cumpleObjetivo(),
    _oro: (()=>{ const pr=premiosTemporada(); if(!pr) return 0;
      const marca=(x,m)=>{ if(x) cromoDorado(x.p.n, x.t.id, m); };
      marca(pr.pichichi,"Pichichi"); marca(pr.zamora,"Trofeo Zamora"); marca(pr.mvp,"MVP de la liga");
      marca(pr.joven,"Mejor joven"); marca(pr.asistente,"Máximo asistente");
      marca(pr.muro,"Más porterías a cero");
      return anales().dorados.length; })(),
    pichichi: (()=>{ const g=goleadores()[0]; return g?{n:g.p.n, g:g.p.g, eq:g.t.id}:null; })(),
    premios: resumenPremios()
  });
}
function nuevaTemporada(){
  if(!temporadaAcabada() || ultimaTemporada() || S.despedido) return;
  anotarPalmares();
  /* los ocho primeros se ganan la copa del año que viene. Hay que cogerlos
     ahora, antes de que cerrarCuentas y el reseteo de abajo dejen la tabla
     a cero. */
  S.copaInv = clasificacion().slice(0,8).map(t=>t.id);
  cerrarCuentas();                       /* lo de este año pasa a los anales */
  desarrolloTemporada();                 /* por si acaso: cumplen años y cambian */
  S.temp = temporada() + 1;
  S.jor = 0;
  S.cal = calendario(16, sorteo(16));    /* cada verano, sorteo nuevo */
  S.hist = []; S.ult = null; S.ideal = null;
  S.prensa = null; S.hemeroteca = []; S.lider = undefined;
  S.desarrollo = null; S.vivo = null; S.pre = null;
  S.copa = null; S.super = null;
  S.merc = {tipo:null, usados:0, rondas:{}, bloq:[], humor:{}, noticias:[],
            cerr:{pre:false,inv:false}, hecho:{pre:false,inv:false}};
  S.ultimaCopia = 0;
  /* el palco se calma en verano, pero se acuerda de cómo acabó */
  S.junta.avisos = []; S.junta.ultimatum = false;
  S.junta.conf = Math.round(cl(58 + (S.junta.conf-58)*0.55, 15, 92));
  S.eq.forEach(t=>{
    t.pj=t.g=t.e=t.p=t.gf=t.gc=0;
    t.ment="normal"; t.mejoras=[];
    t.jug.forEach(p=>{
      p.g=0; p.a=0; p.pj=0; p.am=0; p.san=0; p.sin=0;
      p.ideal=0; p.gcp=0; p.gam=0; p.mejora=0;
      p.min=0; p.nsum=0; p.nn=0; p.amT=0; p.roj=0;
      p.cero=0; p.gcEnc=0; p.porPJ=0;
      p.les=0; delete p.tocado;
      p.fres=100;
      p.moral=cl(52+ri(0,10),0,100);
    });
  });
  /* los juveniles que siguen sin equipo cumplen años igual que todos */
  (S.juv||[]).forEach(x=>{ if(x.club===null){ x.j.edad++; x.rondas=0; x.bloq=false; } });
  S.eq.forEach(t=>{ t.tac = tacticaAuto(t); });
  aplicarPlanesFijos();
  S.eq.forEach(t=>{ t.once = onceAuto(t); });
  repartirObjetivos();   /* la junta vuelve a medir la plantilla cada verano */
  sincronizarCopa(); sincronizarPre(); sincronizarMercado();
  guardar();
}

/* comprueba campos_zamora.json: cada equipo con un nombre no vacío y sin ids repetidos */
function camposValidos(d, n){
  if(!d || !Array.isArray(d.campos)) return null;
  const m = [];
  for(const c of d.campos){
    if(!c || !Number.isInteger(c.id) || c.id<0 || typeof c.campo!=="string" || !c.campo.trim() || m[c.id]!=null) return null;
    m[c.id] = c.campo;
  }
  for(let i=0;i<n;i++) if(!m[i]) return null;
  return m;
}
function cargarCampos(){
  if(typeof fetch!=="function") return Promise.resolve(false);
  /* abierto a pelo desde el disco (file://) el navegador no deja leer archivos
     de al lado y lo canta por consola. No se pierde nada: lo de dentro del HTML
     es lo mismo, así que ni se intenta. */
  if(location.protocol === "file:") return Promise.resolve(false);
  return fetch("campos_zamora.json", {cache:"no-store"})
    .then(r=> r.ok ? r.json() : null)
    .then(d=>{
      const m = camposValidos(d, CAMPOS_INTERNOS.length);
      if(!m){ console.warn("[campos] campos_zamora.json falta o no es válido: uso la lista interna"); return false; }
      m.forEach((v,i)=>{ CAMPOS[i] = v; });
      CAMPOS_ORIGEN = "archivo";
      return true;
    })
    .catch(e=>{ console.warn("[campos] no he podido leer campos_zamora.json: uso la lista interna", e); return false; });
}
function campo(id){ return CAMPOS[id] || "su campo"; }

function fechaJornada(j){
  const d = new Date(2026, 8, 12);   /* arranque: 12 de septiembre */
  /* puente de diciembre antes de la jornada 13 y parón de Navidad hasta la segunda semana de enero */
  d.setDate(d.getDate() + j*7 + (j>=12 ? 7 : 0) + (j>=14 ? 14 : 0));
  return d;
}
function fechaTexto(j){ const d=fechaJornada(j); return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]; }
function fechaCorta(j){ const d=fechaJornada(j); return d.getDate()+"/"+(d.getMonth()+1); }

function hielo(idLocal, j){ return SANABRIA.includes(idLocal) && fechaJornada(j).getMonth()===11; }

/* lo que aporta el terreno: el visitante paga la novedad y el frío */
function contexto(idH, idA, j){
  const c = {xh:1, xa:1, desH:1, desA:1, notas:[]};
  const fort = FORTINES[idH];
  if(fort){ c.xh*=fort.xh; c.xa*=fort.xa; c.notas.push(fort.txt); }

  if(sH==="artificial"){ c.xh*=1.02; c.xa*=1.02; }
  if(sH!==sA){

    c.notas.push("El visitante no juega en "+(sH==="artificial"?"hierba artificial":"hierba natural")+" en su campo");
  }

    c.xh*=0.97; c.xa*=1.03;
    c.notas.push("Comparten campo, así que el visitante se lo conoce igual de bien");

  if(hielo(idH, j)){

    c.notas.push("Diciembre en Sanabria: hiela, el balón no corre y al de fuera se le agarrotan las piernas");

const TAC = {

    alta :{n:"Presión alta",  corto:"Alta",  atk:1.08, def:0.92, des:1.26, tar:1.35},

  },

  },

    dentro     :{n:"Por dentro",  corto:"Dentro"}
  }
};
const EJES = ["presion","estilo","zona","ritmo"];
const NOMBRE_EJE = {presion:"Presión", estilo:"Salida del balón", zona:"Por dónde atacar", ritmo:"Ritmo"};

function media_de(once, sel, filtro){
  const l = once.filter(p=>p && filtro(p));
  return l.length ? l.reduce((s,p)=>s+sel(p),0)/l.length : 55;
}
/* cada equipo juega como le pide su plantilla, comparado con su propio nivel */
function tacticaAuto(t){
  const xi = onceJug(t).filter(Boolean);
  const lista = xi.length ? xi : t.jug.slice(0,11);
  const ref = media_de(lista, p=>p.med, ()=>true);
  const directo = media_de(lista, p=>(at(p,"fis","vel")+p.s.rem)/2, p=>p.pos==="DEL"||p.pos==="MED") - ref + 2.6;
  const toque   = media_de(lista, p=>(at(p,"pas","saq")+p.s.vis)/2, p=>p.pos==="MED") - ref - 3.9;
  const bandas  = media_de(lista, p=>(at(p,"rit","vel")+at(p,"reg","col"))/2, p=>p.pos!=="POR") - ref + 2.9;
  const dentro  = media_de(lista, p=>(at(p,"pas","saq")+p.s.vis)/2, p=>p.pos==="MED"||p.pos==="DEL") - ref;
  const fuelle  = media_de(lista, p=>p.s.res, p=>p.pos!=="POR") - ref;
  const mania = ((t.id*13)%7)/2 - 1.5;      /* cada club tiene su costumbre */
  const est = (directo+mania) - toque, zon = (bandas+mania) - dentro;
  return {
    estilo : est>1.5 ? "directo" : (est<-1.5 ? "toque" : "mixto"),
    zona   : zon>1.5 ? "bandas"  : (zon<-1.5 ? "dentro" : "equilibrado"),
    presion: fuelle>2 ? "alta"   : (fuelle<-2 ? "baja" : "media"),
    ritmo  : ["normal","normal","alto","lento","normal"][t.id%5]
  };
}
function tactica(t){ if(!t.tac) t.tac = tacticaAuto(t); return t.tac; }
/* lo bien que le sienta el plan a esta plantilla, no lo buena que sea */
function encaje(t){
  const tac=tactica(t), once=onceJug(t).filter(Boolean);
  if(!once.length) return 1;
  const ref = media_de(once, p=>p.med, ()=>true);
  const ajuste = v => cl(1 + (v - ref)/45, 0.88, 1.12);
  let f=1;
  if(tac.estilo==="directo") f *= ajuste(media_de(once, p=>(at(p,"fis","vel")+p.s.rem)/2, p=>p.pos==="DEL"||p.pos==="MED") + 2.6);
  if(tac.estilo==="toque")   f *= ajuste(media_de(once, p=>(at(p,"pas","saq")+p.s.vis)/2, p=>p.pos==="MED") - 3.9);
  if(tac.zona==="bandas")    f *= ajuste(media_de(once, p=>(at(p,"rit","vel")+at(p,"reg","col"))/2, p=>p.pos!=="POR") + 2.9);
  if(tac.zona==="dentro")    f *= ajuste(media_de(once, p=>(at(p,"pas","saq")+p.s.vis)/2, p=>p.pos==="MED"||p.pos==="DEL"));
  return f;
}
function desgaste(t){ const c=tactica(t); return TAC.presion[c.presion].des * TAC.ritmo[c.ritmo].des; }
function riesgoTarjeta(t){ return TAC.presion[tactica(t).presion].tar; }
function ritmoPartido(mio, suyo){
  return TAC.ritmo[tactica(mio).ritmo].mio * TAC.ritmo[tactica(suyo).ritmo].suyo;
}
function nombreCorto(t){
  return t.n.replace(/^(CDF|CD|UD|CF|SD)\s+/,"").replace(/\s+(CF|CD)$/,"");
}
function planTexto(t){
  const c=tactica(t);
  return `${TAC.presion[c.presion].n} · ${TAC.estilo[c.estilo].n.toLowerCase()} · ${TAC.zona[c.zona].n.toLowerCase()} · ${TAC.ritmo[c.ritmo].n.toLowerCase()}`;
}
function selectorTac(t, marca, bloqueado){
  return EJES.map(eje=>`<div class="tac-fila">
    <span class="tac-tit">${NOMBRE_EJE[eje]}</span>
    <div class="tac-ops">${Object.keys(TAC[eje]).map(k=>
      `<button class="mb ${tactica(t)[eje]===k?"on":""}" data-${marca}="${eje}:${k}" ${bloqueado?"disabled":""}>${TAC[eje][k].corto}</button>`).join("")}</div>
  </div>`).join("");
}



/* ============ PRETEMPORADA ============ */
function sincronizarPre(){
  if(!S) return;
  if(!S.pre){
    if(S.jor>0 || (S.hist && S.hist.length)){ S.pre = {jugados:2, rivales:[], res:[], notas:{}}; return; }
    const otros = S.eq.filter(t=>t.id!==S.yo).map(t=>t.id);
    for(let i=otros.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [otros[i],otros[j]]=[otros[j],otros[i]]; }
    S.pre = {jugados:0, rivales:[otros[0], otros[1]], res:[], notas:{}};
  }
}
function prePendiente(){ return S.jor===0 && S.pre && S.pre.jugados<2; }
function preRival(){ return S.pre.rivales[S.pre.jugados]; }
function preEnCasa(){ return S.pre.jugados===0; }   /* el primero en casa, el segundo fuera */
function cerrarAmistoso(v){
  const yo = S.eq[S.yo];
  (v.notasFin||[]).forEach(x=>{
    if(x.eq!==S.yo) return;
    if(!S.pre.notas[x.id]) S.pre.notas[x.id] = {suma:0, n:0, min:0, g:0};
    const r = S.pre.notas[x.id];
    r.suma += x.nota; r.n++; r.min += x.min; r.g += (x.g||0);
  });
  const mios = v.h===S.yo ? v.gh : v.ga, suyos = v.h===S.yo ? v.ga : v.gh;
  S.pre.res.push({h:v.h, a:v.a, gh:v.gh, ga:v.ga});
  S.pre.jugados++;
  /* un amistoso no deja secuelas: se recuperan casi del todo */
  yo.jug.forEach(p=>{ p.fres = cl(p.fres+22,0,100); p.am = 0; });
  S.eq[v.h===S.yo?v.a:v.h].jug.forEach(p=>{ p.fres = cl(p.fres+22,0,100); p.am = 0; });
  mantenerOnce(yo);
  guardar();
}
function informePre(){
  const yo = S.eq[S.yo];
  return Object.keys(S.pre.notas).map(id=>{
    const p = yo.jug.find(x=>String(x.id)===String(id));
    if(!p) return null;
    const r = S.pre.notas[id];
    return {p, media:Math.round(r.suma/r.n*10)/10, min:r.min, g:r.g, veces:r.n};
  }).filter(Boolean).sort((a,b)=>b.media-a.media);
}

/* ============ LA PRENSA: BALÓN ZAMORANO ============ */
function rachaDe(id, n){
  const out=[];
  for(let i=S.hist.length-1; i>=0 && out.length<n; i--){
    const m = S.hist[i].marc.find(x=>x.h===id||x.a===id);
    if(!m) continue;
    const gf = m.h===id?m.hg:m.ag, gc = m.h===id?m.ag:m.hg;
    out.push(gf>gc?"G":gf<gc?"P":"E");
  }
  return out;
}
function elegir(lista){ return lista[ri(0,lista.length-1)]; }
function generarPrensa(notasJor){
  const ult = S.hist[S.hist.length-1]; if(!ult) return;
  const tab = clasificacion(), jor = S.jor;
  const puesto = id => tab.findIndex(t=>t.id===id)+1;
  const c = [];   /* candidatos a titular, con su peso */
  const mete = (peso, tit, sub) => c.push({peso: peso + ((tit+sub).includes(S.eq[S.yo].n)?9:0), tit, sub});

  ult.marc.forEach(m=>{
    const H=S.eq[m.h], A=S.eq[m.a], dif=Math.abs(m.hg-m.ag);
    const gana = m.hg>m.ag ? H : (m.ag>m.hg ? A : null);
    const pierde = gana ? (gana===H?A:H) : null;
    const d = duelo(m.h,m.a);
    if(d){
      const esDerbi = d.tipo==="derbi";
      if(gana) mete(78, esDerbi ? `${nombreCorto(gana)} se lleva el ${d.n}`
                                : `${nombreCorto(gana)} gana el pulso al ${nombreCorto(pierde)}`,
        elegir([`${m.hg}-${m.ag} en ${campo(m.h)}. De esto se habla todo el año.`,
                `${m.hg}-${m.ag} y el ${nombreCorto(pierde)} se va con la cara larga.`,
                `${m.hg}-${m.ag} en un partido de los de agarrarse al asiento.`]));
      else mete(66, esDerbi ? `Reparto de puntos en el ${d.n}` : `Tablas entre ${nombreCorto(H)} y ${nombreCorto(A)}`,
        `${m.hg}-${m.ag} en ${campo(m.h)}, con más nervio que fútbol.`);
    }
    if(dif>=4) mete(70+dif*4, elegir([
        `${nombreCorto(gana)} pasa por encima del ${nombreCorto(pierde)}`,
        `Goleada del ${nombreCorto(gana)} en ${campo(m.h)}`,
        `Al ${nombreCorto(pierde)} se le hizo de noche`]),
      elegir([`${m.hg}-${m.ag} en ${campo(m.h)}. Sin discusión posible.`,
              `${m.hg}-${m.ag}. No hubo partido desde el primer cuarto de hora.`,
              `${m.hg}-${m.ag} y gracias, que pudieron ser más.`]));
    else if(dif===3) mete(58, elegir([`Buen recado del ${nombreCorto(gana)} al ${nombreCorto(pierde)}`,
        `El ${nombreCorto(gana)} se gusta ante el ${nombreCorto(pierde)}`]), `${m.hg}-${m.ag} en ${campo(m.h)}.`);
    if(gana && jor>=4 && puesto(gana.id)>=12 && puesto(pierde.id)<=3)
      mete(86, `Sorpresa en ${campo(m.h)}: el ${nombreCorto(gana)} tumba al ${nombreCorto(pierde)}`,
        `${m.hg}-${m.ag}. Nadie daba un duro por ellos y se llevaron los tres puntos.`);
    if(m.hg===0 && m.ag===0) mete(34, `Empate sin goles en ${campo(m.h)}`, `${H.n} y ${A.n} se aburrieron de lo lindo.`);
  });

  (notasJor||[]).forEach(x=>{
    if(x.g>=3) mete(88, `${x.n} se harta de marcar`, `${x.g===3?"Tres goles":"Póker de goles"} del delantero del ${nombreCorto(S.eq[x.eq])} en una sola tarde.`);
    else if(x.g===2 && x.nota>=8) mete(52, `Doblete de ${x.n}`, `El ${nombreCorto(S.eq[x.eq])} lo lleva en volandas.`);
  });

  const lider = tab[0];
  if(jor>=3 && S.lider!==undefined && S.lider!==lider.id)
    mete(64, `El ${nombreCorto(lider)} se sube a lo alto de la tabla`, `${pts(lider)} puntos tras ${lider.pj} jornadas. Hay liga.`);
  S.lider = lider.id;

  S.eq.forEach(t=>{
    const r = rachaDe(t.id,4);
    if(r.length===4 && r.every(x=>x==="G"))
      mete(72, `El ${nombreCorto(t)} no sabe perder`, `Cuatro victorias seguidas y ${pts(t)} puntos. ${puesto(t.id)}.º en la tabla.`);
    if(r.length===4 && r.every(x=>x==="P"))
      mete(68, `El ${nombreCorto(t)} se hunde`, `Cuarta derrota consecutiva. En ${campo(t.id)} ya se oyen cosas.`);
  });

  if(!c.length) mete(20, `Jornada ${jor+1} sin sobresaltos`, `Todo quedó como estaba en lo alto de la tabla.`);
  c.sort((a,b)=>b.peso-a.peso);
  const portada = {
    jor, fecha: fechaTexto(jor),
    tit: c[0].tit, sub: c[0].sub,
    breves: c.slice(1,5).map(x=>({tit:x.tit, sub:x.sub})),
    tabla: tab.slice(0,3).map(t=>({n:nombreCorto(t), p:pts(t)})),
    pichichi: goleadores()[0] ? {n:goleadores()[0].p.n, g:goleadores()[0].p.g, eq:nombreCorto(goleadores()[0].t)} : null
  };
  S.prensa = portada;
  S.hemeroteca = [portada].concat(S.hemeroteca||[]).slice(0,12);
}

/* ============ RUEDA DE PRENSA ============ */
/* El Balón Zamorano no pregunta todas las semanas: solo cuando hay tema. */
function preguntaPrensa(){
  const t = S.eq[S.yo], tab = clasificacion(), pos = tab.indexOf(t)+1;
  const ult = S.hist[S.hist.length-1];
  const m = ult && ult.marc.find(x=>x.h===S.yo||x.a===S.yo);
  const racha = rachaDe(S.yo,3);
  const prox = S.jor<30 ? S.cal[S.jor].find(x=>x.h===S.yo||x.a===S.yo) : null;
  const d = prox ? duelo(prox.h,prox.a) : null;
  const ob = objetivo(S.yo);

  if(racha.length>=3 && racha.every(r=>r==="P"))
    return {id:"crisis", p:"Tercera derrota seguida. ¿Teme por su puesto?", ops:[
      {t:"Doy la cara yo, ellos han corrido", eq:+7, junta:-4, eco:"El entrenador se echa la culpa y protege a sus jugadores."},
      {t:"Confío en este grupo, saldremos", eq:+4, junta:+1, eco:"Pide calma y dice que el equipo va a salir de esta."},
      {t:"Aquí hay gente que tiene que dar más", eq:-6, junta:+5, eco:"Señala al vestuario y promete cambios."}]};
  if(d)
    return {id:"derbi", p:`Llega el ${d.n}. ¿Cómo lo afronta?`, ops:[
      {t:"Vamos a ganar, y lo sabemos", eq:+6, junta:+2, eco:"Sale desafiante: dice que van a ganar."},
      {t:"Es un partido más, tres puntos", eq:+1, junta:0, eco:"Le quita hierro al asunto."},
      {t:"Ellos son favoritos, nosotros humildes", eq:-2, junta:-1, eco:"Se pone la venda antes de la herida."}]};
  if(racha.length>=3 && racha.every(r=>r==="G"))
    return {id:"racha", p:"Tres victorias seguidas. ¿Se ven arriba?", ops:[
      {t:"Vamos a pelear por todo", eq:+5, junta:+4, eco:"Se atreve a mirar hacia arriba."},
      {t:"Paso a paso, no nos volvamos locos", eq:+2, junta:+1, eco:"Pide los pies en el suelo."},
      {t:"Esto no vale nada todavía", eq:-3, junta:0, eco:"Enfría el ambiente."}]};
  if(S.jor>=8 && pos>ob.puesto+3)
    return {id:"puesto", p:`Van ${pos}.º y la directiva pedía ${ob.puesto===1?"el título":"acabar "+ob.puesto+".º"}. ¿Qué pasa?`, ops:[
      {t:"El objetivo sigue intacto", eq:+4, junta:+3, eco:"Mantiene el objetivo pese a los números."},
      {t:"Hay que ser realistas con lo que tenemos", eq:+2, junta:-5, eco:"Rebaja las expectativas en público."},
      {t:"Esto se arregla currando más", eq:-3, junta:+2, eco:"Promete más trabajo y menos excusas."}]};
  if(m){
    const gf = m.h===S.yo?m.hg:m.ag, gc = m.h===S.yo?m.ag:m.hg;
    if(gc-gf>=3) return {id:"paliza", p:`${gf}-${gc}. ¿Qué explicación tiene?`, ops:[
      {t:"Responsabilidad mía, me equivoqué", eq:+6, junta:-3, eco:"Asume el error del planteamiento."},
      {t:"El rival fue muy superior, sin más", eq:0, junta:+1, eco:"Reconoce la superioridad del rival."},
      {t:"Algunos no compitieron", eq:-7, junta:+4, eco:"Carga contra sus jugadores."}]};
  }
  return null;
}
function sincronizarPrensa(){
  if(!S) return;
  if(S.rueda && S.rueda.jor===S.jor) return;
  if(S.rueda && S.rueda.respondida) { if(S.rueda.jor===S.jor) return; }
  const q = preguntaPrensa();
  S.rueda = q ? {jor:S.jor, id:q.id, p:q.p, ops:q.ops, respondida:null} : null;
}
function ruedaPendiente(){ return S.rueda && !S.rueda.respondida; }
function responderPrensa(i){
  if(!ruedaPendiente()) return;
  const op = S.rueda.ops[i]; if(!op) return;
  const t = S.eq[S.yo];
  t.jug.forEach(p=>{ p.moral = cl(p.moral + op.eq, 0, 100); });
  S.junta.conf = cl(S.junta.conf + op.junta, 0, 100);
  if(op.junta<=-4) avisoJunta("No gustó lo que dijiste en la rueda de prensa.","malo");
  else if(op.junta>=4) avisoJunta("La directiva aplaude tu discurso en la sala de prensa.","bueno");
  S.rueda.respondida = {t:op.t, eco:op.eco, eq:op.eq, junta:op.junta};
  guardar();
}

/* ============ LA DIRECTIVA ============ */
/* Lo que le exige la junta a cada club ya no es una lista escrita a mano: sale
   de la media de su plantilla. Se ordenan los 16 por esa media y a cada puesto
   de esa lista le toca un escalón. Se reparte al empezar partida y otra vez
   cada verano, así que si fichas bien te suben el listón, y si se te va media
   plantilla te lo bajan. */
const OBJ = {
  /* los dos primeros ya no se reparten: se quedan por compatibilidad con las
     partidas de antes, que sí los tenían guardados */
  todo        :{txt:"Ganarlo todo: liga, copa y Supercopa",      puesto:1,  copa:true},
  ligacopa    :{txt:"Ganar la liga y la copa",                   puesto:1,  copa:true},
  top5        :{txt:"Terminar entre los cinco primeros",         puesto:5,  copa:false},
  top10       :{txt:"Terminar entre los diez primeros",          puesto:10, copa:false},
  salvarse    :{txt:"Salvar la categoría y poco más",            puesto:15, copa:false},
  /* la escala de ahora */
  titulo      :{txt:"Pelear por el título hasta el final",       puesto:3,  copa:true},
  arriba      :{txt:"Meterse entre los seis de arriba",          puesto:6,  copa:false},
  media       :{txt:"Quedar en la zona alta de la tabla",        puesto:9,  copa:false},
  tabla       :{txt:"Aguantar en mitad de tabla",                puesto:12, copa:false},
  permanencia :{txt:"Evitar los puestos de abajo",               puesto:14, copa:false},
  /* a los dos últimos la junta no les pide puestos: con esa plantilla no se
     puede, y pedírselo dejaba a dos de cada tres entrenadores en la calle por
     hacer exactamente lo que daba el equipo */
  dignidad    :{txt:"Competir con dignidad, sin pedir puestos",  puesto:16, copa:false}
};
/* De qué puesto de la lista a qué exigencia. Los cortes salen de medir
   temporadas enteras dirigiendo cada club, no de lo que suena bien: el equipo
   que llevas tú rinde dos o tres puestos por debajo de lo que dice su
   plantilla, porque la máquina rehace su once cada jornada y el tuyo es tuyo.
   Cada escalón pide el puesto que te toca por plantilla más ese margen, y así
   se cumple del 50% al 70% de los años en vez del 0%. */
const ESCALA = [[1,"titulo"], [3,"arriba"], [6,"media"],
                [9,"tabla"], [14,"permanencia"], [16,"dignidad"]];
function escalon(puesto){
  for(const [hasta,tipo] of ESCALA) if(puesto<=hasta) return tipo;
  return "salvarse";
}
function mediaPlantilla(t){
  return t.jug && t.jug.length ? t.jug.reduce((s,p)=>s+p.med,0)/t.jug.length : t.nivel;
}
/* La media de la plantilla sola engaña, y el Fresno es la prueba: es la tercera
   media de la liga porque tiene ocho medios buenos, pero con delanteros flojos
   su ataque es el de un octavo y acaba donde acaba. Lo que de verdad decide los
   partidos es la fuerza del once en su sitio, que es justo lo que mide
   «fuerzas» en el motor. Se reparte por eso, con todos frescos y de descanso,
   y la media queda para deshacer empates. */
function fuerzaEquipo(t){
  try{ const f = fuerzas(t); return f.atk + f.def; }
  catch(e){ return mediaPlantilla(t)*2; }
}
/* Ni una cosa ni la otra: la media sola infla al Fresno —ocho medios buenos y
   delanteros flojos— y la fuerza sola hunde al Sporting B, que tiene plantilla
   de doceavo y un once equilibrado y flojo. Se ordenan los 16 por las dos
   varas y se suman los dos puestos: donde las dos coinciden manda la
   coincidencia, y donde discrepan cada una tira la mitad. */
function repartirObjetivos(){
  if(!S || !S.eq || S.eq.length!==16) return;
  const puestos = medida => {
    const o = [...S.eq].sort((a,b)=> medida(b)-medida(a) || a.n.localeCompare(b.n));
    const m = {}; o.forEach((t,i)=>{ m[t.id] = i+1; }); return m;
  };
  const porFuerza = puestos(fuerzaEquipo), porMedia = puestos(mediaPlantilla);
  const nota = t => porFuerza[t.id] + porMedia[t.id];
  const orden = [...S.eq].sort((a,b)=> nota(a)-nota(b)
                                    || mediaPlantilla(b)-mediaPlantilla(a)
                                    || a.n.localeCompare(b.n));
  S.obj = {};
  orden.forEach((t,i)=>{ S.obj[t.id] = escalon(i+1); });
  /* se deja apuntado para la pantalla de elegir club, que se ve antes de que
     exista ninguna partida */
  try{ localStorage.setItem("fmz_obj", JSON.stringify(S.obj)); }catch(e){}
}
function tipoObjetivo(id){
  if(S && S.obj && S.obj[id]) return S.obj[id];
  try{
    const g = JSON.parse(localStorage.getItem("fmz_obj")||"null");
    if(g && g[id]) return g[id];
  }catch(e){}
  /* la primera vez de todas no hay plantillas que medir: vale el nivel del club */
  const orden = [...CLUBES.keys()].sort((a,b)=> CLUBES[b][1]-CLUBES[a][1] || a-b);
  return escalon(orden.indexOf(id)+1);
}
function pideTitulo(id){ const t = tipoObjetivo(id); return t==="todo"||t==="ligacopa"; }
function objetivo(id){ return OBJ[tipoObjetivo(id)] || OBJ.media; }
function animoJunta(c){
  if(c>=78) return "encantada";
  if(c>=58) return "contenta";
  if(c>=40) return "tranquila";
  if(c>=25) return "inquieta";
  if(c>=12) return "muy tocada";
  return "harta";
}
function sincronizarJunta(){
  if(!S) return;
  if(!S.junta) S.junta = {conf:70, avisos:[], ultimatum:false};
  if(S.despedido===undefined) S.despedido = null;
  if(!S.obj) repartirObjetivos();   /* partidas de antes del reparto por medias */
}
function avisoJunta(txt, tipo){
  S.junta.avisos.unshift({jor:S.jor, txt, tipo:tipo||"nota"});
  S.junta.avisos = S.junta.avisos.slice(0,12);
}
/* se revisa al terminar cada jornada de liga */
function evaluarJunta(){
  const j=S.junta, t=S.eq[S.yo], ob=objetivo(S.yo);
  const pos=clasificacion().indexOf(t)+1;
  const ult=S.hist[S.hist.length-1];
  const m=ult && ult.marc.find(x=>x.h===S.yo||x.a===S.yo);
  let d=0;
  if(m){
    const gf=m.h===S.yo?m.hg:m.ag, gc=m.h===S.yo?m.ag:m.hg;
    d += gf>gc ? 4.5 : (gf===gc ? 1.2 : -3.5);
    const amb=ambiente(m.h,m.a);
    if(amb.junta){
      if(gf>gc){ d+=amb.junta; avisoJunta("Ganado el "+duelo(m.h,m.a).n+". En el pueblo no se habla de otra cosa.","bueno"); }
      else if(gf<gc){ d-=amb.junta+1; avisoJunta("Perdido el "+duelo(m.h,m.a).n+". La junta lo lleva fatal.","malo"); }
    }
    if(gf-gc>=3) d+=1;
    if(gc-gf>=3) d-=1;
  }
  /* el puesto pesa más según avanza la liga, que en septiembre no se despide a nadie */
  if(S.jor>=6){
    const peso = Math.min(1, S.jor/15);
    d += ((pos<=ob.puesto) ? 3 : -Math.min(6,(pos-ob.puesto)*0.8)) * peso;
  }
  d += (58 - S.junta.conf) * 0.05;   /* el ánimo del palco tiende a calmarse */
  const ultimos = S.hist.slice(-3).map(x=>{
    const p=x.marc.find(y=>y.h===S.yo||y.a===S.yo); if(!p) return "";
    const gf=p.h===S.yo?p.hg:p.ag, gc=p.h===S.yo?p.ag:p.hg;
    return gf>gc?"G":gf<gc?"P":"E";
  });
  if(ultimos.length===3 && ultimos.every(r=>r==="P")){ d-=5; avisoJunta("Tres derrotas seguidas. En el bar ya se habla de otra cosa.","malo"); }
  if(ultimos.length===3 && ultimos.every(r=>r==="G")) avisoJunta("Tres victorias seguidas, el presidente está encantado.","bueno");

  const antes=j.conf;
  j.conf = cl(j.conf + d, 0, 100);

  if(j.conf<25 && !j.ultimatum && S.jor<30){
    j.ultimatum=true;
    avisoJunta("La junta te da un ultimátum: o cambia esto o buscan otro entrenador.","malo");
  }
  if(j.conf>=45 && j.ultimatum){ j.ultimatum=false; avisoJunta("La junta retira el ultimátum. Aire fresco.","bueno"); }
  if(j.conf<8 && S.jor>=10 && S.jor<30){ destituir("La directiva ha perdido la paciencia con los resultados."); return; }

  if(S.jor>=30){
    const cumple = cumpleObjetivo();
    const tipo=tipoObjetivo(S.yo);
    const algoGanado = (clasificacion()[0].id===S.yo) || (S.copa && S.copa.campeon===S.yo);
    if(cumple){ avisoJunta("Objetivo cumplido. La junta te renueva.","bueno"); j.conf=cl(j.conf+15,0,100); }
    else if((tipo==="todo"||tipo==="ligacopa"||tipo==="titulo") && algoGanado)
      avisoJunta("No cayó todo, pero con un título en la vitrina la junta te mantiene.","nota");
    else if(j.conf<45) destituir("Se acabó la temporada sin cumplir el objetivo.");
    else avisoJunta("No se cumplió el objetivo, pero la junta te mantiene por el trabajo hecho.","nota");
  }
  if(antes>=25 && j.conf<25) avisoJunta("El ambiente en el palco se ha puesto feo.","malo");
}
function cumpleObjetivo(){
  const ob=objetivo(S.yo), tipo=tipoObjetivo(S.yo), pos=clasificacion().indexOf(S.eq[S.yo])+1;
  const liga = pos===1, copa = S.copa && S.copa.campeon===S.yo;
  const sup = S.super && S.super.jugado && S.super.campeon===S.yo;
  if(tipo==="todo") return liga && copa && sup;
  if(tipo==="ligacopa") return liga && copa;
  return pos<=ob.puesto;
}
function destituir(motivo){
  S.despedido = {jor:S.jor, motivo, puesto:clasificacion().indexOf(S.eq[S.yo])+1};
  avisoJunta("Destituido: "+motivo,"malo");
  guardar();
}
/* quedarse fuera de la copa cuando la junta la exige también pasa factura */
function juntaCopa(gana){
  if(!S.junta) return;
  const ob=objetivo(S.yo);
  if(gana){
    S.junta.conf=cl(S.junta.conf+12,0,100);
    avisoJunta("Copa de Zamora ganada. El palco está de fiesta.","bueno");
  } else if(ob.copa){
    S.junta.conf=cl(S.junta.conf-10,0,100);
    avisoJunta("Fuera de la copa. La junta lo tenía como objetivo.","malo");
  } else {
    avisoJunta("Adiós a la copa, pero la junta no la exigía.","nota");
  }
}


/* ============ SONIDO 8 BITS ============ */
const AU = {ctx:null, master:null, grada:null, gradaGain:null, on:true};
function audioListo(){
  if(AU.ctx) return true;
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return false;
    AU.ctx = new C();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = 0.5;
    AU.master.connect(AU.ctx.destination);
  }catch(e){ return false; }
  return true;
}
function suena(){ return AU.on && audioListo() && AU.ctx.state!=="closed"; }
function despertar(){
  if(AU.ctx && AU.ctx.state==="suspended") AU.ctx.resume();
}
/* un tono cuadrado, que es lo que suena a consola vieja */
function tono(f1, f2, dur, tipo, vol, retraso){
  if(!suena()) return;
  const t = AU.ctx.currentTime + (retraso||0);
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = tipo||"square";
  o.frequency.setValueAtTime(f1, t);
  if(f2 && f2!==f1) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.18, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(AU.master);
  o.start(t); o.stop(t+dur+0.02);
}
function ruido(dur, corte, vol, retraso){
  if(!suena()) return;
  const t = AU.ctx.currentTime + (retraso||0);
  const n = Math.floor(AU.ctx.sampleRate*dur);
  const buf = AU.ctx.createBuffer(1, n, AU.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = AU.ctx.createBufferSource(); s.buffer = buf;
  const f = AU.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value = corte||1200;
  const g = AU.ctx.createGain(); g.gain.value = vol||0.12;
  s.connect(f); f.connect(g); g.connect(AU.master);
  s.start(t);
}
function silbato(veces){
  if(!suena()) return;
  for(let i=0;i<(veces||1);i++){
    tono(2100, 2450, 0.16, "square", 0.10, i*0.20);
    tono(2600, 2200, 0.13, "square", 0.07, i*0.20+0.04);
  }
}
function sonGol(){
  if(!suena()) return;
  [523,659,784,1047].forEach((f,i)=>tono(f, f, 0.13, "square", 0.20, i*0.10));
  tono(1047, 1568, 0.35, "square", 0.16, 0.42);
  ruido(1.6, 900, 0.22, 0.02);      /* la grada */
}
function sonTiro(){ tono(180, 70, 0.11, "triangle", 0.16); ruido(0.10, 2400, 0.07); }
function sonParada(){ tono(320, 180, 0.13, "square", 0.10); ruido(0.16, 700, 0.10, 0.04); }
function sonTarjeta(){ tono(600, 300, 0.18, "sawtooth", 0.11); }
function sonCambio(){ tono(520, 520, 0.08, "square", 0.10); tono(780, 780, 0.10, "square", 0.10, 0.10); }
function sonLesion(){ tono(420, 140, 0.45, "sine", 0.14); }
/* rumor de grada mientras rueda el balón */
function gradaOn(){
  if(!suena() || AU.grada) return;
  const n = Math.floor(AU.ctx.sampleRate*2);
  const buf = AU.ctx.createBuffer(1, n, AU.ctx.sampleRate);
  const d = buf.getChannelData(0);
  let ult = 0;
  for(let i=0;i<n;i++){ const b=(Math.random()*2-1); ult=(ult*0.96+b*0.04); d[i]=ult*3.2; }
  const s = AU.ctx.createBufferSource(); s.buffer = buf; s.loop = true;
  const f = AU.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value = 520;
  const g = AU.ctx.createGain(); g.gain.value = 0.05;
  s.connect(f); f.connect(g); g.connect(AU.master);
  s.start();
  AU.grada = s; AU.gradaGain = g;
}
function gradaOff(){

  try{ AU.grada.stop(); }catch(e){}

function gradaSube(cuanto, dur){

/* Lo que les dices antes de salir y en el descanso. La bronca es la única que puede salir mal. */
const CHARLAS = {
  bronca:   {n:"Bronca",     d:"Levantar la voz. O reaccionan o se hunden."},
  calma:    {n:"Calma",      d:"Bajar revoluciones y que jueguen tranquilos."},
  confianza:{n:"Confianza",  d:"Arropar a los que andan de moral baja."},
  nada:     {n:"Sin charla", d:"Dejarles a su aire."}
};
const ORDEN_CHARLA = ["bronca","calma","confianza","nada"];
/* el capitán en el campo hace que cale mejor lo que dices */
function pesoCharla(t){
  const c = capitan(t);
  return (c && (t.once||[]).includes(c.id)) ? 0.16 : 0;
}
function aplicarCharla(t, tipo, dif){
  const once = onceJug(t).filter(Boolean);
  if(!once.length) return {txt:"No hay nadie a quien hablarle."};
  const peso = pesoCharla(t);
  let txt = "", exito = true;
  if(tipo==="bronca"){
    /* apretar cuando vas perdiendo suele funcionar; hacerlo ganando, no */
    const base = dif<0 ? 0.62 : dif===0 ? 0.48 : 0.30;
    exito = rnd() < cl(base+peso, 0.15, 0.88);
    const d = exito ? ri(7,11) : -ri(5,9);
    once.forEach(p=>{ p.moral = cl(p.moral+d,0,100); });
    txt = exito ? "Les has metido el miedo en el cuerpo y han apretado los dientes."
                : "Se te ha ido de las manos: han salido encogidos.";
  } else if(tipo==="calma"){
    once.forEach(p=>{ p.moral = cl(p.moral+ri(2,4),0,100); });
    txt = "Les has bajado las pulsaciones. Nada espectacular, pero nadie se rompe.";
  } else if(tipo==="confianza"){
    let tocados = 0;
    once.forEach(p=>{
      const d = p.moral<45 ? ri(7,10) : ri(1,3);
      if(p.moral<45) tocados++;
      p.moral = cl(p.moral+d,0,100);
    });
    txt = tocados ? `Has levantado a ${tocados} que iban hundidos.`
                  : "El vestuario ya estaba bien, así que ha servido de poco.";
  } else {
    txt = "Silencio en el vestuario.";
  }
  return {txt, exito};
}
function charlaPendiente(){

const MAX_CAMBIOS = 5;

function pararReloj(){ if(RELOJ){ clearInterval(RELOJ); RELOJ=null; } gradaOff(); }
function mentIA(gf,gc,min){

/* un disparo de cada nueve acaba dentro: así el acta cuadra con el marcador */
/* dónde está plantada la chapa de un jugador ahora mismo */
function sitioDe(t, lado, p){
  if(!p) return null;
  const i = (t.once||[]).indexOf(p.id);
  if(i < 0) return null;
  return colocacion(t, lado)[i] || null;
}
/* ============ MOMENTOS DECISIVOS ============ */
/* Tres formas de vivir el partido, y las tres usan EL MISMO motor: la liga, el
   calendario, las medias y las reglas no cambian nada.
     sim      — como siempre, lo resuelve todo el motor
     momentos — cuando tu equipo chuta a puerta, paras y tiras tú
     auto     — ves la escena del tiro, pero decide el motor
   Lo que haces con el mando NO sustituye al resultado: el motor ya tiene
   decidida la jugada y tu golpeo sólo mueve un poco el umbral del gol, con un
   tope que depende del que tira, del portero, de la distancia, del ángulo, de
   lo fresco que esté y de lo clara que fuera la ocasión. Un mano a mano mal
   ejecutado se puede fallar; un tiro imposible no se convierte en gol. */
/* Cuántas ocasiones te deja jugar un partido. Sin tope, con un equipo bueno
   saltaban ocho por partido y el encuentro era un parón continuo; los demás se
   quedan por debajo de tres y no notan el cambio. Pasado el tope, las resuelve
   el motor como siempre. */
const TOPE_OCASIONES = 3;
const MODOS = {
  sim:      {n:"Simulación completa", d:"Lo resuelve el motor, como hasta ahora"},
  momentos: {n:"Momentos decisivos",  d:"Tiras tú hasta en "+TOPE_OCASIONES+" ocasiones de tu equipo por partido"},
  auto:     {n:"Automático en momentos", d:"Ves la escena del tiro, pero decide el motor"}
};
const TOPE_MOMENTO = 0.10;      /* lo más que puede mover tu golpeo el umbral del gol */
/* De los tiros que no cogen puerta, los que caen por debajo de este corte los
   bloquea un defensa y el resto se va fuera. No es un dado nuevo: parte en dos
   el tramo que ya existía, así que el motor no se entera. */
const BLOQUEO_HASTA = 0.62;

/* ¿toca parar el partido en este tiro? sólo en el tuyo, en vivo y una vez */
function hayMomento(t){
  const v = S.vivo;
  if(!v || v.mudo) return false;                  /* los otros siete campos, jamás */
  if(t.id !== S.yo) return false;                 /* sólo tus ocasiones */
  if(v.momento) return false;                     /* uno cada vez */
  if((v.ocasiones||0) >= TOPE_OCASIONES) return false;   /* ya has tirado bastante */
  return S.modo === "momentos" || S.modo === "auto";
}
/* Hasta dónde puede llegar tu golpeo. Cuanto mejor es el tirador y más clara
   la ocasión, más manda la ejecución; con un portero bueno, desde lejos, en
   mal ángulo o con las piernas fundidas, el margen se encoge. */
function topeMomento(m){
  const t = S.eq[m.lado==="H" ? S.vivo.h : S.vivo.a];
  const rival = S.eq[m.lado==="H" ? S.vivo.a : S.vivo.h];
  const autor = t.jug.find(p=>p.id===m.autorId);
  const port  = onceJug(rival).find(p=>p && p.pos==="POR");
  const tirador = autor ? (at(autor,"tir","saq") + autor.s.rem)/2 : 50;
  const guante  = port ? (at(port,"par","par") + port.s.ref)/2 : 50;
  const fresco  = autor ? cl(autor.fres,0,100)/100 : 1;
  const lejos   = cl(Math.abs(m.desde.x - m.porteria)/55, 0, 1);      /* 0 cerca, 1 lejos */
  const angulo  = cl(Math.abs(m.desde.y - 32)/26, 0, 1);              /* 0 de frente */
  const clara   = cl(m.xg*90/1.4, 0, 1);                              /* lo buena que era */
  const f = (0.40 + 0.60*cl(tirador/85,0,1))      /* quién remata */
          * (1 - 0.30*cl(guante/85,0,1))          /* a quién se la tira */
          * (0.55 + 0.45*fresco)                  /* cómo llega de piernas */
          * (1 - 0.40*lejos) * (1 - 0.30*angulo)  /* desde dónde */
          * (0.55 + 0.45*clara);                  /* y si era ocasión o invento */
  return cl(TOPE_MOMENTO*f, 0.02, TOPE_MOMENTO);
}
/* calidad del golpeo (0 malo, .5 neutro, 1 clavado) → cuánto se mueve el umbral */
function ajusteMomento(m, calidad){
  if(calidad===null || calidad===undefined) return 0;      /* lo resuelve el motor */
  return (cl(calidad,0,1)-0.5) * 2 * topeMomento(m);
}

function disparo(t, lado, xg){
  const v=S.vivo;
  if(rnd() >= xg*9) return false;
  const rival = S.eq[lado==="H"?v.a:v.h];
  v.est[t.id].tiros++;
  const porteria = (lado==="H") ? 96 : 4;
  const autor = elige(onceJug(t), FORMAS[t.forma], p=>({POR:.02,DEF:.7,MED:2.3,DEL:5})[p.pos]*(at(p,"tir","saq")+p.s.rem)/2);
  const desde = sitioDe(t, lado, autor) || {x: lado==="H"?70:30, y:32};
  /* el que dispara es el que tiene el balón: si lo tenía el rival, se lo ha robado */
  if(autor){ v.bal.t = lado; v.bal.j = autor.id; }
  /* Aquí hay ocasión. La pausa se hace ANTES de saber si va a puerta: si no,
     la escena sólo podría acabar en gol o parada, y el tiro también se puede
     ir fuera o estrellarse en un defensa. Los dados y sus umbrales son los
     mismos de siempre y se tiran en el mismo orden, sólo que ahora dentro de
     rematar. */
  const m = {lado, autorId:autor?autor.id:null, desde, porteria, xg};
  if(hayMomento(t)){ v.momento = m; v.ocasiones = (v.ocasiones||0) + 1; return "pausa"; }
  return rematar(t, lado, m, null);
}
/* El desenlace del tiro, con el ajuste de tu golpeo si lo hubo. Cuatro
   finales: fuera, bloqueo, parada y gol. */
function rematar(t, lado, m, calidad){
  const v=S.vivo;
  const rival = S.eq[lado==="H"?v.a:v.h];
  const autor = t.jug.find(p=>p.id===m.autorId);
  const anota = (tipo, y) => {
    v.bal.x = m.porteria; v.bal.y = y;
    v.tiro = {min:v.min, lado, tipo, x0:m.desde.x, y0:m.desde.y, x1:m.porteria, y1:y};
  };
  /* primer dado: ¿coge puerta? Mismo 0.38 de siempre */
  const d = rnd();
  if(d >= 0.38){
    /* El tramo del tiro que no coge puerta se parte en dos SIN tirar ningún
       dado más: con el mismo número, la primera franja es el que bloquea un
       defensa y el resto se marcha fuera. Para el motor son lo mismo —tiro que
       no va entre palos— y no cambia ninguna estadística. */
    const tipo = d < BLOQUEO_HASTA ? "bloqueo" : "fuera";
    v.bal.x = m.porteria; v.bal.y = rnd()<0.5 ? 12 : 52;
    v.tiro = {min:v.min, lado, tipo, x0:m.desde.x, y0:m.desde.y, x1:m.porteria, y1:v.bal.y};
    return false;
  }
  v.est[t.id].puerta++;
  const alto = 24 + ri(0,16);
  const umbral = cl(0.29 + ajusteMomento(m, calidad), 0.05, 0.60);
  if(rnd() < umbral){ anota("gol", alto); golVivo(t, lado, autor); return true; }
  anota("parada", alto);
  const port = onceJug(rival).find(p=>p && p.pos==="POR");
  if(port){ apunta(port.id,"par"); }
  if(rnd()<0.45){
    const palo = rnd()<0.12;
    if(palo) v.tiro.tipo = "palo";
    v.ev.push({m:v.min, t:"tiro", lado, txt:(autor?autor.n:"Un disparo")+(palo?"  ·  al palo":"  ·  la saca el portero")});
  }
  return false;
}
/* al volver de la escena: se resuelve la jugada que quedó en el aire */
function cerrarMomento(calidad){
  const v = S.vivo; if(!v || !v.momento) return false;
  const m = v.momento; v.momento = null;
  const t = S.eq[m.lado==="H" ? v.h : v.a];
  return rematar(t, m.lado, m, calidad);
}
function apunta(id, clave, cuanto){
  const n = S.vivo.notas;
  if(!n[id]) n[id]={g:0,a:0,par:0,am:0,roja:0,min:0};
  n[id][clave] += (cuanto===undefined?1:cuanto);
}
/* «tirador» es quien ha chutado, cuando el gol viene de un tiro. Antes aquí se
   sorteaba otro goleador sin mirar quién había disparado: la escena del tiro
   enseñaba a uno y el gol se lo llevaba otro. Los dos sorteos se mantienen tal
   cual —ni un dado de más ni de menos, la liga no se mueve—, pero si sabemos
   quién tiró, el gol es suyo. */
function golVivo(t, lado, tirador){
  const v=S.vivo, huecos=FORMAS[t.forma], once=onceJug(t);
  const sorteado = elige(once,huecos,p=>({POR:.02,DEF:.7,MED:2.3,DEL:5})[p.pos]*(at(p,"tir","saq")+p.s.rem)/2);
  const asist0 = elige(once,huecos,p=>({POR:.05,DEF:1,MED:3,DEL:1.6})[p.pos]*(at(p,"pas","saq")+p.s.vis)/2, sorteado);
  const enElCampo = tirador && once.some(p=>p && p.id===tirador.id);
  const autor = enElCampo ? tirador : sorteado;
  /* nadie se da el pase a sí mismo */
  const asist = (asist0 && autor && asist0.id===autor.id) ? null : asist0;
  if(autor){
    if(v.comp==="liga"){ autor.g++; if(asist) asist.a++; }
    else if(v.comp==="amistoso"){ autor.gam=(autor.gam||0)+1; }
    else { autor.gcp=(autor.gcp||0)+1; }
    v.marcaron[t.id].push(autor.id);
    apunta(autor.id,"g"); if(asist) apunta(asist.id,"a");
  }
  if(lado==="H") v.gh++; else v.ga++;
  v.ev.push({m:v.min, t:"gol", lado, txt:(autor?autor.n:"En propia")+(asist?"  ·  as. "+camisetaNombre(asist):"")});
}
/* la CPU también rota cuando alguien está fundido o tocado */
function cambioIA(t){
  const v=S.vivo;
  if(v.cambios[t.id]>=MAX_CAMBIOS) return;
  const once=onceJug(t);
  let peor=null, idx=-1;
  once.forEach((p,i)=>{ if(p && (p.tocado || p.fres<38) && (!peor || p.fres<peor.fres)){ peor=p; idx=i; } });
  if(!peor) return;
  const hueco=FORMAS[t.forma][idx];
  const banca=(t.conv||[]).map(id=>t.jug.find(p=>p.id===id)).filter(p=>p&&disponible(p)&&!(v.fuera||[]).includes(p.id));
  const entra=banca.sort((x,y)=>efectivo(y,hueco)-efectivo(x,hueco))[0];
  if(!entra || efectivo(entra,hueco) < efectivo(peor,hueco)) return;
  hacerCambio(t, peor.id, entra.id);
}
/* ============ EL BANQUILLO RIVAL ============ */
/* El otro entrenador también lee el partido: cambia de actitud según el marcador
   y el minuto, mete delanteros si pierde, cierra filas si gana, tapa huecos tras
   una roja, saca al lesionado al momento y refresca piernas en la segunda parte. */
function iaEstado(t){
  const v=S.vivo;
  if(!v.ia) v.ia={};
  if(!v.ia[t.id]) v.ia[t.id]={orig:{forma:t.forma, tac:Object.assign({},tactica(t))}, ult:-99, sistema:false};
  return v.ia[t.id];
}
/* a quién tiene enfrente hoy: en tu partido eres tú, en los otros el otro club */
function rivalDe(t){ const v=S.vivo; return S.eq[t.id===v.h ? v.a : v.h]; }
function mentIA2(t, ia, dif, min){
  const v=S.vivo, yo=rivalDe(t), r=ia.ratio;
  let m;
  if(dif<0){
    if(min>=78) m="ultraof";
    else if(min>=62) m = dif<=-2 ? "ultraof" : "ofensivo";
    else if(min>=46) m="ofensivo";
    else m = dif<=-2 ? "ofensivo" : "normal";
  } else if(dif>0){
    if(min>=82) m = dif===1 ? "ultradef" : "defensivo";
    else if(min>=65) m="defensivo";
    else m = r<0.9 ? "defensivo" : "normal";
  } else {
    if(min>=75) m = r>=1.05 ? "ofensivo" : (r<0.9 ? "defensivo" : "normal");
    else m = r>=1.15 ? "ofensivo" : (r<0.85 ? "defensivo" : "normal");
    /* en copa, el que se sabe peor se conforma con los penaltis */
    if(v.comp!=="liga" && min>=80 && r<1) m="defensivo";
  }
  /* con uno menos, un paso atrás, salvo que haya que ir a por el partido */
  if(onceJug(t).some(p=>!p) && dif>=0) m = ORDEN_MENT[Math.max(0, ORDEN_MENT.indexOf(m)-1)];
  /* si tú te vuelcas y a él le vale lo que hay, se queda esperando la contra */
  const tu = yo.ment||"normal";
  if((tu==="ofensivo"||tu==="ultraof") && dif>=0 && m==="normal") m="defensivo";
  return m;
}
function tacIA(t, ia, m){
  const base=ia.orig.tac, tac=Object.assign({},base), tu=rivalDe(t).ment||"normal";
  if(m==="ofensivo"||m==="ultraof"){
    tac.presion="alta"; tac.ritmo="alto";
    if(m==="ultraof") tac.estilo="directo";
  } else if(m==="defensivo"||m==="ultradef"){
    tac.presion = m==="ultradef" ? "baja" : (base.presion==="alta" ? "media" : base.presion);
    tac.ritmo="lento";
    if(tu==="ofensivo"||tu==="ultraof") tac.estilo="directo";   /* a la contra */
  }
  return tac;
}
/* lo que vale un jugador en un hueco según lo que pida el marcador */
function valorIA(p, h, dif, min){
  let e = efectivo(p, h);
  if(p.pos==="POR"||h==="POR") return e;
  const ofe=(at(p,"tir","saq")+at(p,"reg","col")+at(p,"rit","vel"))/3, con=(at(p,"def","col")+at(p,"fis","vel"))/2;
  if(dif<0 && min>=55) e *= 1 + (ofe-con)/100*0.25;
  if(dif>0 && min>=65) e *= 1 + (con-ofe)/100*0.25;
  return e;
}
/* mete a uno en el hueco que dejó la roja y quita a otro de arriba */
function recoloca(t, sale, entra, hueco){
  const v=S.vivo, i=t.once.indexOf(sale.id); if(i<0) return;
  if(!v.fuera) v.fuera=[];
  t.once[i]=null; t.once[hueco]=entra.id;
  t.conv=(t.conv||[]).filter(x=>x!==entra.id); t.conv.push(sale.id);
  v.cambios[t.id]++; v.fuera.push(sale.id);
  if(!v.jugaron[t.id].includes(entra.id)) v.jugaron[t.id].push(entra.id);
  v.ev.push({m:v.min, t:"cambio", lado:(t.id===v.h?"H":"A"), txt:"Entra "+entra.n+" por "+sale.n+" para tapar el hueco"});
}
function sistemaIA(t, ia, dif, min){
  if(ia.sistema || onceJug(t).some(p=>!p)) return;
  const h=FORMAS[t.forma], nDef=h.filter(x=>x==="DEF").length, nDel=h.filter(x=>x==="DEL").length;
  let nueva=null, txt="";
  if(dif<0 && min>=68 && nDel<3){ nueva = nDef>=4 && nDel<2 ? "4-3-3" : "3-4-3"; txt="se vuelca arriba y pasa al "; }
  else if(dif>0 && min>=78 && nDef<5){ nueva = nDel>=2 ? "5-3-2" : "5-4-1"; txt="cierra filas y pasa al "; }
  if(!nueva || nueva===t.forma) return;
  ia.sistema = true;
  cambiarSistema(t, nueva);
  S.vivo.ev.push({m:S.vivo.min, t:"tactica", lado:(t.id===S.vivo.h?"H":"A"), txt:"El "+nombreCorto(t)+" "+txt+nueva});
}
function cambiosIA(t, ia, dif, min){
  const v=S.vivo;
  const quedan = MAX_CAMBIOS - v.cambios[t.id];
  if(quedan<=0) return;
  const huecos=FORMAS[t.forma], once=onceJug(t);
  const banca=(t.conv||[]).map(id=>t.jug.find(p=>p.id===id)).filter(p=>p&&disponible(p)&&!(v.fuera||[]).includes(p.id));
  if(!banca.length) return;
  /* 1. el lesionado sale en el momento */
  for(let i=0;i<once.length;i++){
    const p=once[i]; if(!p || !p.tocado) continue;
    const h=huecos[i];
    const e = banca.filter(x=>(x.pos==="POR")===(h==="POR")).sort((a,b)=>efectivo(b,h)-efectivo(a,h))[0];
    if(e){ hacerCambio(t, p.id, e.id); ia.ult=min; return; }
  }
  /* 2. tras una roja en portería o atrás, se sacrifica a uno de arriba */
  const iV = huecos.findIndex((h,i)=>!once[i] && (h==="POR" || (h==="DEF" && dif>=0 && min<85)));
  if(iV>=0){
    const h=huecos[iV];
    const e = banca.filter(x=>x.pos===h).sort((a,b)=>efectivo(b,h)-efectivo(a,h))[0];
    const sac = once.map((p,i)=>({p,i})).filter(x=>x.p && (huecos[x.i]==="DEL"||huecos[x.i]==="MED"))
      .sort((a,b)=>(huecos[b.i]==="DEL")-(huecos[a.i]==="DEL") || efectivo(a.p,huecos[a.i])-efectivo(b.p,huecos[b.i]))[0];
    if(e && sac){ recoloca(t, sac.p, e, iV); ia.ult=min; return; }
  }
  /* 3. los cambios de la segunda parte: piernas frescas o lo que pida el marcador */
  if(min<46 || min-ia.ult<6) return;
  if(quedan===1 && min<80) return;             /* uno se guarda por si alguien se rompe */
  let mejor=null;
  once.forEach((p,i)=>{
    if(!p) return; const h=huecos[i]; if(h==="POR") return;
    const vp=valorIA(p,h,dif,min);
    banca.forEach(e=>{
      if(e.pos==="POR") return;
      const g=valorIA(e,h,dif,min)-vp;
      if(!mejor || g>mejor.g) mejor={p,e,g};
    });
  });
  const umbral = min<60 ? 5 : (min<75 ? 3 : 1.5);
  if(mejor && mejor.g>umbral){ hacerCambio(t, mejor.p.id, mejor.e.id); ia.ult=min; }
}
function cerebroIA(t, gf, gc){
  const v=S.vivo, ia=iaEstado(t), min=v.min, dif=gf-gc;
  const lado = (t.id===v.h ? "H" : "A");
  if(ia.ratio===undefined){
    /* se mide contra el que tiene enfrente hoy: así el banquillo lee el partido
       que está jugando y no uno que no va con él */
    const otro=rivalDe(t), m1=t.ment, m2=otro.ment;
    t.ment="normal"; otro.ment="normal";
    const a=fuerzas(t), b=fuerzas(otro);
    t.ment=m1; otro.ment=m2;
    ia.ratio = (a.atk+a.def)/Math.max(1,b.atk+b.def) * (t.id===v.h ? 1.05 : 0.97);
  }
  const m = mentIA2(t, ia, dif, min);
  /* sin que cambie el marcador, no se toca la actitud cada dos minutos */
  const reciente = ia.uMin!==undefined && dif===ia.uDif && min-ia.uMin<6;
  if(m!==ia.ment && !reciente){
    ia.uMin = min; ia.uDif = dif;
    const antes = ia.ment;
    t.ment = m; ia.ment = m;
    t.tac = tacIA(t, ia, m);
    if(antes!==undefined || m!=="normal"){
      const sube = antes!==undefined && ORDEN_MENT.indexOf(m)>ORDEN_MENT.indexOf(antes);
      const txt = antes===undefined ? `El ${nombreCorto(t)} sale ${MENT[m].n.toLowerCase()}`
        : `El ${nombreCorto(t)} ${sube?"da un paso adelante":"da un paso atrás"}: ${MENT[m].n.toLowerCase()}`;
      v.ev.push({m:min, t:"tactica", lado, txt});
    }
  }
  sistemaIA(t, ia, dif, min);
  cambiosIA(t, ia, dif, min);
}
/* Si al expulsado le tocaba ser el portero, la portería NO puede quedarse
   vacía: pasaba, y el equipo seguía media hora sin nadie bajo palos teniendo
   al suplente en el banquillo y los cinco cambios sin gastar. Como en el
   fútbol de verdad: o entra el portero suplente quitando a uno de campo —y
   eso gasta un cambio— o se pone de portero el que mejor apañe de los que
   quedan, que se queda el hueco de su puesto vacío.
   Ojo: aquí no se puede llamar a rnd() ni una vez, que la cadena de azar es
   sembrada y movería todos los resultados de la liga. Todo se elige
   comparando, nunca sorteando. */
function cubrirPorteria(t, lado){
  const v = S.vivo; if(!v) return;
  const huecos = FORMAS[t.forma||"4-4-2"];
  const iPor = huecos.indexOf("POR");
  if(iPor < 0 || (t.once||[])[iPor] != null) return;      /* ya hay alguien */
  if(!v.fuera) v.fuera = [];
  const enCampo = (t.once||[]).filter(x=>x!=null);
  if(!enCampo.length) return;

  /* 1 · el portero suplente, si está convocado, disponible y quedan cambios */
  const suplente = (t.conv||[])
    .map(id=>t.jug.find(x=>x.id===id))
    .filter(p=>p && p.pos==="POR" && disponible(p) && !v.fuera.includes(p.id))
    .sort((a,b)=>efectivo(b,"POR")-efectivo(a,"POR"))[0];
  if(suplente && v.cambios[t.id] < MAX_CAMBIOS){
    /* sale el de campo que menos aporta donde está */
    let sale = null, peor = Infinity, iSale = -1;
    t.once.forEach((id,i)=>{
      if(id==null || i===iPor) return;
      const p = t.jug.find(x=>x.id===id); if(!p) return;
      const val = efectivo(p, huecos[i]);
      if(val < peor){ peor = val; sale = p; iSale = i; }
    });
    if(sale){
      t.once[iSale] = null;
      t.once[iPor] = suplente.id;
      t.conv = (t.conv||[]).filter(x=>x!==suplente.id);
      t.conv.push(sale.id);
      v.cambios[t.id]++;
      v.fuera.push(sale.id);
      if(!v.jugaron[t.id].includes(suplente.id)) v.jugaron[t.id].push(suplente.id);
      v.ev.push({m:v.min, t:"cambio", lado,
        txt:"Entra "+suplente.n+" a la portería por "+sale.n});
      return;
    }
  }
  /* 2 · sin suplente o sin cambios: a los palos el que mejor apañe */
  let tapa = null, mejor = -1, iTapa = -1;
  t.once.forEach((id,i)=>{
    if(id==null || i===iPor) return;
    const p = t.jug.find(x=>x.id===id); if(!p) return;
    const val = efectivo(p, "POR");
    if(val > mejor){ mejor = val; tapa = p; iTapa = i; }
  });
  if(tapa){
    t.once[iTapa] = null;
    t.once[iPor] = tapa.id;
    v.ev.push({m:v.min, t:"cambio", lado,
      txt:tapa.n+" se pone los guantes, no queda portero"});
  }
}
function hacerCambio(t, sale, entra){
  const v=S.vivo;
  if(!v.fuera) v.fuera=[];
  if(v.cambios[t.id]>=MAX_CAMBIOS) return "Ya has agotado los cinco cambios.";
  const i=t.once.indexOf(sale);
  if(i<0) return "Ese jugador no está en el campo.";
  const pe=t.jug.find(p=>p.id===entra), ps=t.jug.find(p=>p.id===sale);
  if(!pe || !disponible(pe)) return (pe?pe.n:"Ese jugador")+" no está para jugar.";
  if(v.fuera.includes(entra)) return pe.n+" ya ha sido sustituido y no puede volver al campo.";
  t.once[i]=entra;
  t.conv=(t.conv||[]).filter(x=>x!==entra);
  t.conv.push(sale);
  v.cambios[t.id]++;
  v.fuera.push(sale);
  if(!v.jugaron[t.id].includes(entra)) v.jugaron[t.id].push(entra);
  v.ev.push({m:v.min, t:"cambio", lado:(t.id===v.h?"H":"A"), txt:"Entra "+pe.n+" por "+ps.n});
  return null;
}
/* cambiar de sistema recoloca a los mismos once en los nuevos puestos */
function cambiarSistema(t, forma){
  const actuales = t.once.filter(x=>x!==null&&x!==undefined).map(id=>t.jug.find(p=>p.id===id)).filter(Boolean);
  t.forma = forma;
  const huecos = FORMAS[forma], usados=new Set(), nuevo=[];
  /* los sitios reservados del club se respetan también al cambiar de sistema */
  const reserva = {};
  const fijos = (typeof PLAN_FIJO !== "undefined" && (PLAN_FIJO[t.id]||{}).fijos) || null;
  if(fijos) for(const hueco in fijos){
    const p = actuales.find(x => x.n === fijos[hueco] && !usados.has(x.id));
    if(p && +hueco < huecos.length && (p.pos==="POR") === (huecos[+hueco]==="POR")){
      reserva[+hueco] = p; usados.add(p.id);
    }
  }
  huecos.forEach((h,i)=>{
    if(reserva[i]){ nuevo.push(reserva[i].id); return; }
    let mejor=null, val=-1;
    actuales.forEach(p=>{ if(usados.has(p.id)) return; const x=efectivo(p,h); if(x>val){ val=x; mejor=p; } });
    if(mejor){ usados.add(mejor.id); nuevo.push(mejor.id); } else nuevo.push(null);
  });
  t.once = nuevo;
}
function minutoVivo(){
  const v=S.vivo; if(!v || v.fin) return true;
  v.min++;
  const H=S.eq[v.h], A=S.eq[v.a];
  /* Piensa el banquillo de todo el que no lleves tú. En tu partido eso es
     el rival, igual que siempre; en los otros siete campos son los dos, que
     es lo que hace que una jornada entera se juegue con las mismas reglas. */
  if(v.h!==S.yo) cerebroIA(H, v.gh, v.ga);
  if(v.a!==S.yo) cerebroIA(A, v.ga, v.gh);

  const amb=ambiente(v.h,v.a), ctx=contexto(v.h,v.a,S.jor);
  const fH=fuerzas(H), fA=fuerzas(A);
  const xh=cl(BASE_GOL*Math.pow(Math.max(fH.atk,15)/Math.max(fA.def,15),1.7)*1.13*ritmoPartido(H,A)*amb.casa*ctx.xh,.15,4.6)/90;
  const xa=cl(BASE_GOL*Math.pow(Math.max(fA.atk,15)/Math.max(fH.def,15),1.7)*0.90*ritmoPartido(A,H)*ctx.xa,.15,4.6)/90;
  moverBalon(fH,fA);
  v.est[v.bal.t==="H"?v.h:v.a].pos++;
  let parar=false;
  if(disparo(H,"H",xh)) parar=true;
  if(disparo(A,"A",xa)) parar=true;
  /* córners y faltas, para el acta */
  if(rnd()<xh*2.2) v.est[v.h].corner++;
  if(rnd()<xa*2.2) v.est[v.a].corner++;
  if(rnd()<0.14*riesgoTarjeta(H)) v.est[v.h].falta++;
  if(rnd()<0.14*riesgoTarjeta(A)) v.est[v.a].falta++;

  const amistoso = (v.comp==="amistoso");
  const sinPortero = [];     /* se cubre al acabar el recorrido, no en mitad */
  [[H,"H"],[A,"A"]].forEach(([t,lado])=>{
    const mio = (t.id===S.yo);
    t.once.forEach((id,i)=>{
      if(id===null||id===undefined) return;
      const p=t.jug.find(x=>x.id===id); if(!p) return;
      apunta(p.id,"min");
      p.fres = cl(p.fres - cl(34-(p.s.res-50)*0.22,18,44)*desgaste(t)*(lado==="H"?ctx.desH:ctx.desA)/90, 0, 100);
      const riesgo = ({POR:.02,DEF:.14,MED:.11,DEL:.07})[p.pos]*(1.35-p.s.ent/140)*riesgoTarjeta(t)*amb.tarj/90;
      if(rnd()<riesgo){
        apunta(p.id,"am");
        if(!amistoso){
          p.am++; p.amT=(p.amT||0)+1;
          if(p.am>=5){ p.am=0; p.san=1; v.nuevos.push(p.id);
            v.ev.push({m:v.min,t:"san",lado,txt:p.n+"  ·  ciclo de cinco amarillas"}); }
        }
        /* Dos amarillas en el mismo partido son roja. Faltaba: sólo existían
           la roja directa y el ciclo de cinco, y el amonestado seguía jugando
           por muchas que viera. Se lleva la cuenta en el propio partido, así
           que se guarda y se recupera con la partida. */
        v.amar = v.amar || {};
        v.amar[p.id] = (v.amar[p.id]||0) + 1;
        if(v.amar[p.id] >= 2){
          v.ev.push({m:v.min,t:"amar",lado,txt:p.n+"  ·  segunda amarilla"});
          if(!amistoso){ p.san=1; p.roj=(p.roj||0)+1; v.nuevos.push(p.id); }
          apunta(p.id,"roja"); t.once[i]=null;
          if(p.pos==="POR") sinPortero.push([t,lado]);
          v.ev.push({m:v.min,t:"roja",lado,txt:p.n+"  ·  doble amarilla, a la calle"});
          parar=true;
          return;                  /* ya está fuera: ni roja directa ni lesión */
        }
        v.ev.push({m:v.min,t:"amar",lado,txt:p.n+"  ·  amarilla"});
      }
      if(rnd()<0.006/90){
        if(!amistoso){ p.san=1; p.roj=(p.roj||0)+1; v.nuevos.push(p.id); }
        apunta(p.id,"roja"); t.once[i]=null;
        if(p.pos==="POR") sinPortero.push([t,lado]);
        v.ev.push({m:v.min,t:"roja",lado,txt:p.n+"  ·  roja directa, se queda con diez"});
        parar=true;
      } else if(rnd()< 0.012*(1+(100-p.fres)/55)*(amistoso?0.45:1)/90){
        p.les = ri(1,3)+(rnd()<0.22?ri(1,4):0); p.tocado=1; v.nuevos.push(p.id);
        v.ev.push({m:v.min,t:"les",lado,txt:p.n+"  ·  cae lesionado"});
        if(mio) parar=true;
      }
    });
  });
  sinPortero.forEach(([t,lado])=>cubrirPorteria(t,lado));

  if(v.min>=45 && !v.descanso){
    v.descanso=true; parar=true;
    v.ev.push({m:45,t:"desc",lado:"H",txt:"Descanso"});
  }
  if(v.min>=90){ terminarVivo(); return true; }
  return parar;
}
/* la nota de cada uno, de 3 a 10 */
function calcularNotas(){
  const v=S.vivo, out=[];
  [[v.h, v.gh, v.ga],[v.a, v.ga, v.gh]].forEach(([id,gf,gc])=>{
    const t=S.eq[id];
    (v.jugaron[id]||[]).forEach(pid=>{
      const p=t.jug.find(x=>x.id===pid); if(!p) return;
      const n=v.notas[pid]||{g:0,a:0,par:0,am:0,roja:0,min:0};
      let nota = 6.0;
      nota += n.g*1.2 + n.a*0.6;
      if(p.pos==="POR"){ nota += n.par*0.14 - gc*0.35; if(gc===0) nota += 0.8; }
      else if(p.pos==="DEF"){ nota -= gc*0.22; if(gc===0) nota += 0.5; }
      else if(p.pos==="DEL" && !n.g) nota -= 0.25;
      nota += gf>gc ? 0.4 : (gf<gc ? -0.3 : 0);
      nota -= n.am*0.3 + (n.roja?1.5:0);
      nota += (n.min/90 - 1)*0.4;
      const hu = t.once.indexOf(pid); nota += (efectivo(p, hu>=0?FORMAS[t.forma][hu]:p.pos) - 60)/40;
      out.push({id:pid, eq:id, n:p.n, pos:p.pos, min:n.min, g:n.g, nota:Math.round(cl(nota,3,10)*10)/10});
    });
  });
  return out.sort((a,b)=>b.nota-a.nota);
}

}

function terminarVivo(){
  const v=S.vivo;
  pararReloj();
  if(v.comp!=="liga" && v.gh===v.ga){
    const [ph,pa]=penaltis(S.eq[v.h],S.eq[v.a]);
    v.pen=[ph,pa];
    v.ev.push({m:93,t:"pen",lado:ph>pa?"H":"A",txt:"Se decide en los penaltis: "+ph+"-"+pa});
  }
  v.notasFin = calcularNotas();
  v.fin=true;
  if(v.mudo) return;              /* partido de fondo: ni pita ni guarda */
  silbato(3); guardar();
}
function cerrarEquipo(t, gf, gc, marcaron, jugaron, nuevos, extra){
  const jug=new Set(jugaron||[]), marc=new Set(marcaron||[]), nue=new Set(nuevos||[]);
  const cap = capitan(t);
  const capFuera = cap && disponible(cap) && !jug.has(cap.id) && !convocado(t,cap);
  t.jug.forEach(p=>{
    if(jug.has(p.id)){
      p.pj++; p.sin=0;
      let dm = gf>gc?12:(gf===gc?2:-10);
      if(gf>gc) dm += (extra||0); else if(gf<gc) dm -= (extra||0);
      if(marc.has(p.id)) dm+=6;
      if(capFuera) dm -= 2;
      if(cap && jug.has(cap.id)) dm += 1;
      p.moral = cl(p.moral+dm+ri(-2,2),0,100);
      p.moral = cl(p.moral+(55-p.moral)*0.10,0,100);
      recuperaSemana(p, true);
    } else {
      p.sin++;
      recuperaSemana(p, false);
      p.moral = cl(p.moral-(convocado(t,p)?2:(p.sin>=3?9:5))-(cap&&p.id===cap.id&&capFuera?5:0),0,100);
      p.moral = cl(p.moral+(55-p.moral)*0.06,0,100);
    }
    if(!nue.has(p.id)){ if(p.les>0) p.les--; else if(p.san>0) p.san--; }
  });
}
/* Lo que un partido deja en las dos plantillas: ánimo, forma, bajas y sanciones.
   Lo comparten el partido que ves y los siete que se juegan a la vez que el tuyo. */
function pasarFactura(v){
  if(v.comp==="amistoso"){
    /* un amistoso no cuenta como partido: solo mueve un poco el ánimo */
    [[v.h, v.gh, v.ga],[v.a, v.ga, v.gh]].forEach(([id,gf,gc])=>{
      const t=S.eq[id], jug=new Set(v.jugaron[id]||[]), marc=new Set(v.marcaron[id]||[]);
      t.jug.forEach(p=>{
        if(!jug.has(p.id)) return;
        let dm = gf>gc?4:(gf===gc?1:-3);
        if(marc.has(p.id)) dm+=3;
        p.moral = cl(p.moral+dm,0,100);
      });
    });
    return;
  }
  const ambF = ambiente(v.h, v.a).moral;
  cerrarEquipo(S.eq[v.h], v.gh, v.ga, v.marcaron[v.h], v.jugaron[v.h], v.nuevos, ambF);
  cerrarEquipo(S.eq[v.a], v.ga, v.gh, v.marcaron[v.a], v.jugaron[v.a], v.nuevos, ambF);
}
/* recoge el acta y devuelve a los banquillos su plan de siempre */
function recogerPartido(v){
  S.eq.forEach(t=>{
    t.jug.forEach(p=>{ if(p.tocado) delete p.tocado; });
    if(t.id!==S.yo) t.ment="normal";   /* el planteamiento del partido no se le queda pegado */
  });
  Object.keys(v.ia||{}).forEach(id=>{ const t=S.eq[+id], o=v.ia[id].orig; if(t&&o){ t.forma=o.forma; t.tac=o.tac; } });
  return {h:v.h, a:v.a, gh:v.gh, ga:v.ga, pen:v.pen, ev:v.ev, est:v.est, notas:v.notasFin};
}
/* Los partidos que no ves. Se juegan con el MISMO motor, minuto a minuto y con
   los dos banquillos pensando: la única diferencia con el tuyo es que nadie
   mira. Devuelve lo mismo que devolvía el viejo simulador de un solo cálculo. */
function simularEnVivo(idH, idA, comp, ronda){
  const guardado = S.vivo;
  iniciarVivo(idH, idA, comp||"liga", ronda, true);
  for(let i=0; i<95 && !S.vivo.fin; i++) minutoVivo();
  const v = S.vivo;
  pasarFactura(v);
  const datos = recogerPartido(v);
  S.vivo = guardado;
  return {gh:datos.gh, ga:datos.ga, ev:datos.ev, est:datos.est,
          notas:datos.notas, pen:datos.pen};
}
function finalizarVivo(){
  const v=S.vivo; if(!v) return;
  pararReloj();
  pasarFactura(v);
  const datos = recogerPartido(v);
  const comp = v.comp, ronda = v.ronda;
  S.vivo = null;
  if(comp==="amistoso"){ S.ultAmistoso = datos; cerrarAmistoso(v); }
  else if(comp==="liga"){ S.ult = Object.assign({jor:S.jor}, datos); jugarJornada(datos); }
  else if(comp==="copa"){ S.copa.ult = Object.assign({ronda:ronda, jor:S.jor}, datos); jugarRondaCopa(datos); }
  else { jugarSupercopa(datos); }
  guardar();
}


/* ============ CAMPO EN 2D: LAS CHAPAS ============ */
const VELOCIDADES = {lento:{n:"Lento", ms:500}, normal:{n:"Normal", ms:250}, rapido:{n:"Rápido", ms:110}};
const BASEX = {POR:7, DEF:23, MED:40, DEL:57};
const EMPUJE_MENT = {ultradef:-9, defensivo:-4, normal:0, ofensivo:5, ultraof:10};

/* dónde se coloca cada uno: por líneas, y el equipo entero sube o baja con el balón */
function colocacion(t, lado){
  const v=S.vivo, huecos=FORMAS[t.forma], lineas={};
  huecos.forEach((h,i)=>{ const k=h+"|"+altura(t,i); (lineas[k]=lineas[k]||[]).push(i); });
  const empuje = (v.bal.x-50)*0.22*(lado==="H"?1:-1) + (EMPUJE_MENT[t.ment]||0);
  const sitio = [];
  for(const clave in lineas){
    const pos = clave.split("|")[0], a = +clave.split("|")[1];
    const l=lineas[clave], n=l.length;
    l.forEach((i,k)=>{
      let x = BASEX[pos] - a*7 + (pos==="POR"?0:empuje);
      x = cl(x, 4, 88);
      let y = (n===1) ? 32 : 9 + k*(46/(n-1)) + ((i*37)%7) - 3 + (lado==="H" ? -1.6 : 1.6);
      if(pos==="POR"){
        const cerca = (lado==="H" && v.bal.x<45) || (lado==="A" && v.bal.x>55);
        y = 32 + (cerca ? (v.bal.y-32)*0.45 : 0);
      }
      sitio[i] = {x: lado==="H" ? x : 100-x, y: cl(y,6,58)};
    });
  }
  return sitio;
}
/* número legible sobre el color de la camiseta */
function claro(hex){
  const c = hex.replace("#","");
  const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  return (r*0.299+g*0.587+b*0.114) > 150;
}
function rgb(h){ const c=h.replace("#",""); return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; }
function distancia(a,b){ const x=rgb(a), y=rgb(b); return Math.abs(x[0]-y[0])+Math.abs(x[1]-y[1])+Math.abs(x[2]-y[2]); }
/* si los dos visten parecido, el visitante saca la segunda equipación */
function coloresPartido(){
  const v=S.vivo;
  const kh = KITS[v.h]||{base:S.eq[v.h].color}, ka = KITS[v.a]||{base:S.eq[v.a].color};
  let baseA = ka.base, rayaA = (ka.tipo==="rayas"||ka.tipo==="rayas3") ? ka.raya : null;
  const rayaH = (kh.tipo==="rayas"||kh.tipo==="rayas3") ? kh.raya : null;
  if(distancia(kh.base, baseA) < 110){
    /* al visitante se le cambia la base para que no se confundan: entonces
       pierde las rayas, porque eran de ese mismo color */
    baseA = (ka.raya && distancia(kh.base, ka.raya)>=110) ? ka.raya : (claro(kh.base) ? "#1E3A5F" : "#E8E2D0");
    rayaA = null;
  }
  /* y si los dos van a rayas parecidas, el de fuera sale liso */
  if(rayaA && rayaH && distancia(rayaH, rayaA) < 110) rayaA = null;
  if(rayaA && distancia(baseA, rayaA) < 80) rayaA = null;
  return {h:{base:kh.base, raya:rayaH}, a:{base:baseA, raya:rayaA}};
}
function contraste(base, alt){
  if(alt && claro(base)!==claro(alt)) return alt;
  return claro(base) ? "#12281B" : "#F5F0E1";
}
/* El balón va a los pies de quien lo tiene: si no, la chapa marcada y la pelota
   aparecían en puntos distintos del campo y no se entendía nada. */
function sitioBalon(){
  const v=S.vivo;
  if(v.tiro && v.tiro.min===v.min) return {x:v.tiro.x1, y:v.tiro.y1};
  for(const [t,lado] of [[S.eq[v.h],"H"],[S.eq[v.a],"A"]]){
    const once=onceJug(t);
    const i=once.findIndex(p=>p && p.id===v.bal.j);
    if(i<0) continue;
    const c=colocacion(t,lado)[i];
    return {x: cl(c.x + (v.bal.t==="H"?5:-5), 1.5, 98.5), y: cl(c.y+1.4, 2, 60)};
  }
  return {x:v.bal.x, y:v.bal.y};
}
function campo2D(){
  const v=S.vivo, H=S.eq[v.h], A=S.eq[v.a];
  const sb = sitioBalon();

    const sitio = colocacion(t,lado), once=onceJug(t), huecos=FORMAS[t.forma];
    const col = coloresPartido()[lado==="H"?"h":"a"];
    return once.map((p,i)=>{
      /* el portero lleva su propia chapa, como su camiseta */
      const esPortero = huecos[i]==="POR";

         contra el redondel. El portero va liso, como su camiseta. */

      const cifra = raya ? (claro(fondo) ? "#12281B" : "#F5F0E1") : contraste(fondo, col.raya);

      return `<g class="chapa ${p&&p.id===v.bal.j?"con-balon":""}" id="ch-${lado}-${i}"

        </g></g>`;
    }).join("");
  };
  const porteria = x0 => `<rect x="${x0}" y="27" width="1.5" height="10" class="c-red"/>`;
  return `<svg class="campo2" viewBox="-1 -1 102 66" aria-hidden="true">
