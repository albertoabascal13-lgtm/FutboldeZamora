:root{
  --bg:#EFE9D7; --surface:#F7F2E4; --surface2:#DFD8C1; --ink:#13271C; --soft:#5B6359;
  --line:#C2B99F; --rojo:#C22A20; --verde:#1E7A3C; --oro:#B0802F; --azul:#2E5570;
  --barra:#13271C; --barratxt:#F5F0E1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E2016; --surface:#16301F; --surface2:#1F4029; --ink:#F1ECDC; --soft:#9DAF9C;
    --line:#2E5539; --rojo:#E8574A; --verde:#4FB56E; --oro:#D8A751; --azul:#79A6C4;
    --barra:#081710; --barratxt:#F5F0E1;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2016; --surface:#16301F; --surface2:#1F4029; --ink:#F1ECDC; --soft:#9DAF9C;
  --line:#2E5539; --rojo:#E8574A; --verde:#4FB56E; --oro:#D8A751; --azul:#79A6C4;
  --barra:#081710; --barratxt:#F5F0E1;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo Narrow",Arial Narrow,Helvetica,sans-serif;font-size:16px;line-height:1.35;padding-bottom:78px}
h1,h2,h3{font-family:"Pixelify Sans",ui-monospace,monospace;margin:0;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

header{position:sticky;top:0;z-index:20;background:var(--barra);color:var(--barratxt);
  padding:calc(env(safe-area-inset-top,0px) + 7px) 12px 7px;display:flex;align-items:center;gap:10px}
header .escudo{display:block}
header .sub{font-size:14px;font-weight:600;opacity:.88;margin-left:auto;text-align:right}
header .harcade{flex:none;font-size:13px;font-weight:700;color:inherit;text-decoration:none;border:2px solid currentColor;padding:3px 7px;opacity:.9}
main{padding:12px 10px 20px;max-width:760px;margin:0 auto}
section{display:none}section.on{display:block}

.portada{text-align:center}
.logo-big{margin:8px auto 16px;display:flex;justify-content:center;position:relative}
/* --- la portada se monta sola: primero el escudo, luego el nombre, luego el balón --- */
.escudo.monta .pz{opacity:0;animation:pixel-on .26s steps(2) forwards}
@keyframes pixel-on{from{opacity:0}to{opacity:1}}
.escudo.monta .ltr{opacity:0;animation:letra-on .2s steps(2) forwards}
@keyframes letra-on{from{opacity:0}to{opacity:1}}
.logo-big .rueda{position:absolute;left:-10%;bottom:2%;width:34px;pointer-events:none;
  animation:cruza 1.7s linear 1.4s both}
@keyframes cruza{
  0%{transform:translateX(0)}
  100%{transform:translateX(calc(100vw + 50px))}
}
.logo-big .rueda i{display:block;animation:bota .38s ease-in-out 1.4s 4 alternate,
  gira 1.7s linear 1.4s both}
@keyframes bota{from{transform:translateY(0)}to{transform:translateY(-26px)}}
@keyframes gira{from{rotate:0deg}to{rotate:1080deg}}
.portada .panel{animation:sube .34s ease-out both}
.portada .panel:nth-of-type(1){animation-delay:1.5s}
.portada .panel:nth-of-type(2){animation-delay:1.64s}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
section.on{animation:entra .2s ease-out}
@keyframes entra{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  .escudo.monta .pz,.escudo.monta .ltr,.portada .panel,section.on{animation:none;opacity:1;transform:none}
  .logo-big .rueda{display:none}
}
.escudo{shape-rendering:crispEdges;font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:700}
.portada .panel{text-align:left}

.panel{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--rojo);padding:12px 13px;margin-bottom:12px}
.panel.verde{border-left-color:var(--verde)}
.panel.oro{border-left-color:var(--oro)}
.panel.rojo{border-left-color:var(--rojo)}
.panel h2{font-size:16px;margin-bottom:9px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h3{font-size:14px;margin:14px 0 6px;font-weight:700}
p.note{font-size:14px;color:var(--soft);margin:6px 0}

/* ---- tablero: panel de mando sobre la mesa del entrenador ---- */
.tablero{position:relative;overflow:hidden;background:#12281B;color:#EFE9D7;
  border:2px solid #0D150E;padding:12px 10px 34px;
  box-shadow:inset 0 0 0 3px #1D3D28, inset 4px 4px 0 rgba(255,255,255,.07), inset -4px -4px 0 rgba(0,0,0,.28)}
.tablero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 26px,transparent 26px 52px)}
.tornillo{position:absolute;width:8px;height:8px;background:#7E8C7B;
  box-shadow:inset -2px -2px 0 #333F33, inset 2px 2px 0 #B3BEAE}
.tornillo.a{top:5px;left:5px}.tornillo.b{top:5px;right:5px}
.tornillo.c{bottom:5px;left:5px}.tornillo.d{bottom:5px;right:5px}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:64px;fill:rgba(255,255,255,.085);pointer-events:none;z-index:0}
.tablero > .pf-top, .tablero > .pf-tira, .tablero > .pf-grid{position:relative;z-index:1}

.pf-top{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  background:rgba(0,0,0,.28);border:1px solid rgba(0,0,0,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);padding:7px 9px}
.pf-eq{display:flex;align-items:center;gap:7px;min-width:0}
.pf-eq.der{flex-direction:row-reverse}
.pf-eq .txt{min-width:0}
.pf-eq .nm{font-weight:700;font-size:13px;line-height:1.12;display:block}
.pf-eq .rol{font-size:11px;opacity:.55}
.pf-eq.der .txt{text-align:right}
.kit{display:block;flex:0 0 auto;shape-rendering:crispEdges}
.ico{shape-rendering:crispEdges;flex:0 0 auto}
.pf-fecha{background:#EFE9D7;color:#12281B;padding:3px 9px 4px;text-align:center;line-height:1.05;
  border:2px solid #0D150E;box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.pf-fecha span{display:block;font-size:10px;opacity:.7}
.pf-fecha b{font-family:Silkscreen,ui-monospace,monospace;font-weight:700;font-size:17px}
.pf-tira{background:rgba(0,0,0,.34);border:1px solid rgba(0,0,0,.45);border-top:none;
  padding:5px 9px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#D9E2CF}
.pf-tira b{color:#F4CE6A}
.pf-tira.baja{border-top:1px solid rgba(0,0,0,.45);margin:9px 0 0;white-space:normal;line-height:1.3}

.pf-grid{display:grid;grid-template-columns:17px 1fr 1fr 17px;gap:7px;margin-top:9px;align-items:stretch}
.pf-lab{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:"Pixelify Sans",ui-monospace,monospace;
  font-weight:700;font-size:11px;letter-spacing:.06em;color:#8FA98C;
  border-right:2px solid rgba(255,255,255,.14);padding:2px 0}
.pf-lab.der{transform:none;border-right:none;border-left:2px solid rgba(255,255,255,.14)}
.pf-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.pf-col.ancho{grid-column:2 / span 3}
.pf-col.dos{grid-column:2 / span 3;display:grid;grid-template-columns:1fr 1fr;gap:7px;min-width:0}
.pf-col.dos>*{min-width:0}
/* la fila de dos es la más estrecha del tablero: va con menos aire a los lados */
.pf-col.dos .pf-b{padding:9px 6px;gap:7px}
.marca.joven{color:var(--verde)}
.marca.veterano{color:var(--oro)}
.pf-b{display:flex;align-items:center;gap:9px;width:100%;min-width:0;padding:9px 8px;cursor:pointer;color:#F4EFDF;
  text-align:left;min-height:50px;border:2px solid #0D150E;border-radius:0;

.pf-b:active{box-shadow:inset -3px -3px 0 rgba(255,255,255,.14), inset 3px 3px 0 rgba(0,0,0,.34)}
.pf-b .ico{opacity:.95;flex:0 0 auto}
.pf-b .tx{font-weight:700;font-size:14.5px;line-height:1.1;letter-spacing:.01em;min-width:0}

.pf-b.f2{background:#35607C}

.pf-jugar{display:block;width:100%;margin-top:10px;padding:15px 10px;cursor:pointer;

.fm.g{background:var(--verde)}.fm.p{background:var(--rojo)}.fm.e{background:var(--soft)}

/* ---- tablas ---- */

/* ---- controles ---- */

.barra-j{height:10px;background:var(--surface2);border:1px solid var(--line);margin:4px 0 8px}
.barra-j i{display:block;height:100%;background:var(--verde)}
.barra-j i.n-med{background:var(--oro)}.barra-j i.n-mal{background:var(--rojo)}

.pf-b.f4{background:#8A6A3A}

td.n.n-ok{color:var(--verde)}td.n.n-med{color:var(--oro)}td.n.n-mal{color:var(--rojo)}

.banda-duelo{background:var(--rojo);color:#fff;font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:700;
  font-size:15px;text-align:center;padding:6px 8px;margin:2px 0 8px;border:2px solid #0D150E;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.2), inset -2px -2px 0 rgba(0,0,0,.3)}
.duelo{font-size:10.5px;font-weight:700;padding:1px 4px;border:1px solid currentColor;white-space:nowrap}
.duelo.derbi{color:var(--rojo)}
.duelo.tension{color:var(--oro)}

/* ---- el campo de chapas ---- */
.campo-wrap{position:relative}
/* En el móvil el campo se quedaba en 339 px de ancho porque iba dentro del
   panel, con su padding y el de la página. El partido es lo que más se mira,
   así que aquí se sale de los dos márgenes y ocupa la pantalla entera; de paso
   el marcador se aprieta y el campo empieza más arriba. */
@media (max-width:430px){
  /* 10 px de la página + 4 del filo rojo del panel + 13 de su padding por la
     izquierda; por la derecha el filo mide 1, así que son 24 */
  .campo-wrap{margin-left:-27px;margin-right:-24px}
  .campo-wrap .campo2{margin:6px 0 4px;border-left:none;border-right:none}
  #s-partido .marcador{padding:9px 4px;margin:2px 0 6px}
  #s-partido .panel>h2{margin-bottom:4px}
  #s-partido .banda-duelo{margin:2px 0}
}
.celebra{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(13,21,14,.72);color:#F5F0E1;text-align:center;pointer-events:none}
.celebra.on{display:flex;animation:destello .45s steps(3)}
.gol-txt{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:44px;line-height:1;
  color:#F4CE6A;text-shadow:3px 3px 0 #0D150E}
.gol-quien{font-family:"Pixelify Sans",ui-monospace,monospace;font-size:17px;margin-top:8px}
@keyframes destello{0%{background:rgba(244,206,106,.9)}50%{background:rgba(13,21,14,.4)}100%{background:rgba(13,21,14,.72)}}
.marcador .g.late{animation:late .5s ease-out 2}
@keyframes late{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.campo2{display:block;width:100%;height:auto;margin:10px 0 6px;border:2px solid #0D150E}
.campo2 .c-hierba{fill:#1B4A31}
.campo2 .c-franja{fill:rgba(255,255,255,.05)}
.campo2 .c-lin{fill:none;stroke:rgba(255,255,255,.5);stroke-width:.7}
.campo2 .c-lin2{fill:none;stroke:rgba(255,255,255,.5);stroke-width:.7}
.campo2 .c-punto{fill:rgba(255,255,255,.65)}
.campo2 .c-red{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.55);stroke-width:.5}
/* --- la chapa: corona dentada, cara de color y brillo arriba a la izquierda --- */
.campo2 .chapa{transition:transform .22s linear}
.campo2 .chapa .corona{fill:none;stroke-width:1.1;stroke-dasharray:.85 .5}
.campo2 .chapa .cara{stroke:#0D150E;stroke-width:.5}
.campo2 .chapa .brillo{fill:none;stroke:rgba(255,255,255,.5);stroke-width:.7;stroke-linecap:round}
.campo2 .chapa .aro{fill:none;stroke:#F4CE6A;stroke-width:.9;opacity:0}
.campo2 .chapa.con-balon .aro{opacity:1;animation:latido .7s ease-in-out infinite}
@keyframes latido{0%,100%{stroke-width:.8;opacity:.75}50%{stroke-width:1.5;opacity:1}}
.campo2 .chapa text{font-family:Silkscreen,monospace;font-size:2.6px;text-anchor:middle;
  paint-order:stroke;stroke-width:.55;stroke-linejoin:round}
.campo2 #bola{transition:transform .22s linear}
.campo2 #bola .cuero{fill:#F7F3E6;stroke:#0D150E;stroke-width:.5}
.campo2 #bola .gajo{fill:#20261F}
.campo2 #estela{stroke:rgba(255,255,255,.45);stroke-width:.6;stroke-linecap:round;opacity:0}
.campo2 #estela.on{opacity:1;transition:opacity .3s}
/* --- el disparo, la parada y el gol --- */
.campo2 .chapa .cuerpo{transition:transform .17s cubic-bezier(.2,.9,.3,1.5)}
.campo2 .chapa.salta .cuerpo{animation:brinco .42s ease-out 2}
@keyframes brinco{0%,100%{transform:translate(0,0)}45%{transform:translate(0,-2.6px)}}
.campo2 #tiro{stroke:#FFF8E4;stroke-width:.9;stroke-linecap:round;opacity:0;filter:drop-shadow(0 0 .6px #0D150E)}
.campo2 #tiro.on{opacity:1;animation:vuela .34s ease-out}
@keyframes vuela{from{stroke-dasharray:0 120}to{stroke-dasharray:120 0}}
.campo2 .c-red.marcada{animation:redgol .3s steps(1) 3}
@keyframes redgol{0%,100%{fill:rgba(255,255,255,.14)}50%{fill:rgba(244,206,106,.8)}}
/* ---- la escena del disparo: estadio, jugador y balón en capas aparte ---- */
.cine{position:absolute;inset:0;display:none;background:#000;z-index:4;overflow:hidden}
.cine.on{display:flex;align-items:center;justify-content:center}
.cine .lienzo{position:relative;width:100%;aspect-ratio:240/144;overflow:hidden}
.cine .fondo{position:absolute;inset:0;background-size:100% 100%;image-rendering:pixelated}
.cine .jug,.cine .bal{position:absolute;background-repeat:no-repeat;image-rendering:pixelated}
.cine .jug{width:46.6667%;height:105.5556%;background-size:300% 100%}
.cine .bal{width:10.8333%;height:18.0556%;background-size:100% 100%}
/* La escena del tiro. El marco va clavado encima de la portería que ya está
   dibujada en el fondo: columnas 104 a 196 y filas 64 a 82 de las 240x144. */
.cine .tiro-esc{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.t-marco{position:absolute;left:43.3%;top:44.4%;width:38.3%;height:12.5%;
  border:2px solid #F5F0E1;box-shadow:0 0 0 2px rgba(13,21,14,.8);z-index:2;pointer-events:none}
/* El portero. Era un cuadrado naranja; ahora es un sprite de 28x16 sobre una
   portería que mide 92x18 del lienzo: 30.5% de ancho y 88.9% de alto del
   marco, centrado en su columna. La hoja lleva las tres poses una detrás de
   otra, así que el fondo mide el triple y se desplaza para elegir.
   El alto va al 100%: el marco tiene 2px de borde que se comen por dentro, y
   con el 88.9% de las cuentas sobre el papel el sprite salía achatado un 11%
   y los píxeles dejaban de ser cuadrados. */
.t-port{position:absolute;bottom:0;width:30.5%;height:100%;margin-left:-15.25%;
  background-repeat:no-repeat;background-size:300% 100%;image-rendering:pixelated}
.t-mira{position:absolute;top:-30%;width:6px;height:160%;margin-left:-3px;
  background:#F4CE6A;box-shadow:0 0 0 1px #0D150E}
.t-mira.fija{background:#fff}
/* La barra ya no dice «vas mal hasta que vas bien»: dibuja dónde está el
   golpeo bueno antes de que llegues. El fondo son las zonas —rojo en los
   extremos, naranja al lado, verde en el punto— y el relleno se tiñe de la
   zona en la que estás. Los cortes salen de la misma cuenta que puntúa el
   tiro, con el punto dulce en 0.78. */
.t-barra{position:absolute;left:5%;width:52%;bottom:15%;height:12px;z-index:3;
  border:2px solid #0D150E;
  background:linear-gradient(to right,
    #5A1A18 0 58%, #6B4012 58% 70%, #14532D 70% 86%, #6B4012 86% 98%, #5A1A18 98% 100%)}
.t-barra i{display:block;height:100%;width:0;background:#E03C3C;
  box-shadow:inset 0 -2px 0 rgba(13,21,14,.35)}
.t-barra i.bueno{background:#F2A03C}
.t-barra i.perfecto{background:#3FD16A}
/* el veredicto del golpeo, debajo del aviso y en el color de su zona */
.t-golpeo{position:absolute;left:38%;right:2%;top:27%;z-index:3;text-align:center;
  font-family:Silkscreen,ui-monospace,monospace;font-size:15px;letter-spacing:.04em;
  text-shadow:2px 2px 0 #0D150E;opacity:0}
.t-golpeo.se-ve{opacity:1}
.t-golpeo.perfecto{color:#5BE88A}
.t-golpeo.bueno{color:#F7BC5E}
.t-golpeo.malo{color:#FF6B6B}
/* El cartel del desenlace va arriba del todo, en el cielo: a media altura se
   montaba encima del larguero y no se leía. El veredicto del golpeo se queda
   debajo, así que se leen los dos de arriba abajo: cómo le diste y en qué
   acabó. */
.t-remate{position:absolute;left:38%;right:2%;top:13%;z-index:3;text-align:center;
  font-family:Silkscreen,ui-monospace,monospace;font-size:19px;letter-spacing:.03em;
  text-shadow:2px 2px 0 #0D150E;opacity:0}
.t-remate.se-ve{opacity:1}
.t-remate.gol{color:#5BE88A}
.t-remate.parada{color:#F5F0E1}   /* el azul claro se perdía contra el cielo */
.t-remate.fuera{color:#FF6B6B}
.t-remate.bloqueo{color:#F7BC5E}
/* El aviso va arriba, en el cielo: abajo se le montaba encima al balón. A un
   7% chocaba con el nombre del tirador, así que baja. Y ocupa sólo la mitad
   derecha, porque con el tirador ya completo en el lado izquierdo el texto
   centrado le caía encima del brazo. */
.t-aviso{position:absolute;left:38%;right:2%;top:16%;z-index:3;text-align:center;color:#F5F0E1;
  font-family:Silkscreen,ui-monospace,monospace;font-size:10px;text-shadow:1px 1px 0 #0D150E}
.t-quien{position:absolute;left:5px;top:5px;z-index:3;color:#F5F0E1;
  font-family:Silkscreen,ui-monospace,monospace;font-size:9px;text-shadow:1px 1px 0 #0D150E}
.modo-sel{margin:10px 0 8px}

.cine .destello{position:absolute;inset:0;background:#F4CE6A;opacity:0;pointer-events:none;z-index:2}

.cine .saltar{position:absolute;right:5px;bottom:5px;z-index:3;font-family:Silkscreen,monospace;

.cromo.falta .nm{color:var(--soft);font-weight:400}
.cromo .estrella{position:absolute;top:2px;right:3px;font-size:11px;line-height:1;color:var(--oro);
  text-shadow:1px 1px 0 #0D150E,-1px -1px 0 #0D150E,1px -1px 0 #0D150E,-1px 1px 0 #0D150E}
.alb-barra{height:12px;background:var(--surface2);border:2px solid #0D150E;margin:6px 0 2px}
.alb-barra i{display:block;height:100%;background:var(--oro)}
.alb-club{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.alb-club .mb{flex:0 0 auto;padding:6px 7px;font-size:11px;display:flex;align-items:center;gap:4px}
.lista .fil.rec{grid-template-columns:1fr 1.25fr;padding:9px 4px;gap:8px;align-items:flex-start}
.fil.rec .jn{font-size:13px;color:var(--soft);font-weight:600;line-height:1.25}
.fil.rec .val{text-align:right;display:flex;flex-direction:column;gap:1px;line-height:1.25}
.fil.rec .val b{font-family:Silkscreen,monospace;font-size:14px}
.fil.rec .val .meta-e{font-weight:400;font-size:10.5px}
.fil.notas .jn{display:flex;align-items:center;gap:6px}

/* ---- partido en vivo ---- */
.marcador.vivo{align-items:center}
.marcador .cen{text-align:center}
.marcador .reloj{font-family:Silkscreen,ui-monospace,monospace;font-size:12px;color:var(--soft);margin-top:3px}
.tac-fila{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.tac-tit{font-size:12px;color:var(--soft);font-weight:600;line-height:1.15}
.tac-ops{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tac-ops.cinco{grid-template-columns:repeat(5,1fr)}
.tac-ops .mb{padding:7px 1px;font-size:11px}
/* En el móvil, cinco botones más la etiqueta de 76px no caben: a «Defensivo» y
   a «Ofensivo» les cortaba el final de la palabra. Sólo en esa fila la etiqueta
   se sube arriba y los cinco se reparten el ancho entero. */
@media (max-width:430px){
  .tac-fila:has(.tac-ops.cinco){grid-template-columns:1fr;gap:2px}
  .tac-fila:has(.tac-ops.cinco) .tac-tit{margin-bottom:1px}
}
.ments{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0 4px}
.mb{padding:7px 2px;font-size:11.5px;font-weight:700;line-height:1.15;cursor:pointer;min-width:0;
  background:var(--surface2);color:var(--ink);border:2px solid var(--line);border-radius:0}
.mb.on{background:var(--rojo);color:#fff;border-color:#0D150E;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.22), inset -2px -2px 0 rgba(0,0,0,.3)}
.mb:disabled{opacity:.5;cursor:not-allowed}

.tira-banq{display:flex;gap:10px;overflow-x:auto;padding:8px 4px 4px;margin:0 auto 4px;max-width:340px;
  border-top:2px solid var(--line);-webkit-overflow-scrolling:touch}
.jc.chip{position:static;transform:none;width:52px;flex:0 0 52px;padding-top:2px}
.jc.chip .apellido{color:var(--ink);text-shadow:none;max-width:52px}
.jc.chip .dorsal{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.jc.chip.sel .dorsal{background:#F4CE6A;border-color:#0D150E;color:#0D150E}
.jc.chip.ko{opacity:.45}

.faldon{margin-top:12px;border:2px solid #1A1A16;background:#EBE3CB;padding:8px}
.faldon .etiq{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6B6553;margin-bottom:6px}
.anuncio{display:flex;align-items:center;gap:12px}
.an-txt{display:flex;flex-direction:column;gap:2px;line-height:1.2}
.an-txt b{font-family:"Pixelify Sans",ui-monospace,monospace;font-size:17px;color:#4A2C1E}
.an-txt span{font-size:12.5px;color:#5A5648}
.an-txt .patro{font-size:11px;font-style:italic;margin-top:4px}

textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;width:100%;padding:8px;
  background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:0;margin-top:8px;
  line-height:1.4;resize:vertical}
.ejemplo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;
  background:var(--surface2);border:1px solid var(--line);padding:8px;margin:8px 0;line-height:1.45;overflow-x:auto}
.aviso-l{color:var(--rojo)}

/* ---- el periódico ---- */
.diario{background:#F3EEDC;color:#1A1A16;border:2px solid #0D150E;margin-bottom:12px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cabecera-d{border-bottom:3px double #1A1A16;padding:12px 12px 8px;text-align:center}
.masthead{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:30px;line-height:1;
  letter-spacing:.01em}
.lema{font-size:11.5px;letter-spacing:.04em;margin-top:6px;color:#5A5648;text-transform:uppercase}
.cuerpo-d{padding:12px}
.titular{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:700;font-size:23px;line-height:1.1;
  margin:0 0 8px;color:#1A1A16}
.entradilla{font-size:15px;line-height:1.35;margin:0 0 12px;border-left:3px solid #A8352A;padding-left:9px}
.breves{border-top:1px solid #B9B096;padding-top:8px;display:grid;gap:9px}
.breve{display:grid;gap:2px;font-size:13.5px;border-bottom:1px dotted #B9B096;padding-bottom:8px}
.breve b{font-size:14.5px}
.breve span{color:#4A4739}
.pie-d{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;border-top:3px double #1A1A16;
  padding-top:9px;font-size:12.5px}
.pie-d b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#5A5648;margin-bottom:3px}
.pie-d span{display:block}

/* ---- pizarra con camisetas ---- */
.campo-form{position:relative;width:100%;max-width:340px;margin:12px auto 8px;aspect-ratio:3/4;
  background:#17402A;border:2px solid #0D150E;overflow:hidden;touch-action:none;
  background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 26px,transparent 26px 52px)}
.cf-linea.media{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.3)}
.cf-circulo{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;
  border:2px solid rgba(255,255,255,.3);border-radius:50%}
.cf-area{position:absolute;left:50%;width:56%;height:16%;margin-left:-28%;border:2px solid rgba(255,255,255,.3)}
.cf-area.arriba{top:0;border-top:none}
.cf-area.abajo{bottom:0;border-bottom:none}
.jc{position:absolute;transform:translate(-50%,-50%);width:58px;display:flex;flex-direction:column;
  align-items:center;gap:1px;cursor:grab;touch-action:none;user-select:none}
.jc .dorsal{font-family:Silkscreen,monospace;font-size:10px;color:#0D150E;background:#E8D9A8;
  padding:0 3px;border:1px solid #0D150E;margin-top:-6px;position:relative;z-index:2}
.jc .apellido{font-size:10.5px;font-weight:700;color:#F2EDDF;text-shadow:1px 1px 0 #0D150E;
  max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc.libre .hueco{display:flex;align-items:center;justify-content:center;width:26px;height:30px;
  border:2px dashed rgba(255,255,255,.45);color:rgba(255,255,255,.6);font-size:9px;font-weight:700}
.jc.sel .dorsal{background:#F4CE6A}
.jc.fuera .dorsal{background:#D4675A;color:#fff}
.jc.cogido{opacity:.3}
.jc.diana .dorsal, .fil.diana{outline:2px solid #F4CE6A;outline-offset:1px}
.clon-arr{position:fixed;z-index:99;pointer-events:none;display:flex;flex-direction:column;align-items:center;
  gap:1px;opacity:.92;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.4))}
.clon-arr .dorsal{font-family:Silkscreen,monospace;font-size:10px;color:#0D150E;background:#F4CE6A;padding:0 3px;border:1px solid #0D150E;margin-top:-6px}
.clon-arr .apellido{font-size:10.5px;font-weight:700;color:#F2EDDF;text-shadow:1px 1px 0 #0D150E}
.lista .fil{touch-action:pan-y}

/* ---- formación: cuadro de titulares, convocados y descartes ---- */
.fmrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.fmrow .btn{width:auto;padding:8px 12px;font-size:14px}
.campo-viejo{display:none;width:100%;max-width:186px;margin:12px auto 4px;height:auto}
.campo{shape-rendering:crispEdges}
.campo .cesped{fill:#1B4A2B;stroke:rgba(255,255,255,.35);stroke-width:2}
.campo .marca2{fill:rgba(255,255,255,.35)}
.campo .lin,.campo .lin2{fill:none;stroke:rgba(255,255,255,.35);stroke-width:1}
.campo .pt{fill:#E8D9A8;stroke:#0C1F13;stroke-width:2}
.campo .pt.vacio{fill:none;stroke-dasharray:2 2}
.campo .dor{font-size:8px;font-weight:700;text-anchor:middle;fill:#14281B;font-family:Silkscreen,monospace}
.lista.cambios .fil{grid-template-columns:20px 30px 1fr 34px 34px}
.cab-ficha{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.cab-ficha h2{margin-bottom:4px}
.marco-retrato{flex:0 0 auto;display:block;background:var(--surface2);border:2px solid #0D150E;
  padding:3px;line-height:0;box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.retrato{shape-rendering:crispEdges}
.dorsal-ficha{font-family:Silkscreen,monospace;font-size:13px;color:var(--soft);margin-right:6px}
.tag.POR,.tag.DEF,.tag.MED,.tag.DEL{color:#fff;padding:2px 6px;border:none;font-size:11.5px}
.fil.juv .marco-retrato{padding:2px;border-width:2px}
.pos-min{font-size:10px;font-weight:700;color:var(--soft);letter-spacing:.04em}
.charla{background:var(--surface2);border:2px solid #0D150E;padding:10px;margin:10px 0 4px;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.18), inset -2px -2px 0 rgba(0,0,0,.14)}
.charla h3{font-size:15px;margin-bottom:4px}
.charla .mb{padding:9px 5px;font-size:13px;display:flex;flex-direction:column;gap:3px;line-height:1.15}
.charla-pie{font-size:10px;font-weight:400;opacity:.75}
.charla-eco{text-align:center;font-style:italic;color:var(--oro);margin:8px 0 2px}
.lista .fil.juv{grid-template-columns:34px 1fr 52px 62px;padding:9px 4px;gap:8px;align-items:center}
.fil.juv .jn{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.fil.juv .meta-e{font-weight:400;font-size:10.5px;line-height:1.25}
.fil.juv .cel.me{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.fil.juv .cel.me .meta-e{font-size:9.5px}
.fil.juv .mb{padding:7px 4px;font-size:11.5px;width:100%}
.mb.armado{background:var(--rojo);color:#fff;border-color:#0D150E}
.lista .fil.club{grid-template-columns:34px 1fr 1fr;padding:8px 4px;gap:8px}
.fil.club .esc{display:flex;align-items:center;justify-content:center}
.fil.club .jn{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.fil.club .meta-e{font-weight:400;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fil.club .obj{font-size:11.5px;color:var(--soft);line-height:1.2;text-align:right}
.fil.club .obj.duro{color:var(--rojo);font-weight:700}
.fil.club .obj.comodo{color:var(--verde)}
.fil.club.sel{box-shadow:inset 4px 0 0 var(--rojo)}
.lista .fil.ranura{grid-template-columns:22px 1fr 62px 30px;padding:9px 4px}
.fil.ranura .jn{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.fil.ranura .meta-e{font-weight:400}
.fil.ranura .nu{font-family:Silkscreen,monospace;font-size:13px}
.fil.ranura .mb{padding:6px 4px;font-size:11.5px;width:100%}
.fil.ranura.vacia .jn{color:var(--soft);font-style:italic}
.lista .fil{display:grid;grid-template-columns:20px 30px 1fr 30px 18px 36px;gap:6px;align-items:center;
  width:100%;text-align:left;padding:6px 4px;border:none;border-bottom:1px solid var(--line);
  background:none;cursor:pointer;font-size:14px}
.lista .fil.cab{cursor:default;color:var(--soft);font-size:11.5px;font-weight:600;border-bottom:2px solid var(--line)}
.lista .fil .nu{font-variant-numeric:tabular-nums;color:var(--soft);font-size:12.5px;text-align:center}
.lista .fil .jn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista .fil .cel{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lista .fil .cel.me{font-weight:700;font-size:15.5px}
.lista .fil .n-ok{color:var(--verde)}.lista .fil .n-med{color:var(--oro)}.lista .fil .n-mal{color:var(--rojo)}
.lista .fil .p{font-size:10.5px;padding:2px 0;text-align:center;border-radius:2px;color:#fff;font-weight:700}
.lista .fil .p.fuera{box-shadow:0 0 0 2px var(--rojo)}
.lista .fil.sel{background:var(--surface2);box-shadow:inset 3px 0 0 var(--ink)}
.lista .fil.les{background:color-mix(in srgb,var(--rojo) 14%,transparent)}
.lista .fil.san{background:color-mix(in srgb,var(--oro) 16%,transparent)}
.lista .fil.cans{background:color-mix(in srgb,var(--oro) 7%,transparent)}
/* el «!» de piernas: en la ficha, en la camiseta del campo y en el botón del
   menú, para que se vea sin tener que entrar a mirar */
.pide{display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;margin-left:5px;vertical-align:-2px;
  background:var(--oro);color:#1A1205;border:1px solid #0D150E;
  font-family:Silkscreen,ui-monospace,monospace;font-size:10px;font-weight:700;line-height:1}
.jc .pide.cam{position:absolute;top:-3px;right:-4px;margin:0;width:14px;height:14px;
  box-shadow:0 1px 0 rgba(0,0,0,.35)}
.pf-b .pronto.alerta{background:var(--oro);color:#1A1205;padding:1px 5px;
  border:1px solid #0D150E;opacity:1}
.soft{color:var(--soft)}
.lista .fil.vacia{color:var(--soft);font-style:italic}
.mo{display:inline-block;width:12px;height:12px;border:1px solid rgba(0,0,0,.4)}
.mo.a{background:var(--verde)}.mo.n{background:var(--soft)}.mo.b{background:var(--rojo)}
.marca{font-size:11px;font-weight:700;color:var(--rojo);white-space:nowrap}

/* ---- plantilla ---- */
.jug{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:8px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.jug .p{font-size:11.5px;font-weight:700;color:#fff;background:var(--soft);padding:2px 0;text-align:center;border-radius:2px}
/* el cromo en la lista de la plantilla: el retrato con su marco y debajo la
   tira de color del puesto, que es lo que antes ocupaba toda la columna */
.cromo-mini{display:block;line-height:0}
.cromo-mini .marco-retrato{padding:2px;border-width:2px;display:block;width:fit-content;margin:0 auto}
.cromo-mini .p{display:block;margin-top:3px;font-size:10px;line-height:1.3;letter-spacing:.03em}
.p.POR{background:var(--oro)}.p.DEF{background:var(--azul)}.p.MED{background:var(--verde)}.p.DEL{background:var(--rojo)}
.jug .nm{font-weight:600;font-size:15px}
.jug .meta{font-size:12.5px;color:var(--soft)}
.med{font-family:Silkscreen,ui-monospace,monospace;font-weight:700;font-size:15px;min-width:38px;text-align:right}
.bar{height:5px;background:var(--surface2);margin-top:3px;width:78px;max-width:40vw}
.bar i{display:block;height:100%;background:var(--verde)}
.bar.bajo i{background:var(--rojo)}.bar.medio i{background:var(--oro)}
.tag{font-size:11.5px;font-weight:700;padding:1px 5px;border:1px solid currentColor}
.t-alta{color:var(--verde)}.t-baja{color:var(--rojo)}.t-norm{color:var(--soft)}
.t-les{color:var(--rojo)}.t-san{color:var(--oro)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;margin-top:8px}
.st{display:flex;align-items:center;gap:7px;font-size:14px}
.st span:first-child{flex:1;color:var(--soft)}
.st b{font-family:"Pixelify Sans",ui-monospace,monospace;min-width:22px;text-align:right}
.mini{height:4px;background:var(--surface2);width:52px}
.mini i{display:block;height:100%;background:var(--ink)}

.aviso{font-size:13.5px;color:var(--rojo);font-weight:600;margin-top:8px}

.marcador{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  padding:14px 4px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:4px 0 12px}
.marcador .e{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:600;font-size:14.5px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.15}
.marcador .g{font-family:Silkscreen,ui-monospace,monospace;font-weight:700;font-size:30px;letter-spacing:0}
.ev{display:grid;grid-template-columns:32px 19px 17px 1fr;gap:7px;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.ev .m{color:var(--soft);font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);align-items:center}
.res .l{text-align:right}.res .c{text-align:center;font-weight:700;background:var(--surface2);padding:2px 0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);
  border-top:2px solid var(--barra);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:none;padding:11px 2px;font-size:13px;font-weight:700;
  font-family:"Pixelify Sans",ui-monospace,monospace;
  color:var(--soft);cursor:pointer;border-top:3px solid transparent}
.ofe{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer}
.ofe.sel{background:var(--surface2);box-shadow:inset 3px 0 0 var(--verde)}
.ofe:disabled{opacity:.42;cursor:not-allowed}
.ofe .med{font-size:17px}
.balanza{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:800;font-size:16px;margin-top:6px}
nav button.on{color:var(--ink);border-top-color:var(--rojo);background:var(--surface2)}

/* ---- cifras legibles ---- */
.st b{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;letter-spacing:0;line-height:1.2}
.med{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:12px;letter-spacing:0;line-height:1.2}
.ofe .med{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:13px;letter-spacing:0;line-height:1.2}
.marcador .g{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:24px;letter-spacing:0;line-height:1.2}
.h2h b{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:15px;letter-spacing:0;line-height:1.2}
.fil.rec .val b{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;letter-spacing:0;line-height:1.2}
.fil.ranura .nu{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:10.5px;letter-spacing:0;line-height:1.2}
.dorsal-ficha{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:10.5px;letter-spacing:0;line-height:1.2}
.jc .dorsal, .clon-arr .dorsal{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:8px;letter-spacing:0;line-height:1.2}
.campo .dor{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:6.5px;letter-spacing:0;line-height:1.2}
.campo2 .chapa text{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:2.1px;letter-spacing:0;line-height:1.2}
.pf-fecha b{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;font-weight:400;font-size:13px;letter-spacing:0;line-height:1.2}

<script>

"use strict";
/* ============ DATOS BASE ============ */
const CLUBES = [
 ["CDF Benavente",88,"#9B1B3C"],
 ["CD Coreses",88,"#DCC24A"],
 ["Fresno de la Ribera CF",84,"#C8322B"],
 ["CD Bovedana",81,"#E8C33B"],
 ["CD Atlético Sanabria",80,"#2E8B57"],
 ["Racing Club Benavente",79,"#2D5FA8"],
 ["Santa Croya CF",75,"#1B5FAD"],
 ["CD San Cristóbal",74,"#3E7BC4"],
 ["Atlético Zamora",72,"#8E2A57"],
 ["CD Ciudad de Zamora",82,"#C0392B"],
 ["Sporting Zamora CF",77,"#8E2323"],
 ["Sporting Zamora B CF",74,"#4E9BD6"],
 ["CD Villalpando",76,"#C0392B"],
 ["UD Toresana",73,"#2E6FC4"],
 ["Sanabria CF",72,"#3C8A4E"],
 ["CD Coomonte",71,"#2B7FC4"]
];
const DT = [
 "Óscar Sánchez",          /* CDF Benavente */
 "Manuel Cruz",            /* CD Coreses */
 "Héctor García",          /* Fresno de la Ribera */
 "José Ignacio Hernández", /* CD Bovedana */
 "Pedro Arias",            /* CD Atlético Sanabria */
 "Alberto González",       /* Racing Club Benavente */
 "José Luis Vega",         /* Santa Croya */
 "Francisco Ferrero",      /* CD San Cristóbal */
 "Ángel Fernández",        /* Atlético Zamora */
 "Sergio Miguel Prieto",   /* CD Ciudad de Zamora */
 "Eduardo Vara",           /* Sporting Zamora */
 "Antonio Fernández",      /* Sporting Zamora B */
 "Guillermo Burgos",       /* CD Villalpando */
 "Mario Urtasun",          /* UD Toresana */
 "José Antonio Boyano",    /* Sanabria CF */
 "Fran Ferrero"            /* CD Coomonte */
];
function dt(t){ return t.dt || DT[t.id] || ""; }
const NOM = ["Adrián","Álvaro","Andrés","Ángel","Antonio","Beltrán","Borja","Bruno","Carlos","César","Chema","Daniel","David","Diego","Eduardo","Enrique","Fernando","Gonzalo","Guillermo","Héctor","Hugo","Ignacio","Iván","Jaime","Javier","Jesús","Joaquín","Jorge","José","Juan","Julián","Lucas","Luis","Manuel","Marcos","Mario","Martín","Mateo","Miguel","Nacho","Nicolás","Óscar","Pablo","Pedro","Rafael","Raúl","Rodrigo","Rubén","Samuel","Santiago","Sergio","Tomás","Unai","Víctor"];
const APE = ["Alonso","Álvarez","Aparicio","Arias","Barrio","Benito","Blanco","Bragado","Calvo","Carnero","Casado","Castaño","Crespo","Cuesta","Delgado","Domínguez","Esteban","Ferrero","Fraile","Franco","Fuentes","Gago","Gallego","Garrote","Gómez","González","Grande","Herrero","Hidalgo","Iglesias","Lorenzo","Lozano","Manso","Marbán","Martín","Mateos","Merino","Miguélez","Molina","Nieto","Núñez","Olmo","Pascual","Peláez","Pérez","Pinilla","Prada","Prieto","Ramos","Represa","Riesco","Rodríguez","Román","Rueda","Salvador","Samaniego","Sánchez","Santos","Sastre","Sevillano","Tejedor","Toranzo","Vaquero","Vega","Velasco","Vicente","Villar","Zamorano"];
const FORMAS = {
 "4-4-2":["POR","DEF","DEF","DEF","DEF","MED","MED","MED","MED","DEL","DEL"],
 "4-3-3":["POR","DEF","DEF","DEF","DEF","MED","MED","MED","DEL","DEL","DEL"],
 "4-5-1":["POR","DEF","DEF","DEF","DEF","MED","MED","MED","MED","MED","DEL"],
 "3-5-2":["POR","DEF","DEF","DEF","MED","MED","MED","MED","MED","DEL","DEL"],
 "5-3-2":["POR","DEF","DEF","DEF","DEF","DEF","MED","MED","MED","DEL","DEL"],
 "5-4-1":["POR","DEF","DEF","DEF","DEF","DEF","MED","MED","MED","MED","DEL"],
 "4-2-3-1":["POR","DEF","DEF","DEF","DEF","MED","MED","MED","MED","MED","DEL"],
 "3-4-3":["POR","DEF","DEF","DEF","MED","MED","MED","MED","DEL","DEL","DEL"]
};
/* Hay sistemas que parten una línea en dos alturas. El número dice cuánto se
   retrasa (+) o se adelanta (−) ese hueco respecto a su línea: los dos pivotes
   del 4-2-3-1 van por detrás de los tres de arriba, y por eso no es un 4-5-1. */
const ALTURAS = {
 "4-2-3-1": {5:1, 6:1, 7:-1, 8:-1, 9:-1}
};
function altura(t, i){ return (ALTURAS[t.forma]||{})[i] || 0; }
/* un hueco adelantado pide alguien de llegada; uno retrasado, alguien de trabajo */
function sesgoAltura(p, a){
  if(!a || p.pos==="POR") return 1;
  const ofe = (p.s.tir + p.s.reg)/2, con = (p.s.def + p.s.fis)/2;
  return 1 + (a<0 ? (ofe-con) : (con-ofe))/100 * 0.28;
}
const PESOS = {
 POR:{est:.20,par:.25,saq:.07,ref:.25,vel:.03,col:.20},
 DEF:{rit:.15,tir:.05,pas:.15,reg:.05,def:.35,fis:.25},
 MED:{rit:.12,tir:.13,pas:.30,reg:.20,def:.13,fis:.12},
 DEL:{rit:.22,tir:.32,pas:.10,reg:.20,def:.03,fis:.13}
};
const PERFIL = {
 DEF:{rit:-2,tir:-12,pas:-4,reg:-10,def:+7,fis:+5},
 MED:{rit:-1,tir:-2,pas:+6,reg:+3,def:-3,fis:-3},
 DEL:{rit:+5,tir:+8,pas:-6,reg:+4,def:-14,fis:-2},
 POR:{est:+2,par:+3,saq:-2,ref:+3,vel:-12,col:+1}
};
const LARGO = {rit:"Ritmo",tir:"Tiro",pas:"Pase",reg:"Regate",def:"Defensa",fis:"Físico",
 est:"Estirada",par:"Paradas",saq:"Saque",ref:"Reflejos",vel:"Velocidad",col:"Colocación",
 rem:"Remate",vis:"Visión",ent:"Entradas",res:"Resistencia"};

/* ============ UTILIDADES ============ */
let SEED = 20261;
function rnd(){ SEED=(SEED*1664525+1013904223)%4294967296; return SEED/4294967296; }
/* Una semilla nueva de verdad para cada partida. Antes la semilla salía del
   equipo elegido, así que dos partidas con el mismo club eran calcadas. */
function semillaNueva(){
  try{
    if(typeof crypto !== "undefined" && crypto.getRandomValues){
      const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0];
    }
  }catch(e){}
  return Math.floor(Math.random()*4294967296);
}
/* el bombo: baraja los 16 puestos del calendario */
function sorteo(n){
  const o = [...Array(n).keys()];
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; }
  return o;
}
function ri(a,b){ return a+Math.floor(rnd()*(b-a+1)); }
function gauss(){ return (rnd()+rnd()+rnd()-1.5)/1.5; }
function cl(v,a,b){ return Math.max(a,Math.min(b,v)); }
function el(h){ const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Rebaja: nivel provincial = nivel del equipo + (stat del profesional - media de su club) * 0.65 */
function nivelProv(r){ return Math.round(48 + (r-70)*0.9); }

/* ============ GENERACIÓN ============ */
function media(p){
  const w = PESOS[p.pos]; let s=0;
  for(const k in w) s += (p.s[k]||0)*w[k];
  return Math.round(s);
}
function crearJugador(pos, objetivo, id){
  const p = {id, n:NOM[ri(0,NOM.length-1)]+" "+APE[ri(0,APE.length-1)], pos, ref:"",
             s:{}, moral:55, fres:100, les:0, am:0, san:0, g:0, a:0, pj:0, sin:0};
  const base = PERFIL[pos];
  for(const k in base) p.s[k] = cl(Math.round(objetivo + base[k] + gauss()*5), 20, 82);
  p.s.rem = cl(Math.round((p.s.tir||p.s.col)+gauss()*4),20,82);
  p.s.vis = cl(Math.round((p.s.pas||p.s.saq)+gauss()*4),20,82);
  p.s.ent = cl(Math.round((p.s.def||p.s.col)+gauss()*4),20,82);
  p.s.res = cl(Math.round((p.s.fis||p.s.vel)+gauss()*5),20,82);
  p.med = media(p);
  p.edad = cl(Math.round(26 + gauss()*5), 17, 39);
  p.pot  = cl(p.med + (p.edad<23?ri(4,13):p.edad<27?ri(1,6):ri(0,2)), 30, 88);
  return p;
}
function crearEquipo(i){
  const [nombre, rating, color] = CLUBES[i];
  const nivel = nivelProv(rating);
  const t = {id:i, n:nombre, dt:DT[i], refRating:rating, nivel, color, jug:[],
             pj:0,g:0,e:0,p:0,gf:0,gc:0, forma:"4-4-2", once:[]};
  const plan = [["POR",2],["DEF",6],["MED",6],["DEL",4]];
  let n=0;
  plan.forEach(([pos,cant])=>{
    for(let k=0;k<cant;k++){
      // los 11 primeros de cada línea algo mejores que los suplentes
      const obj = nivel + (k<Math.ceil(cant*0.6) ? ri(0,5) : ri(-8,-1));
      t.jug.push(crearJugador(pos, obj, i*MIL_ID+(n++)));
    }
  });
  t.jug.sort((a,b)=>["POR","DEF","MED","DEL"].indexOf(a.pos)-["POR","DEF","MED","DEL"].indexOf(b.pos) || b.med-a.med);
  t.jug.forEach(p=>{ p.club = i; });
  return t;
}
/* El sistema de siempre —rueda de toda la vida, 15 jornadas y su vuelta—, pero
   repartiendo los equipos por los puestos según el sorteo. Sin sorteo, los
   puestos son los clubes en su orden, que es como salía antes. */
function calendario(n, orden){
  const eq = orden || [...Array(n).keys()];
  const ids=[...Array(n).keys()]; const rondas=[];
  for(let r=0;r<n-1;r++){
    const j=[];
    for(let i=0;i<n/2;i++){
      const a=eq[ids[i]], b=eq[ids[n-1-i]];
      j.push(r%2===0 ? {h:a,a:b} : {h:b,a:a});
    }
    rondas.push(j);
    ids.splice(1,0,ids.pop());
  }
  const vuelta = rondas.map(j=>j.map(m=>({h:m.a,a:m.h})));
  return rondas.concat(vuelta).map(j=>j.map(m=>({...m,hg:null,ag:null})));
}

/* ============ DATOS COMUNES: datos_zamora.json ============ */
/* Los equipos, plantillas, colores, equipaciones y escudos se leen del archivo
   común que comparte con Fútbol Arcade Zamora. Si no se puede leer (juego
   abierto sin el archivo al lado, o el archivo está mal), se usa lo que va
   dentro de este HTML, que es lo mismo. Las partidas guardadas no dependen
   de él: llevan su mundo dentro. */
let DATOS_COMUNES = null;
function datosComunesValidos(d){
  if(!d || !Array.isArray(d.equipos) || d.equipos.length!==16) return false;
  return d.equipos.every((e,i)=> e && e.id===i && typeof e.nombre==="string" && typeof e.fuerza==="number"
    && Array.isArray(e.jugadores) && e.jugadores.length>=11
    && e.jugadores.filter(j=>j.posicion==="POR").length>=1
    && e.jugadores.every(j=> typeof j.nombre==="string" && ["POR","DEF","MED","DEL"].includes(j.posicion) && j.atributos));
}
function aplicarDatosComunes(d){
  const nuevos = d.equipos.map(e=>[e.nombre, e.fuerza, e.color || CLUBES[e.id][2]]);
  CLUBES.splice(0, CLUBES.length, ...nuevos);
  d.equipos.forEach(e=>{
    if(e.entrenador) DT[e.id] = e.entrenador;
    if(e.equipacion) KITS[e.id] = e.equipacion;
    if(e.escudo){ ESCUDOS[e.id] = e.escudo; delete ESC_ALIAS[e.id]; }
    else if(e.escudoDe!=null){ delete ESCUDOS[e.id]; ESC_ALIAS[e.id] = e.escudoDe; }
  });
  DATOS_COMUNES = d;
}
/* el mismo equipo que sale de crearEquipo + plantillas reales, pero leído del archivo */
function equiposDesdeDatos(){
  return DATOS_COMUNES.equipos.map(e=>{
    const t = {id:e.id, n:e.nombre, dt:e.entrenador || DT[e.id], refRating:e.fuerza, nivel:nivelProv(e.fuerza),
               color:e.color, jug:[], pj:0,g:0,e:0,p:0,gf:0,gc:0, forma:e.sistema || "4-4-2", once:[]};
    t.jug = e.jugadores.slice(0, TOPE_PLANTILLA).map((j,k)=>{
      const p = {id:(j.id!=null ? j.id : e.id*MIL_ID+300+k), n:j.nombre, pos:j.posicion, ref:j.referencia || "",
                 s:Object.assign({}, j.atributos), moral:55, fres:100, les:0, am:0, san:0, g:0, a:0, pj:0, sin:0};
      p.med = media(p);
      p.edad = (j.edad!=null) ? j.edad : 25;
      p.pot = (j.potencial!=null) ? j.potencial : p.med;
      p.club = e.id;
      if(j.apodo) p.mote = j.apodo;
      if(j.dorsal) p.dor = j.dorsal;
      if(j.posicion2) p.pos2 = j.posicion2;
      return p;
    });
    t.tac = e.tactica ? Object.assign({}, e.tactica) : tacticaAuto(t);
    t.once = onceAuto(t);
    return t;
  });
}
function cargarDatosComunes(){
  if(typeof fetch!=="function") return Promise.resolve(false);
  /* abierto a pelo desde el disco (file://) el navegador no deja leer archivos
     de al lado y lo canta por consola. No se pierde nada: lo de dentro del HTML
     es lo mismo, así que ni se intenta. */
  if(location.protocol === "file:") return Promise.resolve(false);
  return fetch("datos_zamora.json", {cache:"no-store"})
    .then(r=> r.ok ? r.json() : null)
    .then(d=>{
      if(!datosComunesValidos(d)) return false;
      aplicarDatosComunes(d);
      return true;
    })
    .catch(()=>false);
}

/* ============ ESTADO ============ */
let S = null;
/* Las plantillas son del mundo, no del sorteo: se siguen creando con la semilla
   de siempre para que los jugadores sean exactamente los mismos en todas las
   partidas. El sorteo y el resto de la temporada ya van con semilla nueva. */
function nuevaPartida(equipoId, semilla){
  SEED = 20261;   /* el mundo es el mismo dirijas a quien dirijas: mismas plantillas
                     y, por tanto, los mismos objetivos para todos */
  S = {yo:equipoId, temp:1, palmares:[], vel:"normal", sonido:true, jor:0, pre:null, junta:{conf:70, avisos:[], ultimatum:false}, despedido:null, eq:(DATOS_COMUNES ? equiposDesdeDatos() : CLUBES.map((_,i)=>crearEquipo(i))), cal:null, ult:null, hist:[],
       merc:{tipo:null, usados:0, rondas:{}, bloq:[], humor:{}, noticias:[], cerr:{pre:false,inv:false}, hecho:{pre:false,inv:false}}};
  S.eq.forEach(t=>t.once = onceAuto(t));
  if(DATOS_COMUNES){ aplicarPlanesFijos(); aplicarLesionesIniciales(); guardar(); }
  else aplicarPlantillasBase();   /* los equipos que ya tienen nombres de verdad entran aquí */
  aplicarPlanesFijos();
  repartirObjetivos();       /* la junta mira la plantilla y pone el listón */
  /* de aquí en adelante cada partida va por su cuenta: su sorteo y su suerte */
  /* >>>0: la semilla ha de ser un entero positivo de 32 bits. Con una negativa
     el generador devuelve negativos y el bombo se vuelve loco. */
  SEED = ((semilla != null) ? semilla : semillaNueva()) >>> 0;
  S.cal = calendario(16, sorteo(16));
  guardar();
}
/* ---- tres ranuras de guardado, cada una con su partida ---- */
const RANURAS = [1,2,3];
const CLAVE_VIEJA = "fmz_save_v1";
let SLOT = 1;
function claveSlot(n){ return "fmz_save_v1_s"+n; }
function leerIndice(){
  try{ return JSON.parse(localStorage.getItem("fmz_index")||"{}"); }catch(e){ return {}; }
}
function fichaSlot(n){ return leerIndice()[n] || null; }
function apuntarIndice(n, datos){
  try{
    const ix = leerIndice();
    if(datos) ix[n] = datos; else delete ix[n];
    localStorage.setItem("fmz_index", JSON.stringify(ix));
  }catch(e){}
}
function resumenPartida(){
  return {eq: S.eq[S.yo].n, jor: S.jor, ts: Date.now(), temp: temporada(),
          pts: pts(S.eq[S.yo]), fuera: !!S.despedido};
}
function guardar(){
  try{
    S.sem = SEED;          /* la suerte se guarda con la partida: al volver, sigue donde estaba */
    localStorage.setItem(claveSlot(SLOT), JSON.stringify(S));
    apuntarIndice(SLOT, resumenPartida());
    localStorage.setItem("fmz_slot", String(SLOT));
  }catch(e){}
}
function cargarSlot(n){
  try{
    const d = localStorage.getItem(claveSlot(n));
    if(d){
      S = JSON.parse(d); SLOT = n; localStorage.setItem("fmz_slot", String(n));
      if(typeof S.sem === "number") SEED = S.sem >>> 0;   /* partidas viejas no la traen: se queda la de ahora */
      return true;
    }
  }catch(e){}
  return false;
}
/* al arrancar: la ranura que se usó la última vez, y si hay partida del sistema antiguo se sube a la 1 */
function cargar(){
  try{
    const vieja = localStorage.getItem(CLAVE_VIEJA);
    if(vieja && !localStorage.getItem(claveSlot(1))){
      localStorage.setItem(claveSlot(1), vieja);
      localStorage.removeItem(CLAVE_VIEJA);
      try{
        const d = JSON.parse(vieja);
        apuntarIndice(1, {eq:d.eq[d.yo].n, jor:d.jor, ts:Date.now(), pts:0, fuera:!!d.despedido});
      }catch(e){}
    }
    const ult = +(localStorage.getItem("fmz_slot")||1);
    if(cargarSlot(ult)) return true;
    for(const n of RANURAS) if(cargarSlot(n)) return true;
  }catch(e){}
  SLOT = 1;
  return false;
}
function borrar(){
  try{ localStorage.removeItem(claveSlot(SLOT)); }catch(e){}
  apuntarIndice(SLOT, null);
  S=null;
}
function fechaCopia(ts){
  const d = new Date(ts);
  return d.getDate()+"/"+(d.getMonth()+1)+" a las "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
/* recordatorio: cada cinco jornadas conviene bajarse una copia */
const CADA_COPIA = 5;
function tocaCopia(){
  if(!S) return false;
  return (S.jor - (S.ultimaCopia||0)) >= CADA_COPIA;
}

/* ============ REGLAS DE JUEGO ============ */
function moralTxt(v){ return v>70?"Alta":(v<35?"Baja":"Normal"); }
function moralBonus(v){ return v>70?3:(v<35?-4:0); }
function disponible(p){ return p.les===0 && p.san===0; }
function afinidad(real, hueco, p){
  if(real===hueco) return 1;
  /* el que tiene un segundo puesto juega ahí casi igual de suelto */
  if(p && p.pos2 === hueco) return 0.96;
  const o=["POR","DEF","MED","DEL"];
  const d=Math.abs(o.indexOf(real)-o.indexOf(hueco));
  if(real==="POR"||hueco==="POR") return 0.45;
  return d===1?0.87:(d===2?0.74:0.55);
}
function efectivo(p, hueco){
  const base = p.med + moralBonus(p.moral);
  return base * afinidad(p.pos,hueco,p) * (0.62 + 0.38*(p.fres/100)) * (p.tocado?0.72:1);
}
function onceAuto(t){
  const huecos = FORMAS[t.forma||"4-4-2"];
  const libres = t.jug.filter(disponible);
  const usados = new Set(); const once=[];
  /* sitios reservados: el club que tiene manía con un jugador en un puesto
     concreto lo pone ahí mientras esté disponible, y si no, se cubre solo */
  const reserva = {};
  const fijos = (typeof PLAN_FIJO !== "undefined" && (PLAN_FIJO[t.id]||{}).fijos) || null;
  if(fijos) for(const hueco in fijos){
    const p = libres.find(x => x.n === fijos[hueco] && !usados.has(x.id));
    if(p && (p.pos==="POR") === (huecos[+hueco]==="POR")){ reserva[+hueco] = p; usados.add(p.id); }
  }
  huecos.forEach((h,i)=>{
    if(reserva[i]){ once.push(reserva[i].id); return; }
    const a = altura(t,i);
    let mejor=null, val=-1;
    libres.forEach(p=>{
      if(usados.has(p.id)) return;
      if((p.pos==="POR") !== (h==="POR")) return;
      const v = efectivo(p,h) * sesgoAltura(p,a);
      if(v>val){ val=v; mejor=p; }
    });
    /* si no queda gente de campo, sale un portero suplente: en la provincial pasa */
    if(!mejor && h!=="POR"){
      libres.forEach(p=>{
        if(usados.has(p.id)) return;
        const v = efectivo(p,h);
        if(v>val){ val=v; mejor=p; }
      });
    }
    if(mejor){ usados.add(mejor.id); once.push(mejor.id); } else once.push(null);
  });
  /* los cinco mejores que quedan van al banquillo */
  t.conv = libres.filter(p=>!usados.has(p.id))
                 .sort((a,b)=>efectivo(b,b.pos)-efectivo(a,a.pos)).slice(0,5).map(p=>p.id);
  return once;
}
/* El once del usuario es suyo: de un partido a otro NO se recalcula. Sólo se
   cubren los huecos de quien no puede jugar —lesionado o sancionado—, se deja
   todo lo demás como él lo dejó y se apunta el cambio para avisarle. */
function mantenerOnce(t){
  const huecos = FORMAS[t.forma||"4-4-2"];
  const once = (t.once||[]).slice();
  while(once.length < huecos.length) once.push(null);
  const usados = new Set(once.filter(x=>x!=null));
  const cambios = [];
  huecos.forEach((h,i)=>{
    const p = once[i]!=null ? t.jug.find(x=>x.id===once[i]) : null;
    if(p && disponible(p)) return;
    let mejor=null, val=-1;
    const busca = soloPuesto => t.jug.forEach(x=>{
      if(!disponible(x) || usados.has(x.id)) return;
      if(soloPuesto && (x.pos==="POR") !== (h==="POR")) return;
      const v = efectivo(x,h);
      if(v>val){ val=v; mejor=x; }
    });
    busca(true);
    if(!mejor && h!=="POR") busca(false);
    if(once[i]!=null) usados.delete(once[i]);
    if(mejor){
      usados.add(mejor.id);
      cambios.push((p?camisetaNombre(p):"un hueco") + " → " + camisetaNombre(mejor));
      once[i] = mejor.id;
    } else once[i] = null;
  });
  t.once = once;
  /* el banquillo sí se refresca solo: ahí no hay decisión del usuario */
  t.conv = t.jug.filter(p=>disponible(p) && !usados.has(p.id))
                .sort((a,b)=>efectivo(b,b.pos)-efectivo(a,a.pos)).slice(0,5).map(p=>p.id);
  S.avisoOnce = cambios.length ? cambios : null;
  return cambios;
}
function convocado(t,p){ return (t.conv||[]).includes(p.id); }
function onceJug(t){ return (t.once||[]).map(id=>t.jug.find(p=>p.id===id)||null); }
function fuerzas(t){
  const huecos = FORMAS[t.forma||"4-4-2"], once = onceJug(t);
  const wA={POR:0,DEF:.18,MED:.55,DEL:1}, wD={POR:1.3,DEF:1,MED:.35,DEL:.05};
  let atk=0,sa=0,def=0,sd=0;
  once.forEach((p,i)=>{
    if(!p) return;
    const h=huecos[i], e=efectivo(p,h), a=altura(t,i);
    const at = p.pos==="POR" ? 30 : (p.s.rit+p.s.tir+p.s.reg)/3;
    const de = p.pos==="POR" ? (p.s.par+p.s.ref+p.s.col)/3 : (p.s.def+p.s.fis)/2;
    const ka = wA[h] * (a<0 ? 1.35 : a>0 ? 0.62 : 1);
    const kd = wD[h] * (a<0 ? 0.62 : a>0 ? 1.45 : 1);
    atk += e*(at/Math.max(p.med,1))*ka; sa += ka;
    def += e*(de/Math.max(p.med,1))*kd; sd += kd;
  });
  const faltan = once.filter(p=>!p).length;
  const m = MENT[t.ment] || MENT.normal;
  const pr = TAC.presion[tactica(t).presion];
  const cap = bonusCapitan(t);
  return {atk: ((sa?atk/sa:30) - faltan*3) * m.atk * pr.atk * encaje(t) * cap,
          def: ((sd?def/sd:30) - faltan*3) * m.def * pr.def * cap};
}
/* Cuántos goles se ven en esta liga. Es el único mando del marcador, y hay un
   solo motor —minutoVivo— para los dieciséis equipos, así que subirlo o bajarlo
   mueve por igual tu partido y los siete que se juegan a la misma hora.
   Medido sobre temporadas completas de las dieciséis plantillas. */
const BASE_GOL = 1.055;
/* Lo que se recupera de una jornada a la siguiente. Un partido cuesta unos 30,
   así que una cantidad fija dejaba al que juega todas las semanas cayendo sin
   fondo: el trozo que depende de lo cascado que esté es lo que le pone suelo.
   Quien juega siempre se estabiliza cerca del 75%; quien descansa, al 100%.
   Rotar sigue mereciendo la pena, pero no rotar ya no hunde al equipo. */
function recuperaSemana(p, jugo){
  const base = jugo ? 16 + p.s.res*0.10 : 20 + p.s.res*0.12;
  p.fres = cl(p.fres + base + (100-p.fres)*0.27, 0, 100);
}
function at(p,k,alt){ return p.s[k]!==undefined?p.s[k]:(p.s[alt]!==undefined?p.s[alt]:30); }
/* el once ideal: el mejor portero, cuatro atrás, cuatro en medio y dos arriba */
function onceIdeal(notas){
  const por = notas.filter(x=>x.pos==="POR").sort((a,b)=>b.nota-a.nota).slice(0,1);
  const def = notas.filter(x=>x.pos==="DEF").sort((a,b)=>b.nota-a.nota).slice(0,4);
  const med = notas.filter(x=>x.pos==="MED").sort((a,b)=>b.nota-a.nota).slice(0,4);
  const del = notas.filter(x=>x.pos==="DEL").sort((a,b)=>b.nota-a.nota).slice(0,2);
  return por.concat(def, med, del);
}
function elige(once,huecos,peso,excluir){
  const cands = once.filter(p=>p && p!==excluir);
  if(!cands.length) return null;
  const w = cands.map(peso); const tot=w.reduce((a,b)=>a+b,0);
  if(tot<=0) return cands[0];
  let r=rnd()*tot;
  for(let i=0;i<cands.length;i++){ r-=w[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}
function jugarJornada(mio){
  const vt = mercadoTipo(); if(vt) S.merc.cerr[vt]=true;
  const j = S.cal[S.jor];
  let notasJor = [];
  j.forEach(m=>{
    const esMio = (m.h===S.yo || m.a===S.yo);
    if(esMio && mio){ m.hg=mio.gh; m.ag=mio.ga; if(mio.notas) notasJor = notasJor.concat(mio.notas); }
    else {
      if(!esMio){ S.eq[m.h].once=onceAuto(S.eq[m.h]); S.eq[m.a].once=onceAuto(S.eq[m.a]); }
      const r = simularEnVivo(m.h, m.a, "liga");
      m.hg=r.gh; m.ag=r.ga;
      if(r.notas) notasJor = notasJor.concat(r.notas);
      if(esMio) S.ult = {jor:S.jor, h:m.h, a:m.a, gh:r.gh, ga:r.ga, ev:r.ev};
    }
    aplicaTabla(m);
  });
  acumularJornada(notasJor, j);
  const miPartido = j.find(m=>m.h===S.yo||m.a===S.yo);
  if(miPartido){
    anotarPartido(miPartido.h, miPartido.a, miPartido.hg, miPartido.ag, "liga");
    notasJor.forEach(x=>{ if(x.eq===miPartido.h||x.eq===miPartido.a) verCromo(x.n, x.eq); });
  }
  S.eq[S.yo].jug.forEach(p=>verCromo(p.n, S.yo));
  S.ideal = {jor:S.jor, once:onceIdeal(notasJor)};
  S.ideal.once.forEach(x=>{
    const p = S.eq[x.eq].jug.find(y=>y.id===x.id);
    if(p) p.ideal = (p.ideal||0)+1;
  });
  S.hist.push({jor:S.jor, marc:j.map(m=>({h:m.h,a:m.a,hg:m.hg,ag:m.ag}))});
  generarPrensa(notasJor);
  S.jor++;
  S.eq.forEach(t=>aplicarEntrenamiento(t));
  if(S.jor<30) mantenerOnce(S.eq[S.yo]);
  evaluarJunta();
  if(S.jor>=30) desarrolloTemporada();
  guardar();
}
function aplicaTabla(m){
  const H=S.eq[m.h], A=S.eq[m.a];
  H.pj++;A.pj++;H.gf+=m.hg;H.gc+=m.ag;A.gf+=m.ag;A.gc+=m.hg;
  if(m.hg>m.ag){H.g++;A.p++;} else if(m.hg<m.ag){A.g++;H.p++;} else {H.e++;A.e++;}
}
function pts(t){ return t.g*3+t.e; }
function clasificacion(){
  return [...S.eq].sort((a,b)=> pts(b)-pts(a) || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf || a.n.localeCompare(b.n));
}
function goleadores(){
  const l=[];
  S.eq.forEach(t=>t.jug.forEach(p=>{ if(p.g>0) l.push({p,t}); }));
  return l.sort((a,b)=> b.p.g-a.p.g || b.p.a-a.p.a).slice(0,20);
}


/* ============ LO QUE GUARDA LA TEMPORADA ============ */
/* El partido ya medía minutos, notas y goles: aquí es donde se quedan */
function acumularJornada(notas, jornada){
  if(!notas || !notas.length) return;
  const encajados = {};                    /* goles que le metieron a cada equipo */
  (jornada||[]).forEach(m=>{ encajados[m.h]=m.ag; encajados[m.a]=m.hg; });
  notas.forEach(x=>{
    const t = S.eq[x.eq]; if(!t) return;
    const p = t.jug.find(y=>y.id===x.id); if(!p) return;
    p.min = (p.min||0) + (x.min||0);
    p.nsum = (p.nsum||0) + (x.nota||0);
    p.nn   = (p.nn||0) + 1;
    if(p.pos==="POR" && (x.min||0) >= 60){
      const gc = encajados[x.eq];
      if(gc!==undefined){
        p.gcEnc = (p.gcEnc||0) + gc;
        p.porPJ = (p.porPJ||0) + 1;
        if(gc===0) p.cero = (p.cero||0) + 1;
      }
    }
  });
}
function nota(p){ return p.nn ? p.nsum/p.nn : 0; }
function cadaCuanto(p){ return p.porPJ ? p.gcEnc/p.porPJ : 99; }
function todosLosJugadores(){
  const l=[]; S.eq.forEach(t=>t.jug.forEach(p=>l.push({p,t}))); return l;
}
function tabla(campo, orden, minimo, filtro){
  return todosLosJugadores()
    .filter(x=>(!filtro || filtro(x.p)) && (minimo===undefined || (x.p.pj||0)>=minimo))
    .map(x=>({...x, v:campo(x.p)}))
    .filter(x=>x.v>0 || orden==="asc")
    .sort((a,b)=> orden==="asc" ? a.v-b.v : b.v-a.v);
}
/* rachas de cada equipo, sacadas del historial */
function rachasEquipo(id){
  const r = [];
  S.hist.forEach(h=>{
    const m = h.marc.find(x=>x.h===id||x.a===id); if(!m) return;
    const gf = m.h===id?m.hg:m.ag, gc = m.h===id?m.ag:m.hg;
    r.push(gf>gc?"G":gf<gc?"P":"E");
  });
  let mejor=0, cur=0, peor=0, sin=0;
  r.forEach(x=>{
    cur = x==="G" ? cur+1 : 0; mejor = Math.max(mejor,cur);
    sin = x==="G" ? 0 : sin+1; peor = Math.max(peor,sin);
  });
  return {victorias:mejor, sinGanar:peor, actual:r.slice(-5).join("")};
}

/* ============ LOS ANALES DEL CLUB ============ */
/* Lo único que sobrevive al cambio de temporada: lo que has vivido en el banquillo */
function anales(){
  if(!S.anales) S.anales = {partidos:[], jug:{}, album:{}, dorados:[]};
  if(!S.anales.album) S.anales.album = {};
  if(!S.anales.dorados) S.anales.dorados = [];
  return S.anales;
}
const COMPES = {liga:"Liga", copa:"Copa", super:"Supercopa", amistoso:"Amistoso"};
function anotarPartido(h, a, gh, ga, comp, pen){
  if(h!==S.yo && a!==S.yo) return;
  if(gh===null || gh===undefined) return;
  const an = anales(), casa = (h===S.yo);
  an.partidos.push({t:temporada(), j:S.jor, c:comp, r:casa?a:h, casa,
                    gf:casa?gh:ga, gc:casa?ga:gh, pen:pen||null});
}
/* el cara a cara contra un rival, de toda la carrera */
function historial(rival){
  const l = anales().partidos.filter(x=>x.r===rival);
  const r = {pj:l.length, g:0, e:0, p:0, gf:0, gc:0, casa:{g:0,e:0,p:0}, fuera:{g:0,e:0,p:0}, ultimos:[]};
  l.forEach(x=>{
    const q = x.gf>x.gc ? "g" : x.gf<x.gc ? "p" : "e";
    r[q]++; r.gf+=x.gf; r.gc+=x.gc; (x.casa?r.casa:r.fuera)[q]++;
  });
  r.ultimos = l.slice(-5).reverse();
  return r;
}
/* los récords: lo que nadie te quita */
function records(){
  const l = anales().partidos.filter(x=>x.c!=="amistoso");
  if(!l.length) return null;
  const dif = x => x.gf-x.gc;
  const mejor = l.reduce((a,b)=> (dif(b)>dif(a) || (dif(b)===dif(a) && b.gf>a.gf)) ? b : a);
  const peor  = l.reduce((a,b)=> dif(b)<dif(a) ? b : a);
  const goleada = l.reduce((a,b)=> b.gf>a.gf ? b : a);
  let racha=0, mej=0, inv=0, mejInv=0;
  l.forEach(x=>{
    racha = x.gf>x.gc ? racha+1 : 0; mej = Math.max(mej, racha);
    inv   = x.gf>=x.gc ? inv+1 : 0;  mejInv = Math.max(mejInv, inv);
  });
  const g=l.filter(x=>x.gf>x.gc).length, e=l.filter(x=>x.gf===x.gc).length;
  return {pj:l.length, g, e, p:l.length-g-e,
          gf:l.reduce((a,b)=>a+b.gf,0), gc:l.reduce((a,b)=>a+b.gc,0),
          mejor, peor, goleada, racha:mej, invicto:mejInv};
}
/* lo que lleva hecho cada uno con tu camiseta, sumando todas las temporadas */
function historicoJugadores(){
  const an = anales(), vivos = S.eq[S.yo].jug, fin = {};
  Object.keys(an.jug).forEach(n=>{ fin[n] = Object.assign({}, an.jug[n]); });
  vivos.forEach(p=>{
    if(!fin[p.n]) fin[p.n] = {pj:0, g:0, a:0, min:0, pos:p.pos, aqui:true};
    fin[p.n].pos = p.pos; fin[p.n].aqui = true;
    fin[p.n].pj += (p.pj||0); fin[p.n].g += (p.g||0)+(p.gcp||0);
    fin[p.n].a += (p.a||0);   fin[p.n].min += (p.min||0);
  });
  return Object.keys(fin).map(n=>Object.assign({n}, fin[n]));
}
function cerrarCuentas(){                 /* al acabar el año, antes de borrar los contadores */
  const an = anales();
  S.eq[S.yo].jug.forEach(p=>{
    if(!an.jug[p.n]) an.jug[p.n] = {pj:0, g:0, a:0, min:0, pos:p.pos, aqui:false};
    const r = an.jug[p.n];
    r.pj += (p.pj||0); r.g += (p.g||0)+(p.gcp||0); r.a += (p.a||0); r.min += (p.min||0);
    r.pos = p.pos;
  });
}

/* ============ EL ÁLBUM DE CROMOS ============ */
/* Un cromo se pega cuando le has visto jugar: contra ti o contigo */
function verCromo(nombre, equipo){
  const an = anales();
  if(!an.album[nombre]) an.album[nombre] = {eq:equipo, t:temporada()};
}
function cromoDorado(nombre, equipo, motivo){
  const an = anales();
  if(an.dorados.some(x=>x.n===nombre && x.motivo===motivo && x.t===temporada())) return;
  an.dorados.push({n:nombre, eq:equipo, motivo, t:temporada()});
  verCromo(nombre, equipo);
}
function esDorado(nombre){ return anales().dorados.filter(x=>x.n===nombre); }
function cromosDe(id){
  const an = anales();
  return S.eq[id].jug.map(p=>({p, visto:!!an.album[p.n], oro:esDorado(p.n)}));
}
function cuentaAlbum(){
  const an = anales();
  let total=0, pegados=0;
  S.eq.forEach(t=>t.jug.forEach(p=>{ total++; if(an.album[p.n]) pegados++; }));
  return {total, pegados, oro:an.dorados.length};
}

/* ============ LOS TROFEOS DE FIN DE AÑO ============ */
/* La gala de la Federación: pichichi, Zamora, MVP, mejor joven y once del año */
const MIN_GALA = 12;                       /* partidos para entrar en las votaciones */
function listónGala(){
  const jugados = (S.eq[0] && S.eq[0].pj) || 0;
  return Math.min(MIN_GALA, Math.max(1, Math.round(jugados*0.45)));
}
function mejorDe(campo, orden, minimo, filtro){
  const l = tabla(campo, orden, minimo, filtro);
  return l.length ? l[0] : null;
}
function onceDelAño(minimo){
  const coge = (pos,n) => tabla(p=>nota(p), "desc", minimo, p=>p.pos===pos).slice(0,n);
  return coge("POR",1).concat(coge("DEF",4), coge("MED",4), coge("DEL",2));
}
function premiosTemporada(){
  if(!S || !S.eq) return null;
  const min = listónGala(), minPor = Math.max(6, Math.round(min*0.8));
  return {
    pichichi : mejorDe(p=>p.g||0, "desc", 0),
    asistente: mejorDe(p=>p.a||0, "desc", 0),
    zamora   : mejorDe(p=>cadaCuanto(p), "asc", 0, p=>p.pos==="POR" && (p.porPJ||0)>=minPor),
    muro     : mejorDe(p=>p.cero||0, "desc", 0, p=>p.pos==="POR" && (p.porPJ||0)>=minPor),
    mvp      : mejorDe(p=>nota(p), "desc", min),
    joven    : mejorDe(p=>nota(p), "desc", Math.max(4,Math.round(min*0.6)), p=>p.edad<=21),
    hueso    : mejorDe(p=>(p.amT||0)+(p.roj||0)*3, "desc", 0),
    once     : onceDelAño(Math.max(4,Math.round(min*0.6)))
  };
}
/* lo que se queda escrito en el palmarés cuando la temporada se borra */
function apuntarPremio(x, dec){
  return x ? {n:x.p.n, pos:x.p.pos, eq:x.t.id, v: dec ? Math.round(x.v*100)/100 : Math.round(x.v)} : null;
}
function resumenPremios(){
  const pr = premiosTemporada(); if(!pr) return null;
  return {
    pichichi : apuntarPremio(pr.pichichi), asistente: apuntarPremio(pr.asistente),
    zamora   : apuntarPremio(pr.zamora, true), muro: apuntarPremio(pr.muro),
    mvp      : apuntarPremio(pr.mvp, true),    joven: apuntarPremio(pr.joven, true),
    once     : (pr.once||[]).map(x=>({n:x.p.n, pos:x.p.pos, eq:x.t.id, v:Math.round(x.v*100)/100}))
  };
}

/* ============ MERCADO DE FICHAJES ============ */
const MINPOS = {POR:2, DEF:5, MED:5, DEL:3};
const TITPOS = {POR:1, DEF:4, MED:4, DEL:2};
/* El tope tiene que ir por encima de la plantilla más larga de la liga: si no,
   el importador recorta por abajo y se pierde un jugador sin avisar. */
const TOPE_PLANTILLA = 26, MIN_PLANTILLA = 16;
/* A cada club, su millar de identificadores. Antes iban de cien en cien y se
   pisaban: la plantilla importada numeraba desde «club*100+80» y con más de
   veinte jugadores se metía en el espacio del club siguiente. Diez jugadores
   de la liga compartían id con uno de otro equipo, y como el partido lleva la
   cuenta de amarillas y notas por id suelto, al cruzarse esos dos equipos se
   mezclaban: uno podía ver la roja por las tarjetas del otro. Con mil por
   club no se tocan ni de lejos: 0-17 los creados, 100-125 los importados y
   200-226 los de relleno. */
const MIL_ID = 1000;

function valor(p){
  return Math.pow(p.med/10,3.2) * (p.pos==="POR"?0.85:1);
}
function mediaPuesto(t,pos){
  const l = t.jug.filter(p=>p.pos===pos).sort((a,b)=>b.med-a.med).slice(0,TITPOS[pos]);
  return l.length? l.reduce((s,p)=>s+p.med,0)/l.length : 0;
}
function necesidad(t,pos){
  const faltan = MINPOS[pos] - cuantosEn(t.jug, pos);
  const base = cl(1 + (t.nivel - mediaPuesto(t,pos))/45, 0.80, 1.30);
  return base + (faltan>0 ? 0.35*faltan : 0);
}
function valorPara(t,p){ return valor(p)*necesidad(t,p.pos); }
function esEstrella(t,p){
  const orden=[...t.jug].sort((a,b)=>b.med-a.med);
  return orden.indexOf(p) < 3;
}
/* Cuántos puede poner un club en un puesto. Cuenta también a los que lo tienen
   de segundo puesto, que para eso lo tienen: el motor los hace jugar ahí al 96%
   de su nivel. Antes sólo miraba el puesto principal, y por eso la Toresana
   —once defensas, tres medios y dos de esos defensas apuntados como medios—
   figuraba por debajo del mínimo y no podía hacer ni un traspaso en toda la
   temporada: cualquier oferta se rechazaba por descuadre. */
function cuantosEn(lista, pos){
  return lista.filter(p=>p.pos===pos || p.pos2===pos).length;
}
function cuadraPlantilla(t, salen, entran){
  const ids = salen.map(p=>p.id);
  const fin = t.jug.filter(p=>!ids.includes(p.id)).concat(entran);
  if(fin.length < MIN_PLANTILLA || fin.length > TOPE_PLANTILLA) return false;
  for(const pos in MINPOS) if(cuantosEn(fin, pos) < MINPOS[pos]) return false;
  return true;
}
/* ruido fijo por jugador y ventana: repetir la misma oferta no cambia la respuesta */
function humor(objId){
  const k = "h"+objId+"_"+(S.merc.tipo||"");
  if(S.merc.humor[k]===undefined) S.merc.humor[k] = 0.94 + rnd()*0.13;
  return S.merc.humor[k];
}
function evaluarOferta(rival, objetivos, ofrecidos){
  if(!objetivos.length || !ofrecidos.length) return {ok:false, ratio:0, motivo:"Falta elegir jugadores."};
  if(!cuadraPlantilla(rival, objetivos, ofrecidos))
    return {ok:false, ratio:0, motivo:"Se les quedaría la plantilla descuadrada."};
  const mio = S.eq[S.yo];
  if(!cuadraPlantilla(mio, ofrecidos, objetivos))
    return {ok:false, ratio:0, motivo:"Tu plantilla se quedaría descuadrada."};
  let ganan=0, pierden=0;
  ofrecidos.forEach(p=> ganan += valorPara(rival,p));
  objetivos.forEach(p=> pierden += valorPara(rival,p) * (esEstrella(rival,p)?1.32:1));
  /* dar muchos jugadores por uno bueno paga peaje: el vestuario no es un almacén */
  if(ofrecidos.length > objetivos.length) ganan *= (1 - 0.09*(ofrecidos.length-objetivos.length));
  const ronda = (S.merc.rondas[objetivos[0].id]||0) + 1;
  const umbral = (ronda===1 ? 1.16 : 1.05) * humor(objetivos[0].id);
  return {ok: ganan/pierden >= umbral, ratio: ganan/pierden/umbral, ronda};
}
function traspasar(a, b, jugadores){
  jugadores.forEach(p=>{
    a.jug = a.jug.filter(x=>x.id!==p.id);
    p.moral = 62; p.sin = 0;
    b.jug.push(p);
  });
  [a,b].forEach(t=>{
    t.jug.sort((x,y)=>["POR","DEF","MED","DEL"].indexOf(x.pos)-["POR","DEF","MED","DEL"].indexOf(y.pos) || y.med-x.med);
    t.once = onceAuto(t);
  });
}
function mercadoTipo(){
  if(!S.merc) return null;
  if(S.jor===0 && !S.merc.cerr.pre) return "pre";
  if(S.jor===14 && !S.merc.cerr.inv) return "inv";
  return null;
}
function mercadoNombre(t){ return t==="pre"?"Mercado de pretemporada":"Mercado de invierno"; }
function sincronizarMercado(){
  if(!S) return;
  if(!S.vel) S.vel = "normal";
  if(!MODOS[S.modo]) S.modo = "sim";          /* partidas viejas: como estaban */
  if(S.sonido!==undefined) AU.on = S.sonido;
  if(!S.merc) S.merc = {tipo:null, usados:0, rondas:{}, bloq:[], humor:{}, noticias:[], cerr:{pre:false,inv:false}, hecho:{pre:false,inv:false}};
  sincronizarJuveniles();

    S.juv.forEach(j=>{ if(!j.club){ j.rondas=0; j.bloq=false; } });
    /* en verano las plantillas ya están hechas: los clubes solo se mueven en invierno */
    S.merc.noticias = (t==="inv") ? tradesIA().concat(juvenilesIA()) : [];

}

const JUVENILES = [

function distPunto(a, b){
  if(!a||!b) return 60;
  const dy=(a[0]-b[0])*111, dx=(a[1]-b[1])*111*Math.cos(a[0]*Math.PI/180);
  return Math.sqrt(dx*dx+dy*dy);
}
function crearJuvenil(def, i){
  const claves = def.pos==="POR" ? CLAVES_POR : CLAVES_CAMPO;
  const stats = {}; claves.forEach((k,n)=> stats[k] = def.nums[n]);
  const p = crearJugador(def.pos, NIVEL_JUVENIL, 90000+i);
  const reb = rebajaPerfil(stats, def.pos, NIVEL_JUVENIL);
  for(const k in reb) p.s[k] = cl(Math.round(reb[k]),20,82);
  p.s.rem = cl(Math.round((p.s.tir!==undefined?p.s.tir:p.s.col)+gauss()*3),20,82);
  p.s.vis = cl(Math.round((p.s.pas!==undefined?p.s.pas:p.s.saq)+gauss()*3),20,82);
  p.s.ent = cl(Math.round((p.s.def!==undefined?p.s.def:p.s.col)+gauss()*3),20,82);
  p.s.res = cl(Math.round((p.s.fis!==undefined?p.s.fis:p.s.vel)+gauss()*3),20,82);
  p.n = def.n; p.ref = def.ref; if(def.mote) p.mote = def.mote;
  p.edad = def.edad;
  p.med = media(p);
  p.pot = def.pot ? cl(def.pot,30,88) : cl(p.med + ri(10,16), 30, 88);
  p.moral = 62; p.fres = 100;
  return p;
}
function sincronizarJuveniles(){
  if(!S) return;
  if(!S.juv){
    S.juv = JUVENILES.map((def,i)=>({
      clave:def.n, de:def.de, sitio:def.sitio, pos:def.pos,
      j:crearJuvenil(def,i), club:null, rondas:0, bloq:false
    }));
  }
}
function juvLibres(){ return juvenilesEnMercado() ? (S.juv||[]).filter(x=>x.club===null) : []; }
/* lo que le tira a un chaval un club: que sea bueno, que vaya a jugar y que le pille cerca */
function atractivoJuv(x, t){
  const km = distPunto(x.sitio, SITIO[t.id]);
  let v = 0.30;
  v += (t.nivel - NIVEL_JUVENIL) * 0.014;
  v += (necesidad(t, x.pos) >= 1.05) ? 0.12 : -0.05;
  v -= cl(km/300, 0, 0.20);
  if(t.jug.length >= TOPE_PLANTILLA - 1) v -= 0.10;
  return cl(v, 0.06, 0.78);
}
function razonJuv(x, t){
  const km = Math.round(distPunto(x.sitio, SITIO[t.id]));
  const trozos = [];
  trozos.push(km<=8 ? "es de aquí al lado" : km<=40 ? `vive a ${km} km` : `le pilla a ${km} km`);
  const linea = {POR:"portería", DEF:"defensa", MED:"medio", DEL:"ataque"}[x.pos];
  trozos.push(necesidad(t,x.pos) >= 1.05 ? "y ve sitio en tu "+linea : "y en tu "+linea+" hay cola");
  return trozos.join(" ");
}
function ficharJuvenil(x, t){
  x.club = t.id;
  t.jug.push(x.j);
  t.jug.sort((a,b)=>["POR","DEF","MED","DEL"].indexOf(a.pos)-["POR","DEF","MED","DEL"].indexOf(b.pos) || b.med-a.med);
  t.once = onceAuto(t);
}
function ofrecerJuvenil(x){
  const t = S.eq[S.yo];
  if(x.club!==null) return {txt:"Ya ha firmado por otro."};
  if(x.bloq) return {txt:`${x.j.n} ya te ha dicho que no dos veces.`};
  if(S.merc.usados >= 2) return {txt:"Ya has gastado los dos fichajes de este mercado."};
  if(t.jug.length >= TOPE_PLANTILLA) return {txt:`No te caben más fichas: el tope son ${TOPE_PLANTILLA}.`};
  x.rondas++;
  const p = atractivoJuv(x, t) + (x.rondas>1 ? 0.10 : 0);   /* insistir algo vale */
  if(rnd() < p){
    ficharJuvenil(x, t);
    S.merc.usados++;
    S.merc.noticias.unshift(`${x.j.n} (${x.j.pos} ${x.j.med}, ${x.j.edad} años) firma por el ${t.n}. Venía del ${x.de}.`);
    guardar();
    return {ok:true, txt:`${x.j.n} firma. Bienvenido a ${campo(S.yo)}.`};
  }
  if(x.rondas>=2){ x.bloq = true; guardar();
    return {txt:`${x.j.n} vuelve a decir que no. Se acabó: buscará otro sitio.`}; }
  guardar();
  return {txt:`${x.j.n} se lo está pensando y de momento dice que no. Te queda un intento.`};
}
/* en invierno algún club de la zona se lleva al que quede libre */
function juvenilesIA(){

}
function puestosPorNecesidad(t){

}
function puestoFlojo(t){ return puestosPorNecesidad(t)[0]; }
function puestoSobrado(t){

/* la IA se mueve poco: una operación por equipo como mucho, y solo si les cuadra a los dos */
/* Dónde está cada club. En la provincial se ficha del pueblo de al lado:
   nadie se cruza Zamora entera para jugar un sábado. */
const SITIO = {
 0 :[42.000,-5.678],  /* Benavente */
 1 :[41.545,-5.633],  /* Coreses */
 2 :[41.520,-5.545],  /* Fresno de la Ribera */

 7 :[42.068,-5.622],  /* San Cristóbal de Entreviñas */
 8 :[41.503,-5.745],  /* Zamora */
 9 :[41.503,-5.745],  /* Zamora */
 10:[41.503,-5.745],  /* Zamora */
 11:[41.503,-5.745],  /* Zamora */

};
