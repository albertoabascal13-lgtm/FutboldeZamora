    <rect x="-1" y="-1" width="102" height="66" class="c-hierba"/>
    ${[0,1,2,3,4,5].map(i=>i%2?`<rect x="${i*16.67}" y="-1" width="16.67" height="66" class="c-franja"/>`:"").join("")}
    <rect x="1.5" y="1.5" width="97" height="61" class="c-lin"/>
    <line x1="50" y1="1.5" x2="50" y2="62.5" class="c-lin2"/>
    <circle cx="50" cy="32" r="8" class="c-lin"/><circle cx="50" cy="32" r=".8" class="c-punto"/>
    <rect x="1.5" y="16" width="14" height="32" class="c-lin"/>
    <rect x="84.5" y="16" width="14" height="32" class="c-lin"/>
    <rect x="1.5" y="25" width="5" height="14" class="c-lin"/>
    <rect x="93.5" y="25" width="5" height="14" class="c-lin"/>
    <circle cx="11" cy="32" r=".8" class="c-punto"/><circle cx="89" cy="32" r=".8" class="c-punto"/>
    <path d="M 1.5 60.5 A 2 2 0 0 0 3.5 62.5" class="c-lin"/>
    <path d="M 1.5 3.5 A 2 2 0 0 1 3.5 1.5" class="c-lin"/>
    <path d="M 98.5 60.5 A 2 2 0 0 1 96.5 62.5" class="c-lin"/>
    <path d="M 98.5 3.5 A 2 2 0 0 0 96.5 1.5" class="c-lin"/>
    ${porteria(0)}${porteria(98.5)}
    <line id="estela" x1="0" y1="0" x2="0" y2="0"/>
    <line id="tiro" x1="0" y1="0" x2="0" y2="0"/>
    ${chapa(H,"H")}${chapa(A,"A")}
    <g id="bola" transform="translate(${sb.x},${sb.y})">
      <circle class="cuero" r="1.7"/>
      <path class="gajo" d="M 0 -1 L .95 -.3 L .6 .85 L -.6 .85 L -.95 -.3 Z"/>
    </g>
  </svg>`;
}
function moverBalon(fH,fA){
  const v=S.vivo, b=v.bal, aH = b.t==="H";
  const fuerza = aH ? fH.atk/Math.max(fA.def,10) : fA.atk/Math.max(fH.def,10);
  const sigue = cl(0.44 + (fuerza-1)*0.24, 0.26, 0.74);
  if(rnd()<sigue){
    b.x = cl(b.x + (aH? ri(5,15) : -ri(5,15)), 3, 97);
    b.y = cl(b.y + ri(-9,9), 5, 59);
    if((aH && b.x>93) || (!aH && b.x<7)){        /* se pierde en el área, saca el portero */
      b.t = aH ? "A" : "H";
      b.x = aH ? 88 : 12;
    }
  } else {
    b.t = aH ? "A" : "H";
    b.x = cl(b.x + (aH? -ri(0,9) : ri(0,9)), 3, 97);
  }
  /* quién la lleva: el más cercano de los suyos */
  const t = S.eq[b.t==="H"?v.h:v.a];
  const sitio = colocacion(t, b.t), once = onceJug(t);
  let mejor=null, d=1e9;
  once.forEach((p,i)=>{
    if(!p) return;
    const dd = Math.abs(sitio[i].x-b.x)*1.6 + Math.abs(sitio[i].y-b.y);
    if(dd<d){ d=dd; mejor=p; }
  });
  b.j = mejor ? mejor.id : null;
}
function estVivo(){
  const v=S.vivo, A=v.est[v.h], B=v.est[v.a], tot=(A.pos+B.pos)||1;
  const p=Math.round(A.pos*100/tot);
  return `<span>${p}% · ${A.tiros} tiros (${A.puerta})</span><span>posesión y tiros</span><span>${100-p}% · ${B.tiros} tiros (${B.puerta})</span>`;
}
let EST_RELOJ = null, BAL_ANT = null, TIRO_RELOJ = null, POR_RELOJ = null;
/* reinicia una animación de CSS que ya estaba puesta */
function otraVez(el, clase, ms){
  if(!el) return;
  el.classList.remove(clase);
  if(el.getBBox) el.getBBox(); else void el.offsetWidth;
  el.classList.add(clase);
  setTimeout(()=>el.classList.remove(clase), ms);
}
/* el disparo sale de la chapa, el portero se estira y la red se agita */
function pintarTiro(forzar){
  const v = S.vivo; if(!v) return;
  const d = v.tiro;
  if(!d || d.min!==v.min || (d.pintado && !forzar)) return;
  d.pintado = true;
  const svg = document.querySelector(".campo2"); if(!svg) return;

  const linea = document.getElementById("tiro");
  if(linea){
    linea.setAttribute("x1",d.x0); linea.setAttribute("y1",d.y0);
    linea.setAttribute("x2",d.x1); linea.setAttribute("y2",d.y1);
    clearTimeout(TIRO_RELOJ);
    otraVez(linea, "on", 430);
  }
  /* el portero se tira hacia donde va el balón, salvo que se vaya fuera */
  if(d.tipo!=="fuera"){
    const ladoR = d.lado==="H" ? "A" : "H";
    const eqR = S.eq[d.lado==="H" ? v.a : v.h];
    const iPor = FORMAS[eqR.forma].indexOf("POR");
    const g = document.getElementById("ch-"+ladoR+"-"+iPor);
    const cuerpo = g && g.querySelector(".cuerpo");
    const sitio = colocacion(eqR, ladoR)[iPor];
    if(cuerpo && sitio){
      /* una estirada se tiene que ver: aunque el balón le llegue cerca, salta */
      const hacia = d.y1 - sitio.y, señal = hacia<0 ? -1 : 1;
      const dy = señal * cl(3.4 + Math.abs(hacia)*0.42, 3.4, 8);
      const dx = cl((d.x1-sitio.x)*0.5, -3, 3);
      cuerpo.setAttribute("transform",`translate(${dx},${dy})`);
      clearTimeout(POR_RELOJ);
      POR_RELOJ = setTimeout(()=>cuerpo.setAttribute("transform","translate(0,0)"), 520);
    }
  }
  if(d.tipo==="gol"){
    otraVez(document.querySelector(".campo-wrap"), "tiembla", 900);
    const redes = svg.querySelectorAll(".c-red");
    otraVez(redes[d.lado==="H" ? 1 : 0], "marcada", 1000);
    svg.querySelectorAll('[id^="ch-'+d.lado+'-"]').forEach(x=>otraVez(x, "salta", 1000));
  }
}
function pintaCampo(){
  const v=S.vivo; if(!v) return;
  const svg=document.querySelector(".campo2"); if(!svg) return;
  [[S.eq[v.h],"H"],[S.eq[v.a],"A"]].forEach(([t,lado])=>{
    const sitio=colocacion(t,lado), once=onceJug(t);
    once.forEach((p,i)=>{
      const g=document.getElementById("ch-"+lado+"-"+i); if(!g) return;
      g.setAttribute("transform",`translate(${sitio[i].x},${sitio[i].y})`);
      g.setAttribute("opacity", p?"1":"0");
      g.classList.toggle("con-balon", !!(p && p.id===v.bal.j));
      const tx=g.querySelector("text"); if(tx && p) tx.textContent=dorsal(t,p);
    });
  });
  /* el que lleva el balón se pone por encima: si no, otra chapa le tapa el aro */
  pintarTiro();
  const bola=document.getElementById("bola");
  const con=svg.querySelector(".chapa.con-balon");
  if(con && bola && con.nextElementSibling!==bola) svg.insertBefore(con, bola);
  if(bola){
    const sb = sitioBalon(), est = document.getElementById("estela");
    if(est && BAL_ANT && Math.hypot(sb.x-BAL_ANT.x, sb.y-BAL_ANT.y) > 14){
      est.setAttribute("x1",BAL_ANT.x); est.setAttribute("y1",BAL_ANT.y);
      est.setAttribute("x2",sb.x);      est.setAttribute("y2",sb.y);
      est.classList.add("on");
      clearTimeout(EST_RELOJ); EST_RELOJ = setTimeout(()=>est.classList.remove("on"), 260);
    }
    BAL_ANT = sb;
    bola.setAttribute("transform",`translate(${sb.x},${sb.y})`);
  }
  const ev2=document.getElementById("vest"); if(ev2) ev2.innerHTML=estVivo();
  const et=document.getElementById("vbalon");
  if(et) et.innerHTML = textoBalon();
}
function textoBalon(){
  const v=S.vivo, t=S.eq[v.bal.t==="H"?v.h:v.a];
  const p=t.jug.find(x=>x.id===v.bal.j);
  const flecha = v.bal.t==="H" ? "▶" : "◀";
  return `${camiseta(t,15)} <b>${p?esc(p.n):"—"}</b> <span class="flecha">${flecha} ataca ${esc(t.n)}</span>`;
}

/* ============ COPA Y SUPERCOPA ============ */
/* La primera temporada no hay clasificación previa de la que tirar, así que
   la copa la juegan estos ocho. A partir de la segunda entran los ocho
   primeros de la liga del año anterior, que se apuntan al cerrar la
   temporada en S.copaInv. */
const COPA_EQUIPOS = [0,1,2,3,4,5,6,9];
function invitadosCopa(){
  return (S && Array.isArray(S.copaInv) && S.copaInv.length===8) ? S.copaInv : COPA_EQUIPOS;
}
const COPA_FECHAS = {6:0, 16:1, 24:2};        /* ronda que toca según jornadas de liga jugadas */
const RONDAS = ["Cuartos de final","Semifinales","Final"];

function sincronizarCopa(){
  if(!S) return;
  if(!S.copa){
    const bombo = invitadosCopa().slice();
    for(let i=bombo.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [bombo[i],bombo[j]]=[bombo[j],bombo[i]]; }
    const cuartos=[];
    for(let i=0;i<bombo.length;i+=2) cuartos.push({h:bombo[i], a:bombo[i+1], hg:null, ag:null, pen:null});
    S.copa = {ronda:0, rondas:[cuartos], campeon:null, finalista:null, ult:null};
  }
  if(!S.super) S.super = {jugado:false, h:null, a:null, hg:null, ag:null, pen:null, campeon:null, ult:null};
}
function copaPendiente(){
  if(!S.copa || S.copa.ronda>2) return null;
  return COPA_FECHAS[S.jor]===S.copa.ronda ? S.copa.ronda : null;
}
function superPendiente(){
  return (S.jor>=30 && S.copa && S.copa.campeon!==null && !S.super.jugado);
}
function penaltis(H,A){
  const tira=t=>{
    const c=onceJug(t).filter(Boolean);
    const disp=c.filter(p=>p.pos!=="POR");
    return disp.length? disp.reduce((s,p)=>s+(p.s.tir||50),0)/disp.length : 50;
  };
  const para=t=>{ const g=onceJug(t).find(p=>p&&p.pos==="POR"); return g?(g.s.par+g.s.ref)/2:50; };
  const pH=cl(0.60+(tira(H)-para(A))/220,.45,.92), pA=cl(0.60+(tira(A)-para(H))/220,.45,.92);
  let h=0,a=0;
  for(let i=0;i<5;i++){ if(rnd()<pH) h++; if(rnd()<pA) a++; }
  while(h===a){ if(rnd()<pH) h++; if(rnd()<pA) a++; }
  return [h,a];
}
function jugarEliminatoria(m, comp){
  /* el partido en vivo ya tira los penaltis si acaba en tablas */
  const r = simularEnVivo(m.h, m.a, comp||"copa");
  m.hg=r.gh; m.ag=r.ga; m.pen=r.pen||null;
  m.gana = m.pen ? (m.pen[0]>m.pen[1]?m.h:m.a) : (r.gh>r.ga?m.h:m.a);
  return r;
}
function jugarRondaCopa(mio){
  const r = S.copa.ronda, llaves = S.copa.rondas[r];
  const juegan = new Set();
  llaves.forEach(m=>{ juegan.add(m.h); juegan.add(m.a); });
  llaves.forEach(m=>{
    const esMio = (m.h===S.yo||m.a===S.yo);
    if(esMio && mio){
      m.hg=mio.gh; m.ag=mio.ga; m.pen=mio.pen;
      m.gana = m.pen ? (m.pen[0]>m.pen[1]?m.h:m.a) : (m.hg>m.ag?m.h:m.a);
      return;
    }
    if(!esMio){ S.eq[m.h].once=onceAuto(S.eq[m.h]); S.eq[m.a].once=onceAuto(S.eq[m.a]); }
    const res = jugarEliminatoria(m, "copa");
    if(esMio) S.copa.ult = {ronda:r, jor:S.jor, h:m.h, a:m.a, gh:m.hg, ga:m.ag, pen:m.pen, ev:res.ev};
  });
  llaves.forEach(m=>anotarPartido(m.h, m.a, m.hg, m.ag, "copa", m.pen));
  /* los que no juegan esa semana descansan: media semana, no una entera */
  S.eq.forEach(t=>{ if(!juegan.has(t.id)) t.jug.forEach(p=>{
    p.fres = cl(p.fres + 10 + p.s.res*0.06 + (100-p.fres)*0.16, 0, 100); }); });
  const ganan = llaves.map(m=>m.gana);
  if(r<2){
    const sig=[];
    for(let i=0;i<ganan.length;i+=2) sig.push({h:ganan[i], a:ganan[i+1], hg:null, ag:null, pen:null});
    S.copa.rondas.push(sig);
    if(llaves.some(m=>(m.h===S.yo||m.a===S.yo) && m.gana!==S.yo)) juntaCopa(false);
  } else {
    S.copa.campeon = ganan[0];
    if(llaves[0].h===S.yo||llaves[0].a===S.yo) juntaCopa(ganan[0]===S.yo);
    S.copa.finalista = llaves[0].gana===llaves[0].h ? llaves[0].a : llaves[0].h;
  }
  S.copa.ronda++;
  if(S.jor<30) mantenerOnce(S.eq[S.yo]);
  guardar();
}
/* Reglas RFEF: si el campeón de liga gana también la copa, su plaza la ocupa el finalista de copa */
function parejaSupercopa(){
  const liga = clasificacion()[0].id, copa = S.copa.campeon;
  return liga===copa ? {h:liga, a:S.copa.finalista, doblete:true} : {h:liga, a:copa, doblete:false};
}
function jugarSupercopa(mio){
  const p = parejaSupercopa();
  S.eq.forEach(t=>{ if(t.id!==S.yo) t.once=onceAuto(t); });
  const m = {h:p.h, a:p.a, hg:null, ag:null, pen:null};
  let res = {ev:[]};
  if(mio){
    m.hg=mio.gh; m.ag=mio.ga; m.pen=mio.pen;
    m.gana = m.pen ? (m.pen[0]>m.pen[1]?m.h:m.a) : (m.hg>m.ag?m.h:m.a);
    res = {ev:mio.ev};
  } else res = jugarEliminatoria(m, "super");

const MASCARA = [
 ".BBBB....BBBB.",
 ".BBBBB..BBBBB.",
 "BBBBBBBBBBBBBB",
 "BBBBBBBBBBBBBB",
 "BBBBBBBBBBBBBB",
 "...BBBBBBBB...",

 "...BBBBBBBB..."
];
const TINTA = "#0D150E";
const CUELLO = {"0":[4,9], "1":[5,8], "2":[6,7]};
const ESE = [[2,3],[2,4],[2,5],[3,3],[4,3],[4,4],[4,5],[5,5],[6,3],[6,4],[6,5]];
function colorCelda(k,col,row){
  let c = k.base;
  if(k.tipo==="rayas"   && Math.floor(col/2)%2===1) c = k.raya;
  if(k.tipo==="rayas3"  && [1,2,6,7,11,12].includes(col)) c = k.raya;
  if(k.tipo==="banda"   && col-row>=1 && col-row<=3) c = k.raya;
  if(k.tipo==="mitades") c = col===7 ? TINTA : (col>7 ? k.raya : k.base);
  /* la S nace del hombro izquierdo */
  if(k.detalle==="s" && ESE.some(p=>p[0]===row && p[1]===col)) c = "#F2EDDF";
  /* un par de líneas finas cruzando la camiseta */
  if(k.lineas && k.lineas.filas.includes(row)) c = k.lineas.color;
  /* línea a lo largo de la manga */
  if(k.lineaManga && row===k.lineaManga.fila && (col<=2 || col>=11)) c = k.lineaManga.color;
  /* puños: el bajo de la manga, de fuera hacia dentro */
  if(k.punos && row>=2 && row<=4){
    const d = col<=1 ? col : (col>=12 ? 13-col : -1);
    if(d>=0) c = k.punos[d] || k.punos[0];
  }
  /* cuello */
  if(k.cuello && CUELLO[row] && CUELLO[row].includes(col)) c = k.cuello;
  return c;
}
/* une celdas seguidas del mismo color para no soltar cientos de rectángulos */
function rejilla(filas, color){
  let out="";
  for(let r=0;r<filas.length;r++){
    let c=0;
    while(c<filas[r].length){
      const col = color(filas[r][c], c, r);
      if(!col){ c++; continue; }
      let n=1;
      while(c+n<filas[r].length && color(filas[r][c+n], c+n, r)===col) n++;
      out += `<rect x="${c}" y="${r}" width="${n}" height="1" fill="${col}"/>`;
      c+=n;
    }
  }
  return out;
}
const _cacheKit = {};
/* «portero» pide la camiseta naranja, que es la que se ve en el campo del
   partido y en el cromo: en la pizarra del once salía con la del club y el
   portero parecía uno más. */
function kitSVG(t, portero){
  const id = portero ? "p"+t.id : t.id;
  if(_cacheKit[id]) return _cacheKit[id];
  const k = portero ? {base:KIT_PORTERO} : (KITS[t.id] || {base:t.color});
  /* una celda de margen a cada lado para que quepa el contorno */
  const an = MASCARA[0].length+2, al = MASCARA.length+2;
  const lleno = (c,r)=>{
    const cc=c-1, rr=r-1;
    return rr>=0 && rr<MASCARA.length && cc>=0 && cc<MASCARA[0].length && MASCARA[rr][cc]==="B";
  };
  const filas=[];
  for(let r=0;r<al;r++){
    let f="";
    for(let c=0;c<an;c++){
      if(lleno(c,r)) f+="B";
      else f += (lleno(c-1,r)||lleno(c+1,r)||lleno(c,r-1)||lleno(c,r+1)) ? "o" : ".";
    }
    filas.push(f);
  }
  const cuerpo = rejilla(filas,(v,c,r)=> v==="B" ? colorCelda(k,c-1,r-1) : (v==="o"?TINTA:null));
  _cacheKit[id] = {an, al, svg:cuerpo};
  return _cacheKit[id];
}
function camiseta(t, alto, portero){
  const k = kitSVG(t, portero);
  const ancho = Math.round(alto*k.an/k.al);
  return `<svg class="kit" viewBox="0 0 ${k.an} ${k.al}" width="${ancho}" height="${alto}" aria-hidden="true">${k.svg}</svg>`;
}

let _cacheAnun = null;
function anuncioSVG(alto){
  if(!_cacheAnun){
    let out="";
    for(let r=0;r<ANUNCIO.h;r++){
      const f=ANUNCIO.px[r]; let c=0;
      while(c<f.length){
        if(f[c]==="."){ c++; continue; }
        let n=1;
        while(c+n<f.length && f[c+n]===f[c]) n++;
        out += `<rect x="${c}" y="${r}" width="${n}" height="1" fill="${ANUNCIO.pal[CH_ESC.indexOf(f[c])]}"/>`;
        c+=n;
      }
    }
    _cacheAnun = out;
  }
  const ancho = Math.round(alto*ANUNCIO.w/ANUNCIO.h);
  return `<svg class="kit" viewBox="0 0 ${ANUNCIO.w} ${ANUNCIO.h}" width="${ancho}" height="${alto}" aria-hidden="true">${_cacheAnun}</svg>`;
}

const _cacheClub={};
function escudoClub(t, alto){
  const id = ESCUDOS[t.id] ? t.id : ESC_ALIAS[t.id];
  const e = ESCUDOS[id]; if(!e) return null;
  if(!_cacheClub[id]){
    let out="";
    for(let r=0;r<e.h;r++){
      const f=e.px[r]; let c=0;
      while(c<f.length){
        if(f[c]==="."){ c++; continue; }
        let n=1;
        while(c+n<f.length && f[c+n]===f[c]) n++;
        out += `<rect x="${c}" y="${r}" width="${n}" height="1" fill="${e.pal[CH_ESC.indexOf(f[c])]}"/>`;
        c+=n;
      }
    }
    _cacheClub[id]=out;
  }
  const ancho = Math.round(alto*e.w/e.h);
  return `<svg class="kit" viewBox="0 0 ${e.w} ${e.h}" width="${ancho}" height="${alto}" aria-hidden="true">${_cacheClub[id]}</svg>`;
}
/* si el club tiene escudo se usa el escudo; si no, su camiseta */

/* escudo en píxel: silueta por filas y contorno por dilatación, para que no salga punteado */
const _cacheEsc = {};
const ANCHOS = [11.5,11,10.5,10,9,8,6.5,5,3.5,2];   /* de la fila 17 a la 26 */
function escudoSVG(inv, mini){
  const clave = (inv?"i":"n")+(mini?"m":"g");
  if(_cacheEsc[clave]) return _cacheEsc[clave];
  const W=24, H=27, U=4, cx=(W-1)/2;
  const CREMA="#F2EDDF", OSCURO="#0D150E", VERDE="#12281B", CESPED="#2A8449", ROJO="#C0362A";
  const fondo = inv?CREMA:VERDE, borde = OSCURO, borde2 = null;
  const balonA = inv?OSCURO:CREMA, balonB = inv?CREMA:OSCURO;
  const medio = r => r<=16 ? 11.5 : (ANCHOS[r-17]||0);
  const dentro = (c,r) => r>=0 && r<H && c>=0 && c<W && Math.abs(c-cx) < medio(r);
  const vecino = (f,c,r)=> f(c-1,r)||f(c+1,r)||f(c,r-1)||f(c,r+1);
  const anillo1 = (c,r)=> !dentro(c,r) && vecino(dentro,c,r);
  const anillo2 = (c,r)=> !dentro(c,r) && !anillo1(c,r) && vecino(anillo1,c,r);
  const BALON = ["..XXX..",".XXXXX.","XXXXXXX","XXXOXXX","XXXXXXX",".XXXXX.","..XXX.."];
  const sube = mini ? 5 : 0;
  const bx = 8, by = 18-sube;
  const color = (c,r) => {
    if(!dentro(c,r)){
      if(anillo1(c,r)) return borde;
      if(borde2 && anillo2(c,r)) return borde2;
      return null;
    }
    const bc=c-bx, br=r-by;
    if(br>=0 && br<7 && bc>=0 && bc<7 && BALON[br][bc]!==".")
      return BALON[br][bc]==="O" ? balonB : balonA;
    if(r>=18-sube && r<=25-sube) return Math.floor((r-18+sube)/2)%2===0 ? CESPED : ROJO;
    return fondo;
  };
  let out="";
  for(let r=-2;r<H+2;r++){
    let c=-2;
    while(c<W+2){
      const col=color(c,r);
      if(!col){ c++; continue; }
      let n=1;
      while(c+n<W+2 && color(c+n,r)===col) n++;
      out += `<rect x="${c*U}" y="${r*U}" width="${n*U}" height="${U}" fill="${col}"/>`;
      c+=n;
    }
  }
  _cacheEsc[clave] = {ancho:W*U, alto:H*U, cuerpo:out};
  return _cacheEsc[clave];
}
/* La portada: el escudo aparece pixel a pixel, de arriba abajo, y el nombre
   letra a letra. Solo la primera vez que se abre el juego. */
let PORTADA_VISTA = false;
function escudoMontado(alto){
  const e = escudoSVG(false,false);
  const ancho = Math.round(alto*e.ancho/e.alto);
  let n = 0;
  const cuerpo = e.cuerpo.replace(/<rect ([^>]*?)y="([-\d.]+)"([^>]*?)\/>/g,
    (todo, a, y, b) => `<rect ${a}y="${y}"${b} class="pz" style="animation-delay:${Math.round((+y)*30 + (n++%4)*12)}ms"/>`);
  const linea = (txt, x, y, tam, color, desde) => {
    const paso = tam*0.60;
    const ini = x - (txt.length-1)*paso/2;
    return [...txt].map((c,i)=>`<text class="ltr" x="${(ini+i*paso).toFixed(1)}" y="${y}" text-anchor="middle"
      fill="${color}" font-size="${tam}" style="animation-delay:${desde+i*55}ms">${c==="&"?"&amp;":c}</text>`).join("");
  };
  const texto = linea("FÚTBOL",  48, 31, 15, "#F2EDDF", 880)
              + linea("MANAGER", 48, 46, 12, "#F2EDDF", 1030)
              + linea("ZAMORA",  48, 63, 15, "#E0392B", 1190);
  return `<svg class="escudo monta" viewBox="-8 -8 ${e.ancho+16} ${e.alto+16}" width="${ancho}" height="${alto}"
    role="img" aria-label="Fútbol Manager Zamora">${cuerpo}${texto}</svg>`;
}
function balonQueCruza(){
  return `<span class="rueda"><i>${rejillaSVG(
    ["..XXX..",".XOOOX.","XOOXOOX","XOXXXOX","XOOXOOX",".XOOOX.","..XXX.."],
    v=> v==="X" ? "#0D150E" : v==="O" ? "#F7F3E6" : null, 7, 7)}</i></span>`;
}
function rejillaSVG(filas, color, w, h){
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;shape-rendering:crispEdges">${rejilla(filas,color)}</svg>`;
}
function escudo(alto, conTexto, inv, mini){
  const e = escudoSVG(inv, mini);
  const ancho = Math.round(alto*e.ancho/e.alto);
  const texto = conTexto ? `
    <text x="48" y="31" text-anchor="middle" fill="#F2EDDF" font-size="15">FÚTBOL</text>
    <text x="48" y="46" text-anchor="middle" fill="#F2EDDF" font-size="12">MANAGER</text>
    <text x="48" y="63" text-anchor="middle" fill="#E0392B" font-size="15">ZAMORA</text>` : "";
  return `<svg class="escudo" viewBox="-8 -8 ${e.ancho+16} ${e.alto+16}" width="${ancho}" height="${alto}"
    role="img" aria-label="Fútbol Manager Zamora">${e.cuerpo}${texto}</svg>`;
}

/* Zamora a bloques: cimborrio, torres, tejados y el puente de piedra */
function skyline(){
  const b = [];
  const torre=(x,w,h,remate)=>{
    b.push(`<rect x="${x}" y="${54-h}" width="${w}" height="${h}"/>`);
    if(remate) b.push(`<rect x="${x+w/2-2}" y="${54-h-5}" width="4" height="5"/>`);
  };
  torre(2,16,12); torre(20,6,17,1); torre(28,14,10);
  torre(46,10,14); torre(58,18,9);
  /* cimborrio escalonado */
  b.push('<rect x="84" y="32" width="20" height="22"/>','<rect x="88" y="26" width="12" height="6"/>','<rect x="92" y="21" width="4" height="5"/>');
  torre(110,8,20,1); torre(122,16,11); torre(142,10,15);
  torre(156,20,9); torre(180,12,16); torre(196,8,11);
  b.push('<rect x="208" y="30" width="16" height="24"/>','<rect x="212" y="25" width="8" height="5"/>');
  torre(230,14,12); torre(248,10,18,1); torre(262,20,10); torre(286,16,14); torre(306,12,9);
  b.push('<rect x="0" y="45" width="320" height="4"/>');
  for(let x=6;x<320;x+=38) b.push(`<rect x="${x}" y="49" width="8" height="5"/>`);
  return `<svg class="skyline" viewBox="0 0 320 54" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${b.join("")}</svg>`;
}

/* el teletipo cuenta cosas, no solo números */
function partes(t){
  const p=[], tab=clasificacion();
  const mios = S.hist.slice(-3).map(j=>{
    const m=j.marc.find(x=>x.h===t.id||x.a===t.id); if(!m) return null;
    const gf=m.h===t.id?m.hg:m.ag, gc=m.h===t.id?m.ag:m.hg;
    return gf>gc?"G":gf<gc?"P":"E";
  }).filter(Boolean).reverse();
  if(mios.length>=3 && mios.every(r=>r==="G")) p.push("Tercera victoria seguida, el vestuario está encendido");
  else if(mios.length>=3 && mios.every(r=>r==="P")) p.push("Tres derrotas seguidas, la grada empieza a murmurar");
  else if(mios[0]==="G") p.push("Se llega tras ganar la última");
  else if(mios[0]==="P") p.push("Toca levantarse de la última derrota");
  const les=t.jug.filter(x=>x.les>0), san=t.jug.filter(x=>x.san>0);
  if(les.length===1) p.push(`${les[0].n} está en el parte, ${les[0].les} jornada${les[0].les>1?"s":""}`);
  else if(les.length>1) p.push(`${les.length} hombres en la enfermería`);
  if(san.length===1) p.push(`${san[0].n} cumple sanción`);
  else if(san.length>1) p.push(`${san.length} sancionados para esta jornada`);
  const pichi=[...t.jug].sort((a,b)=>b.g-a.g)[0];
  if(pichi && pichi.g>=3) p.push(`${pichi.n} lleva ${pichi.g} goles`);
  const cansados=t.jug.filter(x=>x.fres<50 && disponible(x));
  if(cansados.length>=3) p.push(`${cansados.length} jugadores con las piernas pesadas, toca rotar`);
  const bajos=t.jug.filter(x=>x.moral<35);
  if(bajos.length===1) p.push(`${bajos[0].n} anda de moral baja`);
  else if(bajos.length>1) p.push(`${bajos.length} jugadores con la moral por los suelos`);
  if(S.jor===0) p.push("Temporada "+temporada()+" de "+TEMPORADAS+": treinta jornadas por delante");
  if(S.jor===0 && temporada()===2) p.push("Último año con juveniles libres en el mercado");
  if(S.jor>=30 && !ultimaTemporada() && !S.despedido) p.push("Temporada cerrada: toca preparar la siguiente");
  if(!p.length) p.push(`${tab.indexOf(t)+1}.º con ${pts(t)} puntos, semana tranquila`);
  return p.slice(0,4);
}

function aclara(hex, k){
  const c = hex.replace("#","");
  const v = [0,2,4].map(i=>cl(Math.round(parseInt(c.slice(i,i+2),16) + (255-parseInt(c.slice(i,i+2),16))*k),0,255));
  return "#"+v.map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* ============ CARAS GENERADAS ============ */
/* Cada jugador tiene su cara. Sale de su nombre, así que siempre es la misma. */
const PIELES = [
  {C:"#F0C79F", L:"#FBDCBC", c:"#D2A278"},
  {C:"#D7A077", L:"#EFC49B", c:"#B57E58"},
  {C:"#C08D63", L:"#DCAC82", c:"#9C6840"},
  {C:"#9A6740", L:"#B98157", c:"#7A4F2E"},
  {C:"#70472A", L:"#8C5E3A", c:"#54321C"}
];
const PELOS = [
  {p:"#1A1410", P:"#2E241C"},  {p:"#241A14", P:"#3B2A1E"},
  {p:"#4A3122", P:"#63432E"},  {p:"#6E4A28", P:"#8C6136"},
  {p:"#A8792F", P:"#C9973F"},  {p:"#8A3B1E", P:"#A84F28"}
];
const CANAS = {p:"#5F5F55", P:"#828275"};
/* repetidos a propósito: en un campo de pueblo casi todos llevan el pelo corto */
const PEINADOS = ["corto","corto","corto","rapado","raya","raya","flequillo","flequillo",
                  "entradas","entradas","rizado","largo","calvo","cresta","tupe","tupe"];
const BARBAS   = ["nada","nada","nada","perilla","bigote","cerrada","recortada","candado"];

const ANCHO_C = 24, ALTO_C = 28;
/* medio ancho de la cara, fila a fila, de la 6 a la 21 */
const OVALO = [6,7,7,7,7,7,7,7,7,6,6,6,5,5,4,3];

function semillaTexto(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); }
  return (h>>>0) || 1;
}
function dados(sem){
  let x = sem;
  return n => { x ^= x<<13; x>>>=0; x ^= x>>>17; x ^= x<<5; x>>>=0; return x % n; };
}

function caraPx(nombre, edad, pos, op){
  op = op || {};
  const d = dados(semillaTexto(nombre));
  const g = []; for(let y=0;y<ALTO_C;y++) g.push(new Array(ANCHO_C).fill("."));
  /* Con la piel, el pelo, el corte y la barba puestos a mano al generador sólo
     le quedaban cuatro caras posibles, y con cinco jugadores iguales no salían
     las cuentas. Cuando el cromo lleva letra de desempate se le deja cambiar
     también la forma: el ancho de la mandíbula, la nariz y la altura de las
     cejas. Sin desempate no se toca nada, así que ninguno de los cromos que ya
     están aprobados se mueve de donde está. */
  const dv = op.var ? dados(semillaTexto("forma:"+op.var+":"+nombre)) : null;
  const mandibula = dv ? dv(3)-1 : 0;
  const narizA    = dv ? dv(3)-1 : 0;
  const cejaFija  = dv ? dv(2) : null;
  const cx = 12, hw = y => {
    const a = OVALO[Math.max(0,Math.min(15,y-6))];
    return y>=15 ? Math.max(2, a+mandibula) : a;       /* la mandíbula, sólo de la 15 para abajo */
  };
  const pon = (x,y,v)=>{ if(x>=0&&x<ANCHO_C&&y>=0&&y<ALTO_C) g[y][x]=v; };
  const fila = (y,x0,x1,v)=>{ for(let x=x0;x<=x1;x++) pon(x,y,v); };
  const dentro = (x,y)=> x>=0&&x<ANCHO_C&&y>=0&&y<ALTO_C;

  /* --- la cara --- */
  for(let y=6;y<=21;y++) fila(y, cx-hw(y), cx+hw(y)-1, "C");
  for(let y=12;y<=14;y++){ pon(cx-hw(y)-1,y,"c"); pon(cx+hw(y),y,"c"); }

  /* --- el pelo --- */
  const canoso = op.canoso!==undefined ? op.canoso : (edad>=33 ? d(3)===0 : (edad>=30 ? d(7)===0 : false));
  let estilo = op.estilo || PEINADOS[d(PEINADOS.length)];
  if(!op.estilo){
    if(edad<24 && estilo==="calvo") estilo = "corto";
    if(edad>=32 && d(3)===0) estilo = d(2) ? "entradas" : "calvo";
  }

  /* «tupealto»: los lados rapados y mucho pelo levantado arriba, el corte que
     lleva medio equipo juvenil. Empieza más alto que ninguno y deja las sienes
     al aire, que es lo que lo hace reconocible de un vistazo. */
  const melena = {corto:8, flequillo:9, rizado:9, entradas:8, calvo:-1, largo:14, raya:9, cresta:7, rapado:8, tupe:7, tupealto:8}[estilo];
  const arriba = {corto:4, flequillo:3, rizado:2, entradas:4, calvo:99, largo:3, raya:4, cresta:2, rapado:5, tupe:2, tupealto:1}[estilo];
  const vuelo  = (estilo==="rizado"||estilo==="largo") ? 1 : 0;
  /* cada corte tiene su grano: el rizo salpica, el rapado va casi a ras */
  /* Hay quien se decolora la parte de arriba y deja los lados oscuros. «puntas»
     es ese segundo color: se pinta con q y Q en las filas altas del pelo, que
     son las que se ven teñidas. Si no se pide, no cambia nada. */
  /* El primer intento teñía sólo las tres filas más altas y además respetaba el
     moteado del pelo: salía una cuña clara flotando sobre lo oscuro, con el
     borde dentado, que parecía un nido. Ahora baja hasta donde el pelo ya es
     ancho —así enlaza con las sienes— y va a un solo tono, que es como se ve
     una decoloración de verdad a esta escala. */
  const teñido = op.puntas!==undefined
    ? arriba + Math.max(2, Math.round((melena-arriba)*0.6))
    : -1;
  /* dónde empieza y acaba el pelo en cada fila, igual que lo dibuja el bucle */
  const bordePelo = y => {
    const a = hw(Math.max(6,y)) + vuelo + 1;
    let x0 = cx-a, x1 = cx+a-1;
    if(y<6 && estilo!=="tupealto"){ const enc = Math.ceil((6-y)*0.8); x0 += enc; x1 -= enc; }
    if(y<6 && estilo==="tupealto"){ x0 = cx-5; x1 = cx+4; }
    return [x0, x1];
  };
  /* el tinte se queda dentro: el filo de cada fila sigue siendo del color
     natural, y así el rubio va metido en el pelo en vez de encima */
  const tinte = (v,x,y) => {
    if(y>teñido) return v;
    const [x0,x1] = bordePelo(y);
    return (x>x0 && x<x1) ? "q" : v;
  };
  const grano = (x,y) => tinte(
                         estilo==="rizado" ? (((x*2+y*3)%5)<2 ? "P" : "p")
                       : estilo==="rapado" ? (((x+y)%2) ? "P" : "p")
                       : ((x*3+y*5)%4===0 ? "P" : "p"), x, y);

  if(estilo!=="calvo"){
    for(let y=arriba;y<=melena;y++){
      const a = hw(Math.max(6,y)) + vuelo + 1;
      let x0 = cx-a, x1 = cx+a-1;
      /* al tupé alto la coronilla no se le estrecha: por eso queda levantado */
      if(y<6 && estilo!=="tupealto"){ const enc = Math.ceil((6-y)*0.8); x0 += enc; x1 -= enc; }
      if(y<6 && estilo==="tupealto"){ x0 = cx-5; x1 = cx+4; }
      if(y>7){                                                       /* debajo, solo las patillas */
        if(estilo==="tupealto") continue;                            /* rapado: ni patillas */
        const grueso = (estilo==="largo") ? 2 : 1;
        const a = hw(y);
        for(let k=0;k<grueso;k++){
          pon(cx-a-1+k, y, grano(cx-a-1+k, y));
          pon(cx+a-k,   y, grano(cx+a-k, y));
        }
        continue;
      }
      for(let x=x0;x<=x1;x++){
        if(estilo==="entradas" && y>=6 && Math.abs(x-cx+0.5) > 4.5-(y-6)*1.5) continue;
        if(estilo==="raya" && y<=5 && x===cx+2) continue;
        if(estilo==="cresta" && y<4 && Math.abs(x-cx)>2) continue;
        if(estilo==="tupe" && y<=3 && Math.abs(x-cx+0.5)>4) continue;   /* el tupé se estrecha arriba */
        if(estilo==="tupealto" && y>=6 && Math.abs(x-cx+0.5)>3) continue; /* las sienes, al aire */
        if(estilo==="rizado" && y<=arriba+1 && (x+y)%2===0) continue;   /* el rizo no tiene borde liso */
        pon(x,y,grano(x,y));
      }
    }
    if(estilo==="flequillo"){ fila(8, cx-hw(8)+1, cx+hw(8)-2, tinte("p",cx,8)); fila(7, cx-hw(7), cx+hw(7)-1, tinte("p",cx,7)); }
  }

  /* --- cejas, ojos, nariz, boca --- */
  const ceja = 10 + (cejaFija!==null ? cejaFija : d(2)), ojo = ceja+2;
  const grosor = op.ceja || (d(4)===0 ? 2 : 1);
  for(let k=0;k<grosor;k++){
    fila(ceja+k, cx-5, cx-3, "b"); fila(ceja+k, cx+2, cx+4, "b");
  }
  fila(ojo, cx-5, cx-4, "e"); fila(ojo, cx+3, cx+4, "e");
  pon(cx-6, ojo, "L"); pon(cx+5, ojo, "L");
  pon(cx-3, ojo, "L"); pon(cx+2, ojo, "L");
  /* --- gafas --- */
  /* Van encima de los ojos, no consumen dado y sólo salen si te las pido, así
     que ningún cromo de los que ya están cambia por esto. */
  if(op.gafas){
    fila(ojo-1, cx-6, cx+5, "G");                            /* la barra de arriba y el puente */
    fila(ojo+1, cx-6, cx-3, "G"); fila(ojo+1, cx+2, cx+5, "G");
    pon(cx-6, ojo, "G"); pon(cx-3, ojo, "G");
    pon(cx+2, ojo, "G"); pon(cx+5, ojo, "G");
    pon(cx-7, ojo, "G"); pon(cx+6, ojo, "G");                /* las patillas */
  }
  /* nariz */
  const nz = ojo+2;
  for(let y=nz;y<=nz+2;y++) fila(y, cx-1, cx, "c");
  fila(nz+2, cx-2-narizA, cx+1+narizA, "c");
  /* boca */
  const bk = nz+4;
  fila(bk, cx-3, cx+2, "m");
  if(d(3)===0){ pon(cx-4,bk,"m"); pon(cx+3,bk,"m"); }
  fila(bk+1, cx-2, cx+1, "L");

  /* --- barba --- */
  let barba = op.barba || BARBAS[d(BARBAS.length)];
  if(!op.barba && edad<21 && barba==="cerrada") barba = "nada";
  if(barba!=="nada"){
    /* La barba se pintaba siempre con el pelo oscurecido, y a las recortadas y
       a las perillas eso las dejaba más densas que el propio pelo: se comían la
       cara. Esas van con «R», un tono a medio camino entre el pelo y la piel,
       que es lo que se ve cuando la barba está rapada y se transparenta. Las
       cerradas y los candados siguen con «B», bien oscuros. */
    const t = (barba==="recortada"||barba==="perilla") ? "R" : "B";
    const piel_ = (x,y)=> g[y][x]==="C"||g[y][x]==="c"||g[y][x]==="L"||g[y][x]==="m";
    if(barba==="cerrada"||barba==="candado"||barba==="recortada"){
      const desde = barba==="cerrada" ? ceja+4 : barba==="recortada" ? bk-2 : bk;
      for(let y=desde;y<=21;y++){
        const a = hw(y), borde = y>=19 ? a : (barba==="cerrada" ? 3 : barba==="recortada" ? 3 : 2);
        for(let x=cx-a;x<=cx+a-1;x++){
          if(!piel_(x,y)) continue;
          if(Math.abs(x-cx+0.5) < a-borde) continue;        /* las mejillas se dejan ver */
          if(y<=bk+1 && Math.abs(x-cx) < 3) continue;       /* la boca no se tapa */
          g[y][x] = t;
        }
      }
      fila(21, cx-3, cx+2, t);
    }
    if(barba!=="perilla") fila(bk-1, cx-3, cx+2, t);
    if(barba==="perilla"){ fila(bk+2, cx-2, cx+1, t); fila(bk+3, cx-2, cx+1, t); pon(cx-3,bk+2,t); pon(cx+2,bk+2,t); }
  }

  /* --- cuello, cuello de la camiseta y hombros --- */
  fila(22, cx-3, cx+2, "C");
  fila(22, cx-4, cx-4, "t"); fila(22, cx+3, cx+3, "t");
  fila(23, cx-6, cx+5, "t");
  fila(24, cx-9, cx+8, "s"); fila(24, cx-3, cx+2, "t");
  for(let y=25;y<=27;y++) fila(y, cx-10, cx+9, "s");
  fila(25, cx-9, cx-8, "S"); fila(25, cx+7, cx+8, "S");
  fila(26, cx-10, cx-9, "S"); fila(26, cx+8, cx+9, "S");

  /* --- el contorno negro, que es lo que lo hace parecer un cromo --- */
  const copia = g.map(f=>f.slice());
  const lleno = (x,y)=> dentro(x,y) && copia[y][x]!==".";
  for(let y=0;y<ALTO_C;y++) for(let x=0;x<ANCHO_C;x++){
    if(copia[y][x]!==".") continue;
    if(lleno(x-1,y)||lleno(x+1,y)||lleno(x,y-1)||lleno(x,y+1)) g[y][x]="o";
  }
  return {w:ANCHO_C, h:ALTO_C, px:g.map(f=>f.join("")),
          piel: op.piel!==undefined ? op.piel : d(PIELES.length),
          pelo: op.pelo!==undefined ? op.pelo : (canoso?-1:d(PELOS.length)),
          puntas: op.puntas};
}

/* En la provincial hay nombres que se repiten en dos clubes y son dos personas
   distintas. Como la cara se buscaba sólo por el nombre, el segundo heredaba el
   cromo del primero. A los repetidos se les añade el club a la clave; a los que
   son únicos no se les toca nada, para no cambiar ninguna cara ya aprobada. */
let _repes = null, _repesDe = null;
function nombreRepetido(n){
  if(_repesDe !== S){
    _repes = new Set(); const visto = {};
    (S && S.eq ? S.eq : []).forEach(t=>t.jug.forEach(p=>{
      if(visto[p.n]) _repes.add(p.n); else visto[p.n] = 1;
    }));
    _repesDe = S;
  }
  return _repes.has(n);
}
/* El club de origen no cambia aunque lo traspasen: así la cara sigue siendo
   suya toda la carrera. Antes se deducía del id dividiendo entre cien, y al
   separar los ids por millares para que no chocaran entre clubes, la cuenta
   dejó de salir: todos los jugadores con el nombre repetido en dos clubes
   perdieron su retrato y les salía la cara del generador. Ahora el club va
   escrito en el propio jugador y no hay nada que deducir. */
function clubDeOrigen(p){
  if(p.club !== undefined) return p.club;
  return Math.floor((p.id||0)/MIL_ID);
}
function claveCara(p){
  if(typeof p === "string") return p;
  return nombreRepetido(p.n) ? p.n + "@" + clubDeOrigen(p) : p.n;
}
/* Con la piel, el pelo, el corte y la barba puestos a mano queda poco margen
   para que dos jugadores del mismo tipo salgan distintos, y acaban con el cromo
   calcado. «var» mete una letra en la semilla: le cambia la cara sin tocarle
   ninguno de los rasgos que me has dicho. Sólo se usa para deshacer empates. */
function caraDe(clave, edad){
  if(!_caras[clave]){
    const g = RASGOS[clave] || {};
    _caras[clave] = caraPx(clave + (g.var || ""), edad||26, null, g);
  }
  return _caras[clave];
}
/* mezcla dos colores: t=0 deja el primero, t=1 el segundo */
function mezcla(a, b, t){
  return "#"+[1,3,5].map(k=>{
    const x = parseInt(a.substr(k,2),16), y = parseInt(b.substr(k,2),16);
    return Math.round(x+(y-x)*t).toString(16).padStart(2,"0");
  }).join("");
}
function oscurece(h, f){
  return "#"+[1,3,5].map(k=>Math.max(0,Math.round(parseInt(h.substr(k,2),16)*f)).toString(16).padStart(2,"0")).join("");
}
const KIT_PORTERO = "#E4691C";        /* en la provincial el portero va de naranja */
/* La camiseta del cromo: durante mucho tiempo fue un color plano, y así el
   Fresno, el Racing y el Atlético Zamora —tres equipos de rayas distintas—
   salían los tres de blanco liso en el álbum. Aquí se lleva al cromo lo que ya
   estaba definido en KITS: las rayas, el cuello, los puños y el detalle. La
   camiseta del retrato va de la columna cx-10 a la cx+9, veinte de ancho, así
   que las proporciones del kit de verdad (catorce) hay que traerlas a escala. */
const IZQ_CAM = 2;                    /* cx-10, con cx = 12 */
function colorCamiseta(k, x, y){
  const col = x - IZQ_CAM;                                   /* 0 a 19 */
  let c = k.base;
  if(k.tipo==="rayas"   && Math.floor(col/2)%2===1) c = k.raya;
  if(k.tipo==="rayas3"  && [2,3,9,10,16,17].includes(col)) c = k.raya;
  if(k.tipo==="banda"   && col>=8 && col<=12) c = k.raya;
  if(k.tipo==="mitades") c = col===10 ? TINTA : (col>10 ? k.raya : k.base);
  /* las líneas que cruzan el pecho: del cromo para abajo sólo se ve una */
  if(k.lineas && y===27) c = k.lineas.color;
  /* la línea que recorre la manga */
  if(k.lineaManga && y===26 && (col<=2 || col>=17)) c = k.lineaManga.color;
  /* los puños, en la punta de la manga y de fuera hacia dentro */
  if(k.punos && y>=26){
    const d = col<=1 ? col : (col>=18 ? 19-col : -1);
    if(d>=0) c = k.punos[d] || k.punos[0];
  }
  /* la S del Sanabria nace del hombro, igual que en la camiseta de verdad */
  if(k.detalle==="s" && y===25 && col>=3 && col<=5) c = "#F2EDDF";
  return c;
}
function retratoSVG(p, alto, base){
  const edad   = (typeof p === "string") ? 26 : (p.edad||26);
  /* admite un color suelto o el kit entero del club */
  let kit = (base && typeof base === "object") ? base : {base: base || "#2E3F8F"};
  if(typeof p !== "string" && p.pos === "POR") kit = {base: KIT_PORTERO};
  const quien  = claveCara(p);
  const hecho  = RETRATOS[quien];
  const r = hecho || caraDe(quien, edad);
  const clave = quien+"|"+JSON.stringify(kit);
  if(!_cacheRetrato[clave]){
    const cuello = kit.cuello || contraste(kit.base);
    const propio = (r.piel!==undefined);        /* trae piel y pelo elegidos */
    const piel = propio ? PIELES[r.piel] : null;
    const pelo = propio ? (r.pelo<0 ? CANAS : PELOS[r.pelo]) : null;
    const tinte = (propio && r.puntas!==undefined) ? PELOS[r.puntas] : pelo;   /* el pelo teñido de arriba */
    const color = (v,x,y) => v==="." ? null
      : v==="s" ? colorCamiseta(kit, x, y)
      : v==="S" ? aclara(colorCamiseta(kit, x, y), 0.22)
      : v==="t" ? cuello
      : (propio && v==="C") ? piel.C : (propio && v==="L") ? piel.L : (propio && v==="c") ? piel.c
      : (propio && v==="p") ? pelo.p : (propio && v==="P") ? pelo.P
      : (propio && v==="q") ? tinte.p : (propio && v==="Q") ? tinte.P
      : (propio && v==="B") ? oscurece(pelo.p, 0.66)
      : (propio && v==="R") ? mezcla(oscurece(pelo.p, 0.66), piel.c, 0.42)
      : (PAL_RETRATO[v] || null);
    _cacheRetrato[clave] = rejilla(r.px, color);
  }
  const m = 1;                       /* aire a los lados, que nadie roce el marco */
  const ancho = Math.round(alto*(r.w+m*2)/r.h);
  return `<svg class="kit retrato" viewBox="${-m} 0 ${r.w+m*2} ${r.h}" width="${ancho}" height="${alto}" aria-hidden="true">${_cacheRetrato[clave]}</svg>`;
}

/* ============ IMPORTAR PLANTILLAS REALES ============ */
/* Rebaja por perfil: se conserva lo que distingue al jugador y se escala a la provincial.
   stat_aquí = nivel del club + (stat_pro − media del propio pro) * 0.65            */
function mediaPro(stats, pos){
  const w = PESOS[pos]; let s=0, t=0;
  for(const k in w){ if(stats[k]!==undefined){ s += stats[k]*w[k]; t += w[k]; } }
  return t ? s/t : 75;
}
/* un titular corriente de Primera anda por 75: de ahí sale la jerarquía dentro del equipo */
const BAREMO_PRO = 75;
function rebajaPerfil(stats, pos, nivel){
  const mp = mediaPro(stats, pos), out = {};
  /* el crack sigue siendo el crack: su nivel de aquí sube con lo bueno que es allí */
  const destino = nivel + (mp - BAREMO_PRO) * 0.38;
  for(const k in stats) out[k] = cl(Math.round(destino + (stats[k]-mp)*0.65), 20, 82);
  return out;
}
const CLAVES_CAMPO = ["rit","tir","pas","reg","def","fis"];
const CLAVES_POR   = ["est","par","saq","ref","vel","col"];
const ALIAS_POS = {};
[["POR","POR PT PO GK POR1 ARQ"],
 ["DEF","DEF DF DFC CB LD LI LB RB CT CEN"],
 ["MED","MED MC MCD MCO CM CDM CAM PIV INT ED EI MP MI"],
 ["DEL","DEL DL DC ST CF SD EXT PUN"]
].forEach(([real,lista])=>lista.split(" ").forEach(a=>ALIAS_POS[a]=real));

/* una línea por jugador; el equipo se marca con una línea aparte */
function leerImport(texto){
  const lineas = texto.split(/\r?\n/);
  const out = {equipos:[], errores:[], yaDelJuego:/^\s*#\s*medias del juego/im.test(texto)};
  let actual = null;
  const llano = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  /* exacta: para una línea suelta que quiere decir "a partir de aquí, este equipo" */
  const equipoExacto = nom => {
    const n = llano(nom);
    return S.eq.find(t=>llano(t.n)===n) || S.eq.find(t=>llano(nombreCorto(t))===n) || null;
  };
  /* laxa: solo dentro de == ... ==, donde ya sabemos que es una cabecera */
  const buscaEquipo = nom => {
    const n = llano(nom);
    return equipoExacto(nom) || S.eq.find(t=>llano(t.n).includes(n) || n.includes(llano(nombreCorto(t)))) || null;
  };
  lineas.forEach((cruda,idx)=>{
    let l = cruda.trim();
    if(!l || l.startsWith("#") || l.startsWith("//")) return;
    /* cabecera de equipo: ==Nombre==, [Nombre] o una línea que sea solo un nombre de club */
    const cab = l.match(/^[=\[]+\s*(.+?)\s*[=\]]+$/);
    if(cab){
      const e = buscaEquipo(cab[1]);
      if(!e){ out.errores.push(`Línea ${idx+1}: no encuentro el equipo «${cab[1]}»`); actual=null; return; }
      actual = {eq:e, jug:[]}; out.equipos.push(actual); return;
    }
    /* una línea que sea exactamente el nombre de un club cambia de equipo */
    const eqSuelto = equipoExacto(l);
    if(eqSuelto){ actual = {eq:eqSuelto, jug:[]}; out.equipos.push(actual); return; }
    if(!actual){ out.errores.push(`Línea ${idx+1}: hay jugadores antes de decir de qué equipo son`); return; }
    /* el dorsal va el primero de todo: «9 DL Nombre = ...», y valen «9.» y «9)»
       (la almohadilla no, que en este formato abre un comentario) */
    if(/^\s*\d{3,}\s*[.):\-]?\s+[A-Za-zÁÉÍÓÚÜÑ]{2,4}(?:\s*\/\s*[A-Za-zÁÉÍÓÚÜÑ]{2,4})?[\s.:-]/.test(l)){
      out.errores.push(`Línea ${idx+1}: el dorsal tiene que ir del 1 al 99`);
      return;
    }
    let dor = null;
    /* El dorsal va delante, pero detrás puede venir el puesto doble: «15 DF/MC
       Fulano». Sin contemplar la barra, la línea no se reconocía y el jugador
       se perdía sin avisar; como sólo el Benavente lleva dorsales, no se había
       notado nunca. */
    l = l.replace(/^\s*(\d{1,2})\s*[.):\-]?\s+(?=[A-Za-zÁÉÍÓÚÜÑ]{2,4}(?:\s*\/\s*[A-Za-zÁÉÍÓÚÜÑ]{2,4})?[\s.:-])/,
                  (todo, n2)=>{ dor = +n2; return ""; });
    if(dor===0){ out.errores.push(`Línea ${idx+1}: el dorsal tiene que ir del 1 al 99`); dor = null; }
    /* POS Nombre = Referencia 78 85 70 82 45 79 */
    const m = l.match(/^\s*([A-Za-zÁÉÍÓÚÜÑ]{2,4})(?:\s*\/\s*([A-Za-zÁÉÍÓÚÜÑ]{2,4}))?[\s.:-]+(.+)$/);
    if(!m){ out.errores.push(`Línea ${idx+1}: no entiendo «${l}»`); return; }
    const pos = ALIAS_POS[m[1].toUpperCase()];
    if(!pos){ out.errores.push(`Línea ${idx+1}: «${m[1]}» no es un puesto (POR, DEF, MED o DEL)`); return; }
    /* segundo puesto opcional, separado por barra: «MED/DEL Nombre» */
    let pos2 = null;
    if(m[2]){
      pos2 = ALIAS_POS[m[2].toUpperCase()] || null;
      if(!pos2) out.errores.push(`Línea ${idx+1}: «${m[2]}» no es un puesto`);
      else if(pos2===pos) pos2 = null;
    }
    let resto = m[3];
    /* el nombre que sale en la camiseta, entre corchetes: «Izán Martín [Izán]» */
    let mote = null;
    resto = resto.replace(/\[([^\]]{1,14})\]/, (todo, m2)=>{ mote = m2.trim(); return " "; });
    /* la resistencia, cuando no acompaña al físico: «{res 55}» */
    let res = null;
    resto = resto.replace(/\{\s*res\s*(\d{1,2})\s*\}/i, (todo, r2)=>{ res = +r2; return " "; });
    /* la edad va entre paréntesis: «= Jan Virgili (17)» */
    let edad = null;
    resto = resto.replace(/\((\d{2})\)/, (todo, e)=>{ edad = +e; return " "; });
    if(edad!==null && (edad<15 || edad>52)){
      out.errores.push(`Línea ${idx+1}: ${edad} no es una edad creíble`);
      edad = null;
    }
    /* los números del final son las medias del profesional */
    const nums = [];
    resto = resto.replace(/(\d{1,2})(?=(\s|$))/g, (q)=>{ nums.push(+q); return " "; });
    let ref = "";
    const partes = resto.split(/\s*[=|:·\/]\s*/);
    const nombre = (partes[0]||"").replace(/\s+/g," ").trim();
    if(partes.length>1) ref = partes.slice(1).join(" ").replace(/\s+/g," ").trim();
    if(!nombre){ out.errores.push(`Línea ${idx+1}: falta el nombre`); return; }
    if(nums.length && nums.length!==6){
      out.errores.push(`Línea ${idx+1}: ${nombre} tiene ${nums.length} números, hacen falta 6 o ninguno`);
      return;
    }
    if(dor!==null){
      const repe = actual.jug.find(y=>y.dor===dor);
      if(repe){ out.errores.push(`Línea ${idx+1}: el dorsal ${dor} ya lo lleva ${repe.nombre}`); dor = null; }
    }
    actual.jug.push({pos, pos2, nombre, ref, edad, mote, dor, res, nums:nums.length?nums:null, linea:idx+1});
  });
  out.equipos = out.equipos.filter(e=>e.jug.length);
  return out;
}
/* aplica lo leído: reescribe la plantilla del equipo respetando los mínimos por puesto */
function aplicarImport(datos, tal_cual){
  const informe = [];
  datos.equipos.forEach(bloque=>{
    const t = bloque.eq, lista = bloque.jug.slice(0, TOPE_PLANTILLA);
    const viejos = t.jug.slice();
    t.jug = lista.map((x,i)=>{
      /* reaprovecha al mismo jugador para no perder ni edad, ni forma, ni historia;
         si no está, uno libre de su puesto */
      const llanoN = z => z.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
      let base = viejos.find(p=>!p._usado && llanoN(p.n)===llanoN(x.nombre));
      if(!base) base = viejos.find(p=>p.pos===x.pos && !p._usado);
      if(!base) base = viejos.find(p=>!p._usado);
      if(base) base._usado = true;
      const p = base ? base : crearJugador(x.pos, t.nivel, t.id*MIL_ID+100+i);
      p.n = x.nombre;
      p.club = t.id;
      p.ref = x.ref || "";
      if(x.mote) p.mote = x.mote; else delete p.mote;
      if(x.pos2) p.pos2 = x.pos2; else delete p.pos2;
      if(x.dor) p.dor = x.dor; else delete p.dor;
      if(p.pos !== x.pos){
        p.pos = x.pos;
        const nuevas = x.pos==="POR" ? CLAVES_POR : CLAVES_CAMPO;
        nuevas.forEach(k=>{ if(p.s[k]===undefined) p.s[k] = t.nivel; });
      }
      if(x.nums){
        const claves = x.pos==="POR" ? CLAVES_POR : CLAVES_CAMPO;
        const stats = {};
        claves.forEach((k,j)=> stats[k] = x.nums[j]);
        const reb = tal_cual ? stats : rebajaPerfil(stats, x.pos, t.nivel);
        for(const k in reb) p.s[k] = cl(Math.round(reb[k]),20,82);
        if(!tal_cual){   /* las sub-stats acompañan a la que les toca */
          p.s.rem = cl(Math.round((p.s.tir!==undefined?p.s.tir:p.s.col) + gauss()*3),20,82);
          p.s.vis = cl(Math.round((p.s.pas!==undefined?p.s.pas:p.s.saq) + gauss()*3),20,82);
          p.s.ent = cl(Math.round((p.s.def!==undefined?p.s.def:p.s.col) + gauss()*3),20,82);
          p.s.res = cl(Math.round((p.s.fis!==undefined?p.s.fis:p.s.vel) + gauss()*3),20,82);
        }
        /* si la línea trae resistencia propia, manda sobre la que saca del físico:
           así se puede hacer a alguien fuerte pero que se apague en la segunda parte */
        if(x.res!==null && x.res!==undefined){
          const mp = mediaPro(stats, x.pos);
          p.s.res = tal_cual ? cl(Math.round(x.res),20,82)
                             : cl(Math.round(t.nivel + (mp-BAREMO_PRO)*0.38 + (x.res-mp)*0.65),20,82);
        }
      }
      if(x.edad!==null && x.edad!==undefined){ p.edad = x.edad; p.pot = undefined; }
      p.med = media(p);
      if(p.pot===undefined || p.pot < p.med) p.pot = cl(p.med + (p.edad<23?ri(4,12):p.edad<27?ri(1,6):ri(0,2)),30,88);
      return p;
    });
    /* solo se completa lo imprescindible: porteros, y gente hasta poder vestir a once.
       De los de campo no hace falta respetar el reparto: un defensa puede subir al medio. */
    const rellenos = [];
    const meter = pos => {
      let p = viejos.find(v=>v.pos===pos && !v._usado);
      if(p) p._usado = true;
      else p = crearJugador(pos, t.nivel, t.id*MIL_ID+200+t.jug.length);
      t.jug.push(p);
      rellenos.push(pos);
    };
    while(t.jug.filter(p=>p.pos==="POR").length < MINPOS.POR && t.jug.length < TOPE_PLANTILLA) meter("POR");
    while(t.jug.length < MIN_PLANTILLA){
      /* el puesto con menos gente respecto a lo que pide una alineación */
      const flojo = ["DEF","MED","DEL"].sort((a,b)=>
        (t.jug.filter(p=>p.pos===a).length/MINPOS[a]) - (t.jug.filter(p=>p.pos===b).length/MINPOS[b]))[0];
      meter(flojo);
    }
    t.jug.forEach(p=>{ delete p._usado; });
    t.jug.sort((a,b)=>["POR","DEF","MED","DEL"].indexOf(a.pos)-["POR","DEF","MED","DEL"].indexOf(b.pos) || b.med-a.med);
    t.tac = tacticaAuto(t);
    t.once = onceAuto(t);
    const conStats = lista.filter(x=>x.nums).length;
    informe.push({eq:t.n, ok:true, txt:`${lista.length} jugadores${conStats?`, ${conStats} con stats ${tal_cual?"tal cual":"rebajadas"}`:" (solo nombres)"}`+
      (rellenos.length?`; he completado ${rellenos.length} ${rellenos.join(", ")} con gente de la plantilla anterior`:"")});
  });
  guardar();
  return informe;
}

  /* el doble pivote de siempre y Chusfe de nueve: es el que mete los goles */

/* Empiezan tocados: lo que se arrastra de la pretemporada, en jornadas de baja */
const LESIONADOS = {
  /* nombre: jornadas de baja. Ahora mismo nadie empieza tocado. */
};
function aplicarLesionesIniciales(){
  if(!S || S.jor>0) return;
  S.eq.forEach(t=>t.jug.forEach(p=>{
    const n = LESIONADOS[p.n];
    if(n){ p.les = n; p.tocado = 0; }
  }));
  S.eq.forEach(t=>{ t.once = onceAuto(t); });
}
function aplicarPlanesFijos(){
  if(!S) return;
  for(const id in PLAN_FIJO){
    const t = S.eq[+id]; if(!t) continue;
    const f = PLAN_FIJO[id];
    if(f.forma) t.forma = f.forma;
    t.tac = Object.assign(t.tac || tacticaAuto(t), f.tac || {});
    t.once = onceAuto(t);
  }
}

let ELEGIDO = 0;
/* El marco donde corre el juego bloquea los confirm() del navegador, así que
   la confirmación se pide en el propio botón: hay que tocarlo dos veces. */
function dobleToque(btn, aviso, accion){
  if(!btn) return;
  const original = btn.innerHTML;
  let armado = false, reloj = null;
  const desarmar = ()=>{ armado=false; btn.innerHTML=original; btn.classList.remove("rojo","armado"); };
  btn.onclick = ()=>{
    if(!armado){
      armado = true;
      btn.innerHTML = aviso;
      btn.classList.add(btn.classList.contains("mb") ? "armado" : "rojo");
      clearTimeout(reloj); reloj = setTimeout(desarmar, 4000);
      return;
    }
    clearTimeout(reloj); armado = false;
    accion();
  };
}

function montarRanuras(cont){
  cont.querySelectorAll("[data-ranura]").forEach(b=>b.onclick=()=>{
    const n = +b.dataset.ranura;
    if(S) guardar();                      /* la de ahora se queda a salvo antes de saltar */

      MF={rival:null,obj:null,dar:[],msg:null,ok:false}; ir("inicio"); }
  });
  cont.querySelectorAll("[data-borrar]").forEach(b=>{

    dobleToque(b, "¿?", ()=>{

    });
  });
}

let SEL = null;
/* Los dorsales: el que le hayamos puesto, y si no el primero libre.
   Se recalcula solo cuando cambia la plantilla, así que no engorda la partida. */
const _dorCache = {};
function dorsales(t){
  const clave = t.jug.map(p=>p.id+":"+(p.dor||0)).join(",");
  const c = _dorCache[t.id];
  if(c && c.clave===clave) return c.mapa;
  const mapa = {}, usados = new Set();
  t.jug.forEach(p=>{ if(p.dor>0 && !usados.has(p.dor)){ mapa[p.id]=p.dor; usados.add(p.dor); } });
  let n = 1;
  t.jug.forEach(p=>{
    if(mapa[p.id]) return;
    while(usados.has(n)) n++;
    mapa[p.id] = n; usados.add(n);
  });
  _dorCache[t.id] = {clave, mapa};
  return mapa;
}
function dorsal(t,p){ return dorsales(t)[p.id] || (t.jug.indexOf(p)+1); }
/* lo que lleva a la espalda: el apodo si lo tiene, si no el apellido */
function camisetaNombre(p){ return p.mote || p.n.split(" ").slice(1).join(" ") || p.n; }
function moralLetra(v){ return v>70?"A":(v<35?"B":"N"); }
/* ---- la pizarra: once camisetas colocadas sobre el campo ---- */
const FILAS_Y = {POR:88, DEF:68, MED:46, DEL:22};
function pizarra(t){
  const huecos = FORMAS[t.forma], once = onceJug(t);
  const lineas = {};
  huecos.forEach((h,i)=>{ const k=h+"|"+altura(t,i); (lineas[k]=lineas[k]||[]).push(i); });
  let piezas = "";
  for(const clave in lineas){
    const pos = clave.split("|")[0], a = +clave.split("|")[1];
    const l = lineas[clave], n = l.length;
    l.forEach((i,k)=>{
      const x = 100*(k+1)/(n+1), y = FILAS_Y[pos] + a*9;
      const p = once[i];
      const fuera = p && p.pos!==huecos[i];
      piezas += `<div class="jc ${p?"":"libre"} ${SEL!==null&&p&&SEL===p.id?"sel":""} ${fuera?"fuera":""}"
        style="left:${x}%;top:${y}%" data-slot="${i}" ${p?`data-arr="${p.id}"`:""}>
        ${p?camiseta(t,30,p.pos==="POR"):`<span class="hueco">${huecos[i]}</span>`}
        <span class="dorsal">${p?dorsal(t,p):"—"}</span>
        <span class="apellido">${p?esc(camisetaNombre(p)):huecos[i]}</span>
        ${pideRelevo(p)?`<span class="pide cam" title="Llega bajo de piernas">!</span>`:""}
      </div>`;
    });
  }
  return `<div class="campo-form" id="pizarra">
    <div class="cf-linea media"></div><div class="cf-circulo"></div>
    <div class="cf-area arriba"></div><div class="cf-area abajo"></div>
    ${piezas}
  </div>
  ${tiraBanquillo(t)}`;
}
/* el banquillo, a mano y arrastrable, justo debajo del campo */
function tiraBanquillo(t){
  const banca = (t.conv||[]).map(id=>t.jug.find(p=>p.id===id)).filter(Boolean);
  if(!banca.length) return `<p class="note">No hay nadie convocado en el banquillo.</p>`;
  return `<div class="tira-banq">${banca.map(p=>`
    <div class="jc chip ${SEL===p.id?"sel":""} ${disponible(p)?"":"ko"}" data-arr="${p.id}" data-fil="${p.id}">
      ${camiseta(t,26,p.pos==="POR")}
      <span class="dorsal">${dorsal(t,p)}</span>
      <span class="apellido">${esc(camisetaNombre(p))}</span>
    </div>`).join("")}</div>`;
}
/* arrastrar: vale tanto en el campo como en las listas de abajo */
let ARR = null;
function montarArrastre(cont, t){
  cont.querySelectorAll("[data-arr]").forEach(el=>{
    el.addEventListener("pointerdown", e=>{
      if(e.button && e.button!==0) return;
      const id = +el.dataset.arr;
      ARR = {id, x0:e.clientX, y0:e.clientY, movido:false, el, clon:null, destino:null};
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", e=>{
      if(!ARR || ARR.id!==+el.dataset.arr) return;
      const dx = e.clientX-ARR.x0, dy = e.clientY-ARR.y0;
      if(!ARR.movido && Math.hypot(dx,dy) < 9) return;
      if(!ARR.movido){
        ARR.movido = true;
        const r = el.getBoundingClientRect();
        const c = el.cloneNode(true);
        c.className = "clon-arr";
        c.style.width = r.width+"px";
        c.innerHTML = el.innerHTML;
        document.body.appendChild(c);
        ARR.clon = c; ARR.ancho = r.width; ARR.alto = r.height;
        el.classList.add("cogido");
      }
      ARR.clon.style.left = (e.clientX - ARR.ancho/2)+"px";
      ARR.clon.style.top  = (e.clientY - ARR.alto/2)+"px";
      ARR.clon.style.display = "none";
      const bajo = document.elementFromPoint(e.clientX, e.clientY);
      ARR.clon.style.display = "";
      const dest = bajo && bajo.closest("[data-slot],[data-arr],[data-fil]");
      if(ARR.destino && ARR.destino!==dest) ARR.destino.classList.remove("diana");
      ARR.destino = (dest && dest!==el) ? dest : null;
      if(ARR.destino) ARR.destino.classList.add("diana");
    });
    const soltar = e=>{
      if(!ARR || ARR.id!==+el.dataset.arr) return;
      if(ARR.clon) ARR.clon.remove();
      el.classList.remove("cogido");
      if(ARR.destino) ARR.destino.classList.remove("diana");
      const d = ARR.destino, arrastrado = ARR.id, movido = ARR.movido;
      ARR = null;
      if(!movido){ tocarJugador(t, arrastrado); return; }
      if(!d) return;
      let err = null;
      const otro = d.dataset.arr ? +d.dataset.arr : (d.dataset.fil ? +d.dataset.fil : null);
      if(otro!==null && !isNaN(otro)) err = intercambiar(t, arrastrado, otro);
      else if(d.dataset.slot!==undefined){
        const i = +d.dataset.slot;
        const p = t.jug.find(x=>x.id===arrastrado);
        if(!disponible(p)) err = p.n+" no está para jugar.";
        else {
          t.once = t.once.map(x=>x===arrastrado?null:x);
          t.conv = (t.conv||[]).filter(x=>x!==arrastrado);
          t.once[i] = arrastrado;
        }
      }
      SEL = null; guardar(); vOnce();
      if(err) document.getElementById("msg").innerHTML = `<p class="aviso">${esc(err)}</p>`;
    };
    el.addEventListener("pointerup", soltar);
    el.addEventListener("pointercancel", soltar);
  });
}
function tocarJugador(t, id){
  if(SEL===null){ SEL=id; vOnce(); return; }
  if(SEL===id){ SEL=null; vOnce(); return; }
  const err = intercambiar(t, SEL, id);
  SEL=null; guardar(); vOnce();
  if(err) document.getElementById("msg").innerHTML = `<p class="aviso">${esc(err)}</p>`;
}

/* ---- aviso de piernas ----
   Un titular que llega fundido rinde menos de lo que dice su media: «efectivo»
   lo multiplica por 0.62+0.38*(forma/100), así que al 60% pierdes un 15%. La
   máquina rehace su once cada jornada y el tuyo es tuyo, que para eso lo
   eliges, pero al menos hay que avisarte. El aviso habla SÓLO de energía: no
   te sugiere cambios por calidad, que la alineación es cosa tuya. */
const FRES_AVISO = 70;
function pideRelevo(p){ return !!p && (p.tocado || p.fres < FRES_AVISO); }
function avisoPiernas(t){
  if(!t || !t.once) return [];
  const huecos = FORMAS[t.forma||"4-4-2"];
  const dentro = new Set(t.once);
  const banca = t.jug.filter(x=>disponible(x) && !dentro.has(x.id));
  const pillados = new Set();      /* el mismo suplente no vale para dos puestos */
  const out = [];
  onceJug(t).forEach((p,i)=>{
    if(!pideRelevo(p)) return;
    const h = huecos[i], ahora = efectivo(p,h) || 1;
    let mejor = null, tope = ahora*1.04;      /* que gane algo de verdad, no por un pelo */
    banca.forEach(x=>{
      if(pillados.has(x.id)) return;
      const v = efectivo(x,h); if(v>tope){ tope=v; mejor=x; }
    });
    if(mejor) pillados.add(mejor.id);
    out.push({p, hueco:h, mejor});
  });
  return out;
}
function fila(t,p,hueco,grupo){
  const est = p.les>0?"les":p.san>0?"san":(p.fres<50?"cans":"");
  const ef = Math.round(p.fres);
  const ml = moralLetra(p.moral);
  const fuera = hueco && p.pos!==hueco;
  const marca = p.les>0?`<span class="marca">✚ ${p.les} jor.</span>`:p.san>0?`<span class="marca">sanción</span>`:"";
  return `<button class="fil ${est} ${SEL===p.id?"sel":""}" data-fil="${p.id}" data-arr="${p.id}" data-gr="${grupo}">
    <span class="nu">${dorsal(t,p)}</span>
    <span class="p ${hueco||p.pos} ${fuera?"fuera":""}">${hueco||p.pos}</span>
    <span class="jn">${esc(p.n)} ${marca}${hueco&&pideRelevo(p)?`<span class="pide" title="Llega bajo de piernas">!</span>`:""}</span>
    <span class="cel ${ef>=75?"n-ok":ef>=50?"n-med":"n-mal"}">${ef}</span>
    <span class="cel"><i class="mo ${ml==="A"?"a":ml==="B"?"b":"n"}" title="Moral ${moralTxt(p.moral)}"></i></span>
    <span class="cel me">${p.med}</span>
  </button>`;
}
function cabecera(){
  return `<div class="fil cab"><span class="nu">Nº</span><span></span><span class="jn">Jugador</span>
    <span class="cel">EF</span><span class="cel">MO</span><span class="cel">ME</span></div>`;
}
function intercambiar(t,a,b){
  const pa=t.jug.find(p=>p.id===a), pb=t.jug.find(p=>p.id===b);
  const ia=t.once.indexOf(a), ib=t.once.indexOf(b);
  const ca=(t.conv||[]).indexOf(a), cb=(t.conv||[]).indexOf(b);
  const entra = p => { if(!disponible(p)) return "no está para jugar"; return null; };
  if(ia>=0 && ib>=0){ t.once[ia]=b; t.once[ib]=a; return null; }
  if(ia>=0){
    const m=entra(pb); if(m) return `${pb.n} ${m}.`;
    t.once[ia]=b;
    if(cb>=0) t.conv[cb]=a; else t.conv=(t.conv||[]).filter(x=>x!==b);
    return null;
  }
  if(ib>=0){
    const m=entra(pa); if(m) return `${pa.n} ${m}.`;
    t.once[ib]=a;
    if(ca>=0) t.conv[ca]=b; else t.conv=(t.conv||[]).filter(x=>x!==a);
    return null;
  }
  if(ca>=0 && cb>=0){ t.conv[ca]=b; t.conv[cb]=a; return null; }
  if(ca>=0){ const m=entra(pb); if(m) return `${pb.n} ${m}.`; t.conv[ca]=b; return null; }
  if(cb>=0){ const m=entra(pa); if(m) return `${pa.n} ${m}.`; t.conv[cb]=a; return null; }
  return null;
}
function vOnce(){
  const t=S.eq[S.yo];
  if(!t.conv) onceAuto(t);
  if(!t.ment) t.ment="normal";
  const huecos=FORMAS[t.forma], once=onceJug(t);
  const conv=(t.conv||[]).map(id=>t.jug.find(p=>p.id===id)).filter(Boolean);
  const fuera=t.jug.filter(p=>!t.once.includes(p.id) && !convocado(t,p));
  const completos=once.filter(Boolean).length;
  const val = completos===11 ? Math.round(once.reduce((s,p,i)=>s+(p?efectivo(p,huecos[i]):0),0)/11) : null;
  const f=fuerzas(t);
  const sel = SEL!==null ? t.jug.find(p=>p.id===SEL) : null;

  const aviso = (S.avisoOnce||[]).length
    ? `<div class="panel rojo"><h2>He tenido que tocar el once</h2>
         <p class="note">No podían jugar, así que les cubrí el sitio. Lo demás está como lo dejaste:
         ${S.avisoOnce.map(x=>esc(x)).join(" · ")}</p></div>` : "";
  /* quién llega fundido y, si lo hay, quién está mejor esta semana en su puesto */
  const cansa = avisoPiernas(t);
  const avisoFres = cansa.length ? `<div class="panel oro"><h2>
      <span class="pide">!</span> ${cansa.length===1?"Uno llega bajo de piernas":cansa.length+" llegan bajos de piernas"}</h2>
    <div class="tw"><table><tbody>${cansa.map(x=>
      `<tr><td><span class="eq">${esc(x.p.n)}</span>${x.p.tocado?" · tocado":""}</td>
       <td class="n ${x.p.fres<50?"n-mal":"n-med"}">${Math.round(x.p.fres)}%</td>
       <td>${x.mejor?"mejor "+esc(camisetaNombre(x.mejor))+" ("+Math.round(x.mejor.fres)+"%)"
                   :"<span class=\"soft\">no hay recambio mejor</span>"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">Un jugador al 60% rinde un 15% menos de lo que dice su media. Cámbialos tú,
    o toca <b>Automática</b> para que salga el mejor once de esta semana.</p></div>` : "";
  document.getElementById("s-once").innerHTML= aviso + avisoFres + `
  <div class="panel"><h2>Formación</h2>
    <div class="fmrow">
      <select id="forma">${Object.keys(FORMAS).map(k=>`<option ${k===t.forma?"selected":""}>${k}</option>`).join("")}</select>
      <button class="btn ghost" id="auto" style="margin:0">Automática</button>
    </div>
    <div class="tac-fila"><span class="tac-tit">Mentalidad</span>
      <div class="tac-ops cinco">${ORDEN_MENT.map(k=>`<button class="mb ${t.ment===k?"on":""}" data-m2="${k}">${MENT[k].corto}</button>`).join("")}</div></div>
    ${selectorTac(t,"tac2")}
    ${pizarra(t)}
    <p class="note">${sel?`<b>${esc(sel.n)}</b> marcado. Toca a otro para cambiarlos de sitio.`:"Arrastra las camisetas por el campo, o tócalas de dos en dos. También vale con las listas de abajo."}</p>
    ${completos<11?`<p class="aviso">Te faltan ${11-completos} por colocar.</p>`:""}
    <div id="msg"></div>
  </div>

  <div class="panel verde lista"><h2>Once titular</h2>
    ${cabecera()}
    ${huecos.map((h,i)=>once[i]?fila(t,once[i],h,"once"):
      `<button class="fil vacia" data-slot="${i}"><span class="nu">—</span><span class="p ${h}">${h}</span><span class="jn">puesto libre</span><span class="cel"></span><span class="cel"></span><span class="cel"></span></button>`).join("")}
  </div>

  <div class="panel oro lista"><h2>Jugadores convocados</h2>
    ${conv.length?cabecera()+conv.map(p=>fila(t,p,null,"conv")).join(""):`<p class="note">Nadie en el banquillo.</p>`}
  </div>

  <div class="panel lista"><h2>No convocados</h2>
    ${fuera.length?cabecera()+fuera.map(p=>fila(t,p,null,"fuera")).join(""):`<p class="note">Todos entran en la convocatoria.</p>`}
    <p class="note">Quedarse fuera de la lista desanima más que estar en el banquillo.</p>
  </div>

  <div class="panel verde"><h2>Cómo sale el equipo</h2>
    <div class="tw"><table><tbody>
    <tr><td>Rendimiento medio del once</td><td class="n"><b>${val??"—"}</b></td></tr>
    <tr><td>Empuje en ataque</td><td class="n">${Math.round(f.atk)}</td></tr>
    <tr><td>Solidez atrás</td><td class="n">${Math.round(f.def)}</td></tr>
    </tbody></table></div>
    <p class="note">Plan: ${esc(planTexto(t))}.</p>
    <p class="note">EF es la forma física, MO la moral y ME la media. El rendimiento ya las cuenta todas, y también jugar fuera de puesto.</p>
  </div>`;

  document.querySelectorAll("[data-m2]").forEach(b=>b.onclick=()=>{ t.ment=b.dataset.m2; guardar(); vOnce(); });
  document.querySelectorAll("[data-tac2]").forEach(b=>b.onclick=()=>{
    const [eje,val]=b.dataset.tac2.split(":"); tactica(t)[eje]=val; guardar(); vOnce();
  });
  document.getElementById("forma").onchange=e=>{ t.forma=e.target.value; onceAuto(t); t.once=onceAuto(t); SEL=null; guardar(); vOnce(); };
  document.getElementById("auto").onclick=()=>{ t.once=onceAuto(t); SEL=null; guardar(); vOnce(); };
  document.querySelectorAll("[data-fil]").forEach(b=>b.onclick=e=>{
    if(ARR) return;
    const crudo = b.dataset.fil;
    const id = (crudo===undefined || crudo==="") ? null : +crudo;
    if(id===null) return;
    tocarJugador(t, id);
  });
  document.querySelectorAll(".fil.vacia[data-slot]").forEach(b=>b.onclick=()=>{
    if(SEL===null) return;
    const p=t.jug.find(x=>x.id===SEL);
    if(!disponible(p)){ document.getElementById("msg").innerHTML=`<p class="aviso">${esc(p.n)} no está para jugar.</p>`; return; }
    t.once=t.once.map(x=>x===SEL?null:x);
    t.conv=(t.conv||[]).filter(x=>x!==SEL);
    t.once[+b.dataset.slot]=SEL; SEL=null; guardar(); vOnce();
  });
  montarArrastre(document.getElementById("s-once"), t);
}

function eqM(id){ return `<div class="e">${emblema(S.eq[id],32)}<span>${esc(S.eq[id].n)}</span></div>`; }

function iconoEv(t){
  return {gol:ico("balon",18), amar:ico("tarjeta",18,"#E0A82E"), roja:ico("tarjeta",18,"#C0362A"),
          les:ico("cruz",18,"#C0362A"), san:ico("tarjeta",18,"#E0A82E"), pen:ico("balon",18),
          cambio:ico("cambio",18), tactica:ico("pizarra",18,"#35607C"), desc:ico("calen",18), charla:ico("acta",18,"#B0802F"), tiro:ico("balon",16,"#8C9189")}[t] || "";
}
function feedVivo(){
  const v=S.vivo;
  if(!v.ev.length) return `<p class="note">Sin novedades todavía.</p>`;
  return v.ev.slice().reverse().map(e=>`<div class="ev"><span class="m">${e.m}'</span>
    <span>${iconoEv(e.t)}</span>
    <span>${e.t==="desc"?"":camiseta(S.eq[e.lado==="H"?v.h:v.a],15)}</span>
    <span>${esc(e.txt)}</span></div>`).join("");
}
/* las tres últimas jugadas, pegadas al campo para no perder de vista el partido */
let VTAB = "feed";
function tickerVivo(){
  const v=S.vivo;
  const ult = v.ev.slice(-3).reverse();
  if(!ult.length) return `<div class="tk vacio">Aún no ha pasado nada.</div>`;
  return ult.map((e,i)=>`<div class="tk ${i===0?"nuevo":""} ${e.t}"><span class="m">${e.m}'</span>
    <span>${iconoEv(e.t)}</span><span>${e.t==="desc"?"":camiseta(S.eq[e.lado==="H"?v.h:v.a],14)}</span>
    <span class="tx">${esc(e.txt)}</span></div>`).join("");
}
function pintaMarcador(){
  const v=S.vivo; if(!v) return;
  const min=document.getElementById("vmin"), mar=document.getElementById("vmarc");
  if(min) min.textContent = v.min+"'";
  if(mar) mar.textContent = v.gh+"-"+v.ga;
  const f=document.getElementById("vfeed");
  if(f) f.innerHTML = feedVivo();
  const tk=document.getElementById("vticker");
  if(tk) tk.innerHTML = tickerVivo();
}

/* la raya se calcula sobre la columna DENTRO del fotograma, para que los tres
   salgan con la camiseta igual y no parpadee al cambiar de uno a otro */
function cineRaya(ropa, x){
  if(!ropa.raya) return false;
  const c = x % CINE_ANCHO_FOTO;
  if(ropa.tipo === "rayas")   return Math.floor(c/3) % 2 === 1;
  if(ropa.tipo === "rayas3")  return (c % 8) < 3;
  if(ropa.tipo === "banda")   return (c % 11) < 4;
  if(ropa.tipo === "mitades") return c >= 40;
  return false;
}
function cineColor(ropa, ch, x){
  if(ch === "J") return cineRaya(ropa, x) ? ropa.raya : ropa.camiseta;
  if(ch === "K") return ropa.medias;
  if(ch === "P") return ropa.pantalon;
  if(ch === "L") return "#FCFCFC";
  return CINE_PAL[ch];
}
const CINE_W = 240, CINE_H = 144;        /* lienzo de la escena */
const CINE_JX = 110, CINE_JY = -10;      /* dónde va el marco del jugador */
const CINE_BX = 94,  CINE_BY = 61;       /* el balón, en el contacto */

function cineFilas(txt){
  return txt.split("|").map(ln=>{
    let out = "", i = 0;
    while(i < ln.length){
      const ch = ln[i++]; let n = "";
      while(i < ln.length && "0123456789abcdefghijklmnopqrstuvwxyz".indexOf(ln[i]) >= 0) n += ln[i++];
      out += ch.repeat(n ? parseInt(n, 36) : 1);
    }
    return out;
  });
}
const _cineRec = {}, _cineFilas = {};
function cineRec(clave, txt, color){
  if(_cineRec[clave]) return _cineRec[clave];
  const filas = _cineFilas[txt] || (_cineFilas[txt] = cineFilas(txt));
  const w = filas[0].length, h = filas.length;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), d = g.createImageData(w, h);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    const ch = filas[y][x];
    const col = color ? color(ch, x, y) : CINE_PAL[ch];
    if(!col) continue;
    const i = (y*w + x)*4;
    d.data[i]   = parseInt(col.substr(1,2), 16);
    d.data[i+1] = parseInt(col.substr(3,2), 16);
    d.data[i+2] = parseInt(col.substr(5,2), 16);
    d.data[i+3] = 255;
  }
  g.putImageData(d, 0, 0);
  _cineRec[clave] = c.toDataURL();
  return _cineRec[clave];
}
function cineJugador(id){
  const ropa = ropaDe(id);
  return cineRec("hoja" + id, CINE_HOJA, (ch, x) => cineColor(ropa, ch, x));
}

let CINE_RELOJES = [];
function pararEscena(){ CINE_RELOJES.forEach(clearTimeout); CINE_RELOJES = []; }
function cineLuego(ms, f){ CINE_RELOJES.push(setTimeout(f, ms)); }
