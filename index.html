/* ============ LA ESCENA DEL TIRO ============ */
/* Vive encima del campo, en el mismo lienzo retro que la celebración del gol,
   y se juega con un dedo: pulsas para fijar la dirección, mantienes para medir
   la fuerza, sueltas para golpear y justo después puedes meterle efecto. La
   calidad del golpeo sale de esas tres cosas y es lo único que se le pasa al
   motor; el resto de la jugada ya estaba decidido. */
const TIRO_BARRIDO = 900;          /* lo que tarda la mira en cruzar la portería */
const TIRO_CARGA   = 760;          /* lo que tarda la fuerza en subir del todo */
const TIRO_EFECTO  = 520;          /* ventana para meterle efecto tras el golpeo */
/* El punto dulce de la fuerza. Es el mismo 0.78 que usa calidadGolpeo para
   puntuar, y los cortes de abajo son sólo la lectura visual de esa cuenta: no
   tocan nada del cálculo ni de las probabilidades. */
const TIRO_PUNTO = 0.78, TIRO_CLAVADO = 0.08, TIRO_DECENTE = 0.20;
function zonaFuerza(f){
  const d = Math.abs(f - TIRO_PUNTO);
  return d<=TIRO_CLAVADO ? "perfecto" : d<=TIRO_DECENTE ? "bueno" : "malo";
}
const VEREDICTO = {perfecto:"¡PERFECTO!", bueno:"BUEN TIRO", malo:"MAL GOLPEO"};
/* los cuatro finales posibles de una ocasión */
const REMATE = {gol:"¡GOOOL!", parada:"¡LA SACA!", fuera:"FUERA", bloqueo:"LA BLOQUEAN"};
let TIRO_ESCENA = null;

function pararEscenaTiro(){
  if(TIRO_ESCENA){
    if(TIRO_ESCENA.raf) cancelAnimationFrame(TIRO_ESCENA.raf);
    (TIRO_ESCENA.relojes||[]).forEach(clearTimeout);
    TIRO_ESCENA = null;
  }
}
/* dónde se coloca el portero, de 0 (su izquierda) a 1 (su derecha) */
function porteroDe(m){
  const v = S.vivo;
  const rival = S.eq[m.lado==="H" ? v.a : v.h];
  const port = onceJug(rival).find(p=>p && p.pos==="POR");
  /* se tapa el lado por el que viene el balón, sin clavarlo */
  const sesgo = cl((m.desde.y-32)/30, -1, 1);
  return {p:port, x: cl(0.5 + sesgo*0.22, 0.2, 0.8)};
}
/* la nota del golpeo: colocación lejos del portero, fuerza en su punto y el
   efecto como propina si lo metes hacia el lado contrario al que se tira */
function calidadGolpeo(m, mira, fuerza, efecto){
  const g = porteroDe(m);
  const lejos = cl(Math.abs(mira - g.x)/0.42, 0, 1);              /* colocación */
  const esquina = 1 - cl(Math.abs(mira-0.5)/0.5, 0, 1)*0.0;       /* los palos no penalizan */
  const pot = 1 - cl(Math.abs(fuerza - 0.78)/0.42, 0, 1);         /* el punto dulce */
  const curva = cl(efecto*(mira<g.x ? -1 : 1), -1, 1);            /* abriéndola, mejor */
  return cl(0.14 + 0.46*lejos*esquina + 0.30*pot + 0.10*cl((curva+1)/2,0,1), 0, 1);
}
/* resolver(calidad) → cierra la jugada en el motor y devuelve cómo acabó:
   "gol", "parada", "fuera" o "bloqueo". alAcabar(tipo) se llama cuando la
   escena ya se ha quitado de en medio. */
function escenaTiro(m, resolver, alAcabar){
  const caja = document.getElementById("vcine");
  const auto = (S.modo === "auto");
  if(!caja || S.sinCine){ alAcabar(resolver(null) || "fuera"); return; }   /* sin cine, lo resuelve el motor */
  pararEscena(); pararEscenaTiro();
  const v = S.vivo;
  const equipo = (m.lado === "A") ? v.a : v.h;
  const port = porteroDe(m);
  const nombre = (S.eq[m.lado==="H"?v.h:v.a].jug.find(p=>p.id===m.autorId)||{}).n || "Tu delantero";
  caja.innerHTML =
    '<div class="lienzo tiro-esc" id="tiroEsc">'
    + '<div class="fondo" style="background-image:url(' + cineRec("fondo", CINE_FONDO) + ')"></div>'
    + '<div class="jug" id="tjug" style="background-image:url(' + cineJugador(equipo) + ')"></div>'
    + '<div class="bal" id="tbal" style="background-image:url(' + cineRec("balon", CINE_BALON) + ')"></div>'
    + '<div class="t-marco"><div class="t-port" id="tport"></div><div class="t-mira" id="tmira"></div></div>'
    + '<div class="t-barra"><i id="tfuerza"></i></div>'
    + '<div class="t-aviso" id="taviso"></div>'
    + '<div class="t-golpeo" id="tgolpeo"></div>'
    + '<div class="t-remate" id="tremate"></div>'
    + '<div class="t-quien">' + esc(nombre) + '</div>'
    + '<button class="saltar" id="tsaltar">Lo resuelve el motor</button>'
    + '</div>';
  caja.classList.add("on");
  const esc_ = document.getElementById("tiroEsc");
  const jug = document.getElementById("tjug"), bal = document.getElementById("tbal");
  const mira = document.getElementById("tmira"), barra = document.getElementById("tfuerza");
  const aviso = document.getElementById("taviso");
  const golpeo = document.getElementById("tgolpeo");
  const remate = document.getElementById("tremate");
  /* el portero, plantado en su columna. La pose 0 de la hoja */
  const portEl = document.getElementById("tport");
  portEl.style.backgroundImage = "url(" + porteroRec() + ")";
  portEl.style.backgroundPositionX = "0%";
  portEl.style.left = (port.x*100) + "%";
  /* Cuando vuela, el guante queda 12 píxeles por delante del centro del
     sprite, y la portería mide 92: ése es el estirón en fracción de portería. */
  const ESTIRON = 0.13;
  const vuela = (destino, haciaIzq) => {
    portEl.style.transition = "left .3s ease-out";
    portEl.style.backgroundPositionX = haciaIzq ? "50%" : "100%";
    portEl.style.left = (cl(destino, 0, 1)*100) + "%";
  };
  const sitio = (el,x,y)=>{ el.style.left=(x/CINE_W*100)+"%"; el.style.top=(y/CINE_H*100)+"%"; };
  const foto = n => { jug.style.backgroundPositionX = (n*50) + "%"; };
  /* En esta escena el tirador se aparta a la izquierda: en el centro, como en
     la celebración del gol, te tapa media portería. Pero en -30 se le comían
     22 píxeles por el borde —la cabeza y el brazo—, porque el dibujo empieza
     en la columna 8 de su marco de 112. En -6 entra entero con dos píxeles de
     aire, sin tocar el balón, la portería ni la mira. */
  foto(0); sitio(jug, -6, -4); sitio(bal, 52, 78);

  const E = TIRO_ESCENA = {fase:"apunta", t0:performance.now(), raf:null, relojes:[],
                           mira:0.5, fuerza:0, efecto:0, cerrado:false};
  const luego = (ms,f)=>{ E.relojes.push(setTimeout(f, ms)); };
  /* Aquí se cierra el ciclo: la jugada se resuelve con la escena todavía
     puesta, el balón se va adonde manda el desenlace, sale el cartel y sólo
     entonces se devuelve el partido a la simulación. */
  const cerrar = (calidad) => {
    if(E.cerrado) return; E.cerrado = true;
    if(E.raf) cancelAnimationFrame(E.raf); E.raf = null;
    esc_.onpointerdown = null;
    const tipo = resolver(calidad) || "fuera";
    mira.classList.add("fija");
    aviso.textContent = "";
    /* el balón, al sitio que le toca. Es el mismo vuelo de siempre, sólo
       cambia dónde acaba: dentro, alto o cortado antes de llegar */
    bal.style.transition = "left .34s linear, top .34s linear";
    const dentro = 43.3 + E.mira*38.3 - 5.4;
    /* El portero reacciona al desenlace. En la parada vuela hasta donde has
       puesto el balón y lo atrapa con el guante estirado; si se la echas al
       cuerpo no necesita tirarse. En el gol sale hacia ese lado pero llega
       corto, y si se la pones en el centro se tira al lado contrario. En el
       tiro fuera y en el bloqueo no le da tiempo a nada. */
    const haciaIzq = E.mira < port.x;
    let paran = port.x;                      /* la columna donde muere el balón */
    if(tipo === "parada"){
      if(Math.abs(E.mira - port.x) >= 0.10){
        paran = E.mira;
        vuela(E.mira + (haciaIzq ? ESTIRON : -ESTIRON), haciaIzq);
      }
    } else if(tipo === "gol"){
      const alCuerpo = Math.abs(E.mira - port.x) < 0.07;
      const izq = alCuerpo ? (port.x >= 0.5) : haciaIzq;
      vuela(alCuerpo ? port.x + (izq ? -0.16 : 0.16) : port.x + (E.mira - port.x)*0.45, izq);
    }
    if(tipo==="gol"){ bal.style.left = dentro+"%"; bal.style.top = "42%"; }
    /* la parada acaba en las manos del portero, no donde apuntabas: si no,
       en la pantalla una parada era idéntica a un gol */
    else if(tipo==="parada"){ bal.style.left = (43.3 + paran*38.3 - 5.4)+"%"; bal.style.top = "42%"; }
    else if(tipo==="fuera"){ bal.style.left = dentro+"%"; bal.style.top = "24%"; }
    else { bal.style.left = "30%"; bal.style.top = "52%"; }       /* bloqueo: se queda corto */
    remate.textContent = REMATE[tipo];
    remate.className = "t-remate se-ve " + tipo;
    E.relojes.push(setTimeout(()=>{
      pararEscenaTiro(); caja.classList.remove("on"); caja.innerHTML = "";
      alAcabar(tipo);
    }, 1200));
  };
  document.getElementById("tsaltar").onclick = () => cerrar(null);

  /* «Toca para fijar la dirección» se partía en dos líneas en los móviles de
     360 px de ancho, ahora que el texto vive en la mitad derecha */
  aviso.textContent = auto ? "El motor la resuelve" : "Toca para apuntar";
  /* la mira va y viene por la portería hasta que la fijas */
  const bucle = (ahora) => {
    if(E.cerrado) return;
    const dt = ahora - E.t0;
    if(E.fase==="apunta"){
      const f = (dt % (TIRO_BARRIDO*2)) / TIRO_BARRIDO;
      E.mira = f<1 ? f : 2-f;
      mira.style.left = (E.mira*100) + "%";      /* dentro del marco, de palo a palo */
    } else if(E.fase==="fuerza"){
      const f = (dt % (TIRO_CARGA*2)) / TIRO_CARGA;
      E.fuerza = f<1 ? f : 2-f;
      barra.style.width = (E.fuerza*100) + "%";
      barra.className = zonaFuerza(E.fuerza);   /* el relleno toma el color de su zona */
    }
    E.raf = requestAnimationFrame(bucle);
  };
  E.raf = requestAnimationFrame(bucle);

  /* el golpeo: el jugador remata, el balón sale y se va a la portería */
  const golpear = () => {
    E.fase = "efecto"; E.t0 = performance.now();
    aviso.textContent = auto ? "" : "¡Efecto! toca a un lado";
    /* el veredicto del golpeo, en palabras y en color. En automático no sale:
       ahí no has golpeado tú y la jugada la cierra el motor */
    if(!auto){
      const z = zonaFuerza(E.fuerza);
      golpeo.textContent = VEREDICTO[z];
      golpeo.className = "t-golpeo se-ve " + z;
    }
    mira.classList.add("fija");
    foto(1); sitio(bal, CINE_BX, CINE_BY);
    luego(150, ()=>{
      foto(2);
      bal.style.transition = "left .42s linear, top .42s linear";
      /* el balón acaba dentro de la portería, donde la hayas puesto */
      bal.style.left = (43.3 + E.mira*38.3 - 5.4) + "%";
      bal.style.top  = "42%";   /* el balón es más alto que la portería dibujada: se centra en ella */
    });
    luego(TIRO_EFECTO, ()=>{
      E.fase = "fin";
      /* En automático no has tocado nada, así que no se le pasa calidad al
         motor: decide él solo, aunque la animación se haya visto igual. Antes
         se calculaba igualmente y llegaba por delante del cierre en null. */
      const calidad = auto ? null : calidadGolpeo(m, E.mira, E.fuerza, E.efecto);
      luego(260, ()=>cerrar(calidad));
    });
  };
  if(auto){
    /* el modo automático se tira solo: se ve igual, pero no decides nada */
    luego(820, ()=>{ E.fase="fuerza"; E.t0=performance.now(); });
    luego(1500, golpear);
    luego(1500+TIRO_EFECTO+300, ()=>cerrar(null));
    return;
  }
  esc_.onpointerdown = (e) => {
    if(E.cerrado) return;
    if(e.target && e.target.id === "tsaltar") return;
    if(E.fase==="apunta"){
      E.fase="fuerza"; E.t0=performance.now();
      aviso.textContent = "Suelta en la zona verde";
      e.preventDefault();
      const soltar = () => {
        esc_.onpointerup = null; esc_.onpointercancel = null;
        if(E.fase==="fuerza") golpear();
      };
      esc_.onpointerup = soltar; esc_.onpointercancel = soltar;
      /* si te quedas pensando, sale solo */
      luego(TIRO_CARGA*2.4, ()=>{ if(E.fase==="fuerza") golpear(); });
    } else if(E.fase==="efecto"){
      const caja2 = esc_.getBoundingClientRect();
      E.efecto = cl((e.clientX - caja2.left)/caja2.width*2 - 1, -1, 1);
      bal.style.transform = "translateX(" + (E.efecto*9) + "%)";
      aviso.textContent = E.efecto<0 ? "la abre a la izquierda" : "la abre a la derecha";
    }
  };
}

function celebrar(ev){
  const caja = document.getElementById("vcelebra");
  if(!caja) return;
  const quien = ev.txt.split("  ·  ")[0];
  caja.innerHTML = `<div class="gol-txt">¡GOL!</div><div class="gol-quien">${esc(quien)}</div>`;
  caja.classList.add("on");
  const mar = document.getElementById("vmarc");
  if(mar){ mar.classList.remove("late"); void mar.offsetWidth; mar.classList.add("late"); }
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  setTimeout(()=>{ caja.classList.remove("on"); caja.innerHTML=""; }, 1900);
}
function correr(){
  pararReloj();
  despertar(); gradaOn();
  /* una ocasión tuya que se quedó en el aire se resuelve antes de seguir */
  /* El ciclo completo de una ocasión: se para el reloj, se juega el tiro, el
     motor lo resuelve con la escena aún puesta, se ve cómo acabó y después se
     actualizan marcador, minuto, estadísticas y crónica y el partido vuelve a
     la simulación. */
  /* «solo» quiere decir que el tiro ha sido el ÚNICO motivo para parar el
     reloj: ese minuto no trajo tarjeta, ni lesión, ni descanso. Entonces el
     partido se reanuda solo al acabar la jugada y no te obliga a pulsar
     Seguir encima de haber tirado. Si hubo algo más, se para como siempre
     para que te enteres. */
  const abrirMomento = (solo) => {
    pararReloj();
    let nuevosEv = [];
    const resolver = (calidad) => {
      const antes2 = S.vivo.ev.length;
      cerrarMomento(calidad);
      nuevosEv = S.vivo.ev.slice(antes2);
      return (S.vivo.tiro && S.vivo.tiro.tipo) || "fuera";
    };
    escenaTiro(S.vivo.momento, resolver, (tipo) => {
      pintaMarcador(); pintaCampo(); pintarTiro(true);
      nuevosEv.forEach(sonarEvento);
      guardar(); vPartido();
      const g = nuevosEv.find(e=>e.t==="gol");
      if(g){ celebrar(g); return; }                 /* el gol siempre se celebra y espera */
      if(solo && !S.vivo.fin && S.vivo.min < 90) correr();
    });
  };
  if(S.vivo && S.vivo.momento){ abrirMomento(false); return; }
  RELOJ = setInterval(()=>{
    const antes = S.vivo.ev.length;
    const descansoAntes = S.vivo.descanso;
    const parar = minutoVivo();
    pintaMarcador(); pintaCampo();
    const nuevos = S.vivo.ev.slice(antes);
    nuevos.forEach(sonarEvento);
    if(S.vivo.momento){
      abrirMomento(nuevos.length === 0 && S.vivo.descanso === descansoAntes);
      return;
    }
    const gol = nuevos.find(e=>e.t==="gol");
    if(parar || S.vivo.fin){ pararReloj(); guardar(); vPartido(); pintarTiro(true); }
    /* el gol se ve primero de cerca y después salta el cartel */
    if(gol){
      const d = S.vivo.tiro;
      if(d && d.tipo === "gol") escenaGol(d, gol, () => celebrar(gol));
      else setTimeout(() => celebrar(gol), 560);
    }
  }, VELOCIDADES[S.vel||"normal"].ms);
  vPartido();
}
function panelCharla(){

  if(!momento){
    return v.charlaTxt ? `<p class="note charla-eco">${esc(v.charlaTxt)}</p>` : "";
  }

  const dentro = cap && (yo.once||[]).includes(cap.id);
  const dif = (v.h===S.yo ? v.gh-v.ga : v.ga-v.gh);
  const pinta = { bronca: dif<0?"suele funcionar cuando vas por detrás":dif>0?"arriesgado yendo por delante":"puede salir mal",
                  calma:"sin riesgo", confianza:"para los de moral baja", nada:"" };
  return `<div class="charla">
    <h3>${momento==="pre"?"Antes de salir":"Descanso · "+(dif>0?"vas ganando":dif<0?"vas perdiendo":"vais empatados")}</h3>
    <p class="note">${dentro?`Con <b>${esc(camisetaNombre(cap))}</b> de capitán en el campo lo que digas cala más.`
      :`Tu capitán no está en el campo: lo que digas entra a medias.`}</p>
    <div class="ments vel" style="grid-template-columns:repeat(2,1fr)">
      ${ORDEN_CHARLA.map(k=>`<button class="mb" data-charla="${k}">${CHARLAS[k].n}
        <span class="charla-pie">${esc(pinta[k]||CHARLAS[k].d)}</span></button>`).join("")}
    </div>
  </div>`;
}
function panelInformePre(inf){
  const t = S.eq[S.yo];
  const hecho = S.pre.jugados>=2;
  return `<div class="panel oro lista"><h2>Lo que dejó la pretemporada</h2>
    <p class="note">${hecho?"Dos amistosos y esto es lo que se ha visto. Con esto ya conoces a la plantilla.":"De momento, tras el primer amistoso."}</p>
    <div class="fil cab pre"><span></span><span class="jn">Jugador</span><span class="cel">Min</span><span class="cel">Gol</span><span class="cel">Nota</span></div>
    ${inf.map(x=>`<div class="fil pre">
      <span class="p ${x.p.pos}">${x.p.pos}</span>
      <span class="jn">${esc(x.p.n)} <span class="meta-e">${x.p.edad}</span></span>
      <span class="cel">${x.min}'</span>
      <span class="cel">${x.g||"—"}</span>
      <span class="cel me ${x.media>=7?"n-ok":x.media<5.5?"n-mal":""}">${x.media.toFixed(1)}</span>
    </div>`).join("")}
    ${inf.length<t.jug.length?`<p class="note">${t.jug.length-inf.length} jugadores no han tenido minutos todavía.</p>`:""}
  </div>`;
}

function vPartido(){
  const cont=document.getElementById("s-partido"), t=S.eq[S.yo];
  if(S.despedido){
    cont.innerHTML=`<div class="panel"><h2>Ya no diriges al ${esc(t.n)}</h2>
      <p class="note">Te destituyeron en la jornada ${S.despedido.jor+1}. ${esc(S.despedido.motivo)}</p>
      <button class="btn ghost" id="verjunta">Ir al despacho</button></div>`;
    document.getElementById("verjunta").onclick=()=>ir("junta");
    return;
  }
  const listo = onceJug(t).filter(Boolean).length===11;

  /* --- partido en marcha --- */
  if(S.vivo){
    const v=S.vivo, yo=S.eq[S.yo], soyLocal=(v.h===S.yo);
    const rival=S.eq[soyLocal?v.a:v.h];
    const enJuego = RELOJ!==null;
    const huecos=FORMAS[yo.forma], once=onceJug(yo);
    const banca=(yo.conv||[]).map(id=>yo.jug.find(p=>p.id===id)).filter(Boolean);
    const restan = MAX_CAMBIOS - v.cambios[S.yo];
    const titulo = v.comp==="liga" ? "Jornada "+(S.jor+1) : v.comp==="copa" ? "Copa · "+RONDAS[v.ronda]
      : v.comp==="amistoso" ? "Amistoso · pretemporada "+(S.pre.jugados+1)+" de 2" : "Supercopa de Zamora";
    const duel = duelo(v.h, v.a);
    const sale = SALE!==null ? yo.jug.find(p=>p.id===SALE) : null;

    cont.innerHTML=`
    <div class="panel ${v.comp==="liga"?"":"oro"}"><h2>${titulo}</h2>
      <div class="marcador vivo">
        ${eqM(v.h)}
        <div class="cen"><div class="g" id="vmarc">${v.gh}-${v.ga}</div><div class="reloj" id="vmin">${v.min}'</div></div>
        ${eqM(v.a)}
      </div>
      ${duel?`<div class="banda-duelo">${esc(duel.n)}</div>`:""}
      <div class="campo-wrap">${campo2D()}<div class="cine" id="vcine"></div><div class="celebra" id="vcelebra"></div></div>
      <div class="ticker" id="vticker">${tickerVivo()}</div>
      <div class="est-vivo" id="vest">${estVivo()}</div>
      <p class="note pie-campo">${esc(campo(v.h))} · ${campoTexto(v.h)}${hielo(v.h,S.jor)?" · a dos grados":""}</p>
      <div class="balon" id="vbalon">${textoBalon()}</div>
      ${panelCharla()}
      ${v.fin?`<p class="note" style="text-align:center">Final del partido${v.pen?`, en los penaltis ${v.pen[0]}-${v.pen[1]}`:""}.</p>
        <button class="btn rojo" id="vfin">Al vestuario</button>`
      :`<div class="row">
          <button class="btn ${enJuego?"ghost":"rojo"}" id="vplay" ${charlaPendiente()?"disabled":""}>${enJuego?"Pausa":(v.min?"Seguir":"Empezar el partido")}</button>
          <button class="btn ghost" id="vrapido" ${charlaPendiente()?"disabled":""}>Saltar al final</button>
        </div>
        <div class="ments vel">${Object.keys(VELOCIDADES).map(k=>`<button class="mb ${S.vel===k?"on":""}" data-vel="${k}">${VELOCIDADES[k].n}</button>`).join("")}
          <button class="mb son ${AU.on?"on":""}" id="vson">${AU.on?"Sonido":"Silencio"}</button></div>`}
    </div>

    <div class="vtabs">
      <button class="mb ${VTAB==="feed"||v.fin?"on":""}" data-vtab="feed">En directo</button>
      ${v.fin?"":`<button class="mb ${VTAB==="tac"?"on":""}" data-vtab="tac">Táctica</button>
      <button class="mb ${VTAB==="camb"?"on":""}" data-vtab="camb">Cambios · ${restan}</button>`}
    </div>
    <div class="panel vt-pane ${VTAB==="feed"||v.fin?"on":""}" data-pane="feed"><div id="vfeed">${feedVivo()}</div></div>
    ${v.fin?"":`
    <div class="panel verde vt-pane ${VTAB==="tac"?"on":""}" data-pane="tac"><h2>Planteamiento</h2>
      <p class="note">${enJuego?"Para el partido si quieres tocar algo.":"Tu equipo: "+MENT[yo.ment].n+" · "+yo.forma+" · quedan "+restan+" cambios."}</p>
      <div class="tac-fila"><span class="tac-tit">Mentalidad</span>
        <div class="tac-ops cinco">${ORDEN_MENT.map(k=>`<button class="mb ${yo.ment===k?"on":""}" data-ment="${k}" ${enJuego?"disabled":""}>${MENT[k].corto}</button>`).join("")}</div></div>
      ${selectorTac(yo,"tacv",enJuego)}
      <label class="f" for="vforma">Sistema</label>
      <select id="vforma" ${enJuego?"disabled":""}>${Object.keys(FORMAS).map(k=>`<option ${k===yo.forma?"selected":""}>${k}</option>`).join("")}</select>
      <p class="note">${esc(rival.n)}: ${MENT[rival.ment||"normal"].n.toLowerCase()} · ${esc(planTexto(rival))}.</p>
    </div>

    <div class="panel lista cambios vt-pane ${VTAB==="camb"?"on":""}" data-pane="camb"><h2>Cambios</h2>
      <p class="note">Te quedan ${restan} de ${MAX_CAMBIOS}.</p>
      ${enJuego?`<p class="note">Pausa el partido para hacer cambios.</p>`:`
      <p class="note">${sale?`Sale <b>${esc(sale.n)}</b>. Elige quién entra del banquillo.`:"Toca al que quieres quitar y luego a quien entra."}</p>
      <div class="fil cab"><span class="nu">Nº</span><span></span><span class="jn">En el campo</span>
        <span class="cel">EF</span><span class="cel">ME</span></div>
      ${huecos.map((h,i)=>once[i]?`<button class="fil ${SALE===once[i].id?"sel":""} ${once[i].tocado?"les":""}" data-sale="${once[i].id}">
          <span class="nu">${dorsal(yo,once[i])}</span><span class="p ${h}">${h}</span>
          <span class="jn">${esc(once[i].n)} ${once[i].tocado?'<span class="marca">tocado</span>':""}</span>
          <span class="cel ${once[i].fres>=60?"n-ok":once[i].fres>=40?"n-med":"n-mal"}">${Math.round(once[i].fres)}</span>
          <span class="cel me">${once[i].med}</span></button>`
        :`<div class="fil vacia"><span class="nu">—</span><span class="p ${h}">${h}</span><span class="jn">expulsado</span><span class="cel"></span><span class="cel"></span></div>`).join("")}
      <h3>Banquillo</h3>
      ${banca.length?`<div class="fil cab"><span class="nu">Nº</span><span></span><span class="jn">Disponibles</span>
        <span class="cel">EF</span><span class="cel">ME</span></div>`+banca.map(p=>{
        const usado = (v.fuera||[]).includes(p.id);
        return `<button class="fil ${(disponible(p)&&!usado)?"":"les"}" data-entra="${p.id}" ${(sale&&disponible(p)&&!usado&&restan>0)?"":"disabled"}>
          <span class="nu">${dorsal(yo,p)}</span><span class="p ${p.pos}">${p.pos}</span>
          <span class="jn">${esc(p.n)} ${usado?'<span class="marca">ya sustituido</span>':""}</span>
          <span class="cel ${p.fres>=60?"n-ok":"n-med"}">${Math.round(p.fres)}</span>
          <span class="cel me">${p.med}</span></button>`;}).join(""):`<p class="note">No queda nadie en el banquillo.</p>`}
      <div id="vmsg"></div>`}
    </div>`}`;
    cont.querySelectorAll("[data-vtab]").forEach(b=>b.onclick=()=>{
      VTAB=b.dataset.vtab;
      cont.querySelectorAll("[data-vtab]").forEach(x=>x.classList.toggle("on", x===b));
      cont.querySelectorAll(".vt-pane").forEach(x=>x.classList.toggle("on", x.dataset.pane===VTAB));
    });

    cont.querySelectorAll("[data-charla]").forEach(b2=>b2.onclick=()=>{
      const momento = charlaPendiente(); if(!momento) return;
      const yoEq = S.eq[S.yo];
      const dif = (v.h===S.yo ? v.gh-v.ga : v.ga-v.gh);
      const r = aplicarCharla(yoEq, b2.dataset.charla, momento==="pre" ? 0 : dif);
      if(momento==="pre") v.charlaPre = b2.dataset.charla; else v.charlaDesc = b2.dataset.charla;
      v.charlaTxt = r.txt;
      if(b2.dataset.charla!=="nada") v.ev.push({m:v.min, t:"charla", lado:(v.h===S.yo?"H":"A"), txt:"Charla del entrenador · "+r.txt});
      guardar(); vPartido();
    });
    const bs=document.getElementById("vson");
    if(bs) bs.onclick=()=>{ sonidoToggle(); vPartido(); };
    cont.querySelectorAll("[data-vel]").forEach(b=>b.onclick=()=>{
      S.vel=b.dataset.vel; guardar();
      if(RELOJ) correr(); else vPartido();
    });
    const bp=document.getElementById("vplay");
    if(bp) bp.onclick=()=>{ if(RELOJ){ pararReloj(); guardar(); vPartido(); } else { despertar(); if(!S.vivo.min) silbato(1); correr(); } };
    const br=document.getElementById("vrapido");
    if(br) br.onclick=()=>{ pararReloj(); let g=0; while(!S.vivo.fin && g++<200) minutoVivo(); guardar(); vPartido(); };
    const bf=document.getElementById("vfin");
    if(bf) bf.onclick=()=>{ finalizarVivo(); SALE=null; ir("partido"); };
    cont.querySelectorAll("[data-ment]").forEach(b=>b.onclick=()=>{ yo.ment=b.dataset.ment; guardar(); vPartido(); });
    cont.querySelectorAll("[data-tacv]").forEach(b=>b.onclick=()=>{
      const [eje,val]=b.dataset.tacv.split(":"); tactica(yo)[eje]=val; guardar(); vPartido();
    });
    const sf=document.getElementById("vforma");
    if(sf) sf.onchange=()=>{ cambiarSistema(yo, sf.value); guardar(); vPartido(); };
    cont.querySelectorAll("[data-sale]").forEach(b=>b.onclick=()=>{
      SALE = (SALE===+b.dataset.sale) ? null : +b.dataset.sale; vPartido();
    });
    cont.querySelectorAll("[data-entra]").forEach(b=>b.onclick=()=>{
      const err = hacerCambio(yo, SALE, +b.dataset.entra);
      SALE=null; guardar(); vPartido();
      if(err) document.getElementById("vmsg").innerHTML=`<p class="aviso">${esc(err)}</p>`;
    });
    return;
  }

  /* --- pretemporada: dos amistosos antes de que empiece la liga --- */
  if(prePendiente()){
    const riv = S.eq[preRival()], casa = preEnCasa();
    const local = casa ? S.yo : riv.id, visit = casa ? riv.id : S.yo;
    const n = S.pre.jugados+1;
    const inf = informePre();
    cont.innerHTML=`
    <div class="panel verde"><h2>Pretemporada · amistoso ${n} de 2</h2>
      <div class="marcador">${eqM(local)}<div class="g">vs</div>${eqM(visit)}</div>
      <p class="note" style="text-align:center">${esc(campo(local))} · ${campoTexto(local)}</p>
      <p class="note">Sirve para ver a la plantilla: aquí no hay puntos, ni tarjetas que se acumulen, y los goles no cuentan para el Pichichi. Prueba sistemas y da minutos a los que no conoces.</p>
      ${selectorModo()}
      ${listo?"":`<p class="aviso">Completa los 11 en la pestaña Once antes de salir.</p>`}
      <button class="btn rojo" id="jugarpre" ${listo?"":"disabled"}>Saltar al campo</button>
    </div>
    ${S.pre.res.length?`<div class="panel"><h2>Amistosos jugados</h2>
      ${S.pre.res.map(m=>`<div class="res"><div class="l">${esc(S.eq[m.h].n)}</div><div class="c">${m.gh}-${m.ga}</div><div>${esc(S.eq[m.a].n)}</div></div>`).join("")}
    </div>`:""}
    ${S.ultAmistoso?crónica(S.ultAmistoso,"amistoso")+panelEstadisticas(S.ultAmistoso):""}
    ${inf.length?panelInformePre(inf):""}`;
    montarModo(cont);
    document.getElementById("jugarpre").onclick=()=>{
      iniciarVivo(local, visit, "amistoso"); SALE=null; vPartido();
    };
    return;
  }

  /* --- antes del partido --- */
  const rc = copaPendiente();
  if(rc!==null){
    const mio = S.copa.rondas[rc].find(m=>m.h===S.yo||m.a===S.yo);
    cont.innerHTML=`
    <div class="panel oro"><h2>Copa de Zamora · ${RONDAS[rc]}</h2>
      ${mio?`<div class="marcador">${eqM(mio.h)}<div class="g">vs</div>${eqM(mio.a)}</div>
        <p class="note" style="text-align:center">Banquillos: ${mio.h===S.yo?"tú":esc(dt(S.eq[mio.h]))} y ${mio.a===S.yo?"tú":esc(dt(S.eq[mio.a]))}</p>
        <p class="note">Partido único en ${esc(campo(mio.h))}, ${campoTexto(mio.h)}. Si acaba en tablas, penaltis.</p>
        ${contexto(mio.h,mio.a,S.jor).notas.map(n=>`<p class="clima">${esc(n)}</p>`).join("")}
        ${listo?"":`<p class="aviso">Completa los 11 en la pestaña Once antes de salir.</p>`}`
        :`<p class="note">Tu equipo no está en la copa esta temporada: la juegan los ocho primeros de la liga pasada. Se juega la ronda y seguimos con la liga.</p>`}
      <div style="margin-top:10px">${S.copa.rondas[rc].map(m=>`<div class="res"><div class="l">${esc(S.eq[m.h].n)}</div><div class="c">—</div><div>${esc(S.eq[m.a].n)}</div></div>`).join("")}</div>
      <button class="btn rojo" id="jugarcopa" ${(!mio||listo)?"":"disabled"}>${mio?"Saltar al campo":"Jugar "+RONDAS[rc].toLowerCase()}</button>
    </div>
    ${S.copa.ult?crónica(S.copa.ult,"copa")+panelEstadisticas(S.copa.ult):""}`;
    document.getElementById("jugarcopa").onclick=()=>{
      if(mio){ iniciarVivo(mio.h, mio.a, "copa", rc); SALE=null; vPartido(); }
      else { jugarRondaCopa(); ir("partido"); }
    };
    return;
  }

  if(superPendiente()){
    const p = parejaSupercopa(), mio=(p.h===S.yo||p.a===S.yo);
    cont.innerHTML=`<div class="panel oro"><h2>Supercopa de Zamora</h2>
      <div class="marcador">${eqM(p.h)}<div class="g">vs</div>${eqM(p.a)}</div>
      <p class="note">${p.doblete
        ? "El campeón de liga ganó también la copa, así que por reglamento la otra plaza es para el finalista de copa."
        : "Campeón de liga contra campeón de copa, a partido único."}</p>
      ${mio&&!listo?`<p class="aviso">Completa los 11 en la pestaña Once.</p>`:""}
      <button class="btn rojo" id="jugarsuper" ${(mio&&!listo)?"disabled":""}>${mio?"Saltar al campo":"Jugar la Supercopa"}</button>
    </div>`;
    document.getElementById("jugarsuper").onclick=()=>{
      if(mio){ iniciarVivo(p.h, p.a, "super"); SALE=null; vPartido(); }
      else { jugarSupercopa(); ir("partido"); }
    };
    return;
  }

  if(S.jor>=30){
    const campeon=clasificacion()[0], yo=clasificacion().indexOf(t)+1;
    if(temporadaAcabada()) anotarPalmares();
    const fin = ultimaTemporada() || S.despedido;
    cont.innerHTML=`<div class="panel oro"><h2>Temporada ${temporada()} de ${TEMPORADAS}</h2>
      <div class="tw"><table><tbody>
        <tr><td>Liga</td><td class="n">${esc(campeon.n)}</td></tr>
        ${S.copa.campeon!==null?`<tr><td>Copa de Zamora</td><td class="n">${esc(S.eq[S.copa.campeon].n)}</td></tr>`:""}
        ${S.super.jugado?`<tr><td>Supercopa</td><td class="n">${esc(S.eq[S.super.campeon].n)}</td></tr>`:""}
        <tr><td>Tu puesto en liga</td><td class="n">${yo}.º con ${pts(t)} puntos</td></tr>
        <tr><td>Lo que te pedían</td><td class="n ${cumpleObjetivo()?"n-ok":"n-mal"}">${cumpleObjetivo()?"cumplido":"sin cumplir"}</td></tr>
      </tbody></table></div>
      ${!temporadaAcabada()?`<p class="note">Aún te queda algo por jugar antes de cerrar el año.</p>`
        : fin ? `<p class="note">${S.despedido?"Te destituyeron, así que aquí se acaba tu etapa en el club."
                                              :"Han sido cinco temporadas. Hasta aquí llega esta carrera."}</p>`
        : `<button class="btn rojo" id="siguiente">Empezar la temporada ${temporada()+1}</button>
           <p class="note">Todos cumplen un año, los jóvenes dan el estirón y los veteranos empiezan a perder. La plantilla se queda como está.</p>
           ${temporada()===2?`<p class="aviso">Es la última temporada con juveniles en el mercado: el año que viene ya son senior.</p>`:""}`}
    </div>
    ${temporadaAcabada()?panelPremios():""}
    ${panelPalmares()}
    ${S.desarrollo?panelDesarrollo():""}
    ${S.super.ult?crónica(S.super.ult,"super")+panelEstadisticas(S.super.ult):""}`;
    const bs=document.getElementById("siguiente");
    if(bs) bs.onclick=()=>{ nuevaTemporada(); ir("inicio"); };
    return;
  }

  const m=S.cal[S.jor].find(x=>x.h===S.yo||x.a===S.yo);
  cont.innerHTML=`
  <div class="panel ${duelo(m.h,m.a)?"oro":""}"><h2>Jornada ${S.jor+1}</h2>
    ${duelo(m.h,m.a)?`<div class="banda-duelo">${esc(duelo(m.h,m.a).n)}</div>`:""}
    <div class="marcador">${eqM(m.h)}<div class="g">vs</div>${eqM(m.a)}</div>
    <p class="note" style="text-align:center">${fechaTexto(S.jor)} · ${esc(campo(m.h))} · ${campoTexto(m.h)}</p>
    <p class="note" style="text-align:center">Banquillos: ${m.h===S.yo?"tú":esc(dt(S.eq[m.h]))} y ${m.a===S.yo?"tú":esc(dt(S.eq[m.a]))}</p>
    ${contexto(m.h,m.a,S.jor).notas.map(n=>`<p class="clima">${esc(n)}</p>`).join("")}
    ${selectorModo()}
    ${listo?"":`<p class="aviso">Antes de jugar tienes que completar los 11. Ve a la pestaña Once.</p>`}
    <button class="btn rojo" id="jugar" ${listo?"":"disabled"}>Saltar al campo</button>
  </div>
  ${panelHistorial(m.h===S.yo?m.a:m.h)}
  ${(S.jor===0 && S.pre && S.pre.jugados>=2 && informePre().length)?panelInformePre(informePre()):""}
  ${S.ult?crónica(S.ult,"liga")+panelEstadisticas(S.ult):""}
  ${S.copa.ult && S.copa.ult.jor===S.jor ? crónica(S.copa.ult,"copa")+panelEstadisticas(S.copa.ult) : ""}`;
  montarModo(cont);
  document.getElementById("jugar").onclick=()=>{ iniciarVivo(m.h, m.a, "liga"); SALE=null; vPartido(); };
}
/* Cómo quieres vivir el partido. Se elige antes de salir y se queda guardado.
   La liga no se entera: los dieciséis equipos siguen con el mismo motor. */
function selectorModo(){
  if(!MODOS[S.modo]) S.modo = "sim";     /* por si se pinta antes de sincronizar */
  return `<div class="modo-sel">
    <span class="modo-tit">Cómo lo juegas</span>
    ${Object.keys(MODOS).map(k=>`<button class="mb ${S.modo===k?"on":""}" data-modo="${k}">${MODOS[k].n}</button>`).join("")}
    <span class="note modo-pie">${esc(MODOS[S.modo].d)}</span>
  </div>`;
}
function montarModo(cont, repintar){
  (cont||document).querySelectorAll("[data-modo]").forEach(b=>{
    b.onclick = () => { S.modo = b.dataset.modo; guardar(); (repintar||vPartido)(); };
  });
}

/* ============ CARA A CARA, RÉCORDS Y ÁLBUM ============ */
function panelHistorial(rival){
  const h = historial(rival), r = S.eq[rival];
  if(!h.pj) return `<div class="panel"><h2>Contra el ${esc(nombreCorto(r))}</h2>
    <p class="note">Es la primera vez que os veis las caras desde que estás en el banquillo.</p></div>`;
  const donde = x => x.casa ? "en casa" : "fuera";
  return `<div class="panel"><h2>Contra el ${esc(nombreCorto(r))}</h2>
    <p class="note">${h.pj} partido${h.pj===1?"":"s"} desde que llegaste · ${h.gf}-${h.gc} en goles.</p>
    <div class="h2h">
      <div class="${h.g>h.p?"gana":""}"><b>${h.g}</b><span>ganados</span></div>
      <div><b>${h.e}</b><span>empates</span></div>
      <div class="${h.p>h.g?"pier":""}"><b>${h.p}</b><span>perdidos</span></div>
    </div>
    <p class="note">En tu campo ${h.casa.g}-${h.casa.e}-${h.casa.p} · en el suyo ${h.fuera.g}-${h.fuera.e}-${h.fuera.p}.
      ${h.fuera.g===0 && (h.fuera.g+h.fuera.e+h.fuera.p)>=2 ? "<b>Nunca les has ganado en su campo.</b>" : ""}</p>
    <div class="h2h-ult">${h.ultimos.map(x=>{
      const q = x.gf>x.gc?"G":x.gf<x.gc?"P":"E";
      return `<span class="${q}">T${x.t} · ${x.gf}-${x.gc} ${donde(x)}${x.c!=="liga"?" ("+COMPES[x.c].toLowerCase()+")":""}</span>`;
    }).join("")}</div>
  </div>`;
}
function panelRecords(){
  const r = records(); if(!r) return "";
  const an = anales();
  const linea = (x, txt) => `${txt} <b>${x.gf}-${x.gc}</b> ${x.casa?"en casa":"fuera"} al ${esc(nombreCorto(S.eq[x.r]))} (T${x.t}, j.${x.j+1})`;
  const hist = historicoJugadores();
  const top = l => l.length ? l[0] : null;
  const gol = top(hist.filter(x=>x.g>0).sort((a,b)=>b.g-a.g));
  const par = top(hist.filter(x=>x.pj>0).sort((a,b)=>b.pj-a.pj));
  const asi = top(hist.filter(x=>x.a>0).sort((a,b)=>b.a-a.a));
  const fil = (tit, val, pie) => `<div class="fil rec"><span class="jn">${esc(tit)}</span>
    <span class="val"><b>${val}</b>${pie?`<span class="meta-e">${esc(pie)}</span>`:""}</span></div>`;
  const dato = x => fil.bind(null);
  const marcador = x => `${x.gf}-${x.gc}`;
  const pieDe = x => `${x.casa?"en casa":"fuera"} al ${nombreCorto(S.eq[x.r])} · T${x.t}, j.${x.j+1}`;
  return `<div class="panel oro lista"><h2>Récords del ${esc(nombreCorto(S.eq[S.yo]))}</h2>
    <p class="note">Desde que cogiste el banquillo: ${r.pj} partidos oficiales, ${r.g} ganados, ${r.e} empatados y ${r.p} perdidos.</p>
    ${fil("Mejor resultado", marcador(r.mejor), pieDe(r.mejor))}
    ${r.goleada.gf>r.mejor.gf ? fil("Más goles en un partido", marcador(r.goleada), pieDe(r.goleada)) : ""}
    ${fil("Peor resultado", marcador(r.peor), pieDe(r.peor))}
    ${fil("Racha de victorias", r.racha, "partidos seguidos ganando")}
    ${fil("Racha sin perder", r.invicto, "partidos seguidos")}
    ${gol?fil("Máximo goleador", gol.g, gol.n+" · "+gol.pj+" partidos"):""}
    ${asi?fil("Más asistencias", asi.a, asi.n):""}
    ${par?fil("Más partidos", par.pj, par.n+" · "+par.min.toLocaleString("es-ES")+" minutos"):""}
  </div>`;
}

    if(res.motivo){ MF.msg=res.motivo; MF.ok=false; vFichar(); return; }

let PRENSA_VER = null;

/* ============ MANDO ============ */
/* El juego entero se maneja a golpe de onclick, así que el mando no necesita
   lógica propia de juego: lleva un cursor por los elementos que se pueden
   pulsar de la pantalla abierta y los pulsa. Así vale para todas las vistas,
   también para las que se escriban mañana, sin tocar ninguna de ellas.
   La escena de tiro es la excepción, porque ahí sí hay que mantener apretado:
   se le mandan pointerdown y pointerup de verdad y la escena ni se entera. */
const MANDO = {
  hay:false,            /* hay un mando conectado */
  usado:false,          /* ya ha tocado algo: hasta entonces no se pinta el cursor */
  nombre:"",
  foco:null, firma:"",
  antes:[], ejes:{x:0,y:0}, prox:{x:0,y:0},
  lazo:0, apretado:false,
  bloqueado:null        /* true cuando el navegador no deja leer mandos aquí */
};
const MANDO_ESPERA = 300, MANDO_SEGUIDO = 110, MANDO_ZONA = 0.55;

function mandoApi(){
  if(!navigator.getGamepads) return false;
  try{
    const pp = document.permissionsPolicy || document.featurePolicy;
    if(pp && pp.allowsFeature && !pp.allowsFeature("gamepad")) return false;
  }catch(e){}
  return true;
}
function mandoLee(){
  if(!navigator.getGamepads) return null;
  let l = [];
  try{ l = navigator.getGamepads() || []; }catch(e){ return null; }
  for(let i=0;i<l.length;i++) if(l[i] && l[i].connected) return l[i];
  return null;
}
/* La escena manda: mientras hay cine o tiro, el cursor se calla */
function mandoEscena(){
  const t = document.getElementById("tiroEsc");
  if(t) return "tiro";
  const c = document.getElementById("vcine");
  if(c && c.classList.contains("on")) return "cine";
  return null;
}
function mandoVale(el){
  const t = el.tagName;
  const nativo = t==="BUTTON" || t==="SELECT" || t==="A" ||
                 (t==="INPUT" && el.type!=="file" && el.type!=="hidden");
  if(!nativo && !el.onclick) return false;
  if(el.disabled) return false;
  const r = el.getBoundingClientRect();
  if(r.width < 6 || r.height < 6) return false;
  const e = getComputedStyle(el);
  if(e.visibility==="hidden" || e.pointerEvents==="none" || +e.opacity===0) return false;
  return true;
}
function mandoPulsables(){
  if(mandoEscena()) return [];
  const fuera = [];
  [document.querySelector("main section.on"), document.querySelector("nav")].forEach(r=>{
    if(!r) return;
    r.querySelectorAll("button,select,a,input,[onclick]").forEach(el=>{ if(mandoVale(el)) fuera.push(el); });
  });
  return fuera;
}
/* Las vistas se redibujan enteras con innerHTML, así que el elemento que tenía
   el cursor desaparece en cuanto pulsas algo. La firma sirve para volver a
   encontrarlo en la pantalla nueva en lugar de saltar al primero de la lista. */
function mandoFirma(el){
  if(!el) return "";
  const d = el.dataset ? Object.keys(el.dataset).map(k=>k+"="+el.dataset[k]).join(",") : "";
  return el.tagName+"|"+(el.id||"")+"|"+d+"|"+(el.textContent||"").trim().slice(0,30);
}
function mandoPinta(el){
  if(MANDO.foco && MANDO.foco!==el) MANDO.foco.classList.remove("mando-foco");
  MANDO.foco = el || null;
  if(!el){ MANDO.firma=""; return; }
  el.classList.add("mando-foco");
  MANDO.firma = mandoFirma(el);
  const r = el.getBoundingClientRect();
  if(r.top < 76 || r.bottom > innerHeight-76) el.scrollIntoView({block:"center"});
}
function mandoReengancha(){
  mandoEstado();                 /* la pantalla de Club se redibuja a menudo */
  if(!MANDO.usado) return;
  const l = mandoPulsables();
  if(!l.length){ mandoPinta(null); return; }
  if(MANDO.foco && l.indexOf(MANDO.foco)>=0) return;     /* sigue vivo */
  const igual = MANDO.firma ? l.find(el=>mandoFirma(el)===MANDO.firma) : null;
  mandoPinta(igual || l[0]);
}
function mandoMueve(dx, dy){
  const l = mandoPulsables();
  if(!l.length) return;
  if(!MANDO.foco || l.indexOf(MANDO.foco)<0){ mandoPinta(l[0]); return; }
  if(MANDO.foco.tagName==="SELECT" && dx){ mandoSelect(MANDO.foco, dx); return; }
  const a = MANDO.foco.getBoundingClientRect();
  const ax = a.left+a.width/2, ay = a.top+a.height/2;
  let mejor=null, coste=Infinity;
  l.forEach(el=>{
    if(el===MANDO.foco) return;
    const b = el.getBoundingClientRect();
    const bx = b.left+b.width/2, by = b.top+b.height/2;
    const va = (bx-ax)*dx + (by-ay)*dy;                  /* lo que avanza hacia allá */
    if(va <= 3) return;
    const vc = Math.abs((bx-ax)*dy - (by-ay)*dx);        /* lo que se desvía */
    const c = va + vc*2.6;
    if(c < coste){ coste=c; mejor=el; }
  });
  if(mejor){ mandoPinta(mejor); mandoTic(); }
}
/* Un desplegable no se puede abrir con el mando, así que la izquierda y la
   derecha cambian la opción directamente, que es lo que se espera de un mando */
function mandoSelect(el, paso){
  if(!el.options || !el.options.length) return;
  let i = el.selectedIndex + (paso>0?1:-1);
  if(i<0) i = el.options.length-1;
  if(i>=el.options.length) i = 0;
  el.selectedIndex = i;
  mandoTic();
  el.dispatchEvent(new Event("change", {bubbles:true}));
}
function mandoClic(){
  const el = MANDO.foco;
  if(!el) return;
  if(el.tagName==="SELECT"){ mandoSelect(el, 1); return; }
  mandoTic(660);
  el.click();
}
function mandoAtras(){
  if(document.getElementById("tiroEsc")){ mandoBoton("tsaltar"); return; }
  if(mandoBoton("csaltar")) return;
  if(!S) return;
  const v = document.querySelector("main section.on");
  if(v && v.id==="s-inicio") return;
  ir("inicio");
}
function mandoBoton(id){ const b=document.getElementById(id); if(b){ b.click(); return true; } return false; }
function mandoPestana(d){
  const b = Array.prototype.slice.call(document.querySelectorAll("nav button"));
  if(!b.length) return;
  let i = b.findIndex(x=>x.classList.contains("on"));
  if(i<0) i = 0;
  b[(i+d+b.length)%b.length].click();
  mandoTic();
}
function mandoTic(f){ if(AU && AU.on) try{ tono(f||420, f?f*1.18:470, 0.035, "square", 0.045); }catch(e){} }

/* ---- la escena de tiro: apretar, cargar y soltar ---- */
function mandoTiroAbajo(ejeX){
  const e = document.getElementById("tiroEsc");
  if(!e) return;
  const r = e.getBoundingClientRect();
  const x = r.left + r.width*(0.5 + cl(ejeX||0,-1,1)*0.5);
  e.dispatchEvent(new PointerEvent("pointerdown",
    {bubbles:true, cancelable:true, clientX:x, clientY:r.top+r.height*0.5, pointerId:1, isPrimary:true}));
}
function mandoTiroArriba(){
  const e = document.getElementById("tiroEsc");
  if(!e) return;
  e.dispatchEvent(new PointerEvent("pointerup",
    {bubbles:true, cancelable:true, pointerId:1, isPrimary:true}));
}

function mandoAviso(txt){
  let a = document.getElementById("mandoaviso");
  if(!a){ a = document.createElement("div"); a.id="mandoaviso"; document.body.appendChild(a); }
  a.textContent = txt;
  a.classList.add("on");
  clearTimeout(mandoAviso.reloj);
  mandoAviso.reloj = setTimeout(()=>a.classList.remove("on"), 2600);
}
function mandoEstado(){
  const e = document.getElementById("mandoestado");
  if(!e) return;
  if(MANDO.bloqueado){ e.textContent = "el navegador no deja leerlo aquí"; e.className=""; return; }
  if(MANDO.hay){ e.textContent = MANDO.nombre || "conectado"; e.className="vivo"; return; }
  e.textContent = "ninguno · conéctalo y pulsa un botón";
  e.className = "";
}

function mandoLazo(){
  MANDO.lazo = requestAnimationFrame(mandoLazo);
  const g = mandoLee();
  if(!g){
    if(MANDO.hay){ MANDO.hay=false; MANDO.nombre=""; mandoPinta(null); MANDO.usado=false; mandoEstado(); }
    return;
  }
  if(!MANDO.hay){
    MANDO.hay = true;
    MANDO.nombre = (g.id||"mando").split("(")[0].trim().slice(0,28);
    mandoEstado();
  }
  const ahora = performance.now();
  const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
  const nuevo = i => b(i) && !MANDO.antes[i];
  const escena = mandoEscena();

  /* el gatillo de tirar: se mantiene, no se pulsa */
  if(escena==="tiro"){
    if(b(0) && !MANDO.apretado){ MANDO.apretado=true; MANDO.usado=true; mandoTiroAbajo(g.axes[0]||0); }
    else if(!b(0) && MANDO.apretado){ MANDO.apretado=false; mandoTiroArriba(); }
    if(nuevo(1)) mandoBoton("tsaltar");
  }else{
    if(MANDO.apretado) MANDO.apretado = false;
    if(nuevo(0)){ MANDO.usado=true; if(escena==="cine") mandoBoton("csaltar"); else { mandoReengancha(); mandoClic(); } }
    if(nuevo(1)){ MANDO.usado=true; mandoAtras(); }
    if(nuevo(2)){ MANDO.usado=true; if(!mandoBoton("vplay")) mandoBoton("pfjugar"); }
    if(nuevo(3)){ MANDO.usado=true; if(!mandoBoton("vson")) mandoBoton("son"); }
    if(nuevo(4)){ MANDO.usado=true; mandoPestana(-1); }
    if(nuevo(5)){ MANDO.usado=true; mandoPestana(1); }
    if(nuevo(9)){ MANDO.usado=true; if(!mandoBoton("vplay")) mandoBoton("pfjugar"); }
    if(nuevo(8)){ MANDO.usado=true; ir("inicio"); }
    if(b(6)) scrollBy(0,-16);
    if(b(7)) scrollBy(0, 16);

    /* cruceta y stick izquierdo, con el repique de siempre: una y luego seguido */
    let dx = (b(15)?1:0)-(b(14)?1:0);
    let dy = (b(13)?1:0)-(b(12)?1:0);
    const ex = g.axes[0]||0, ey = g.axes[1]||0;
    if(!dx && Math.abs(ex)>MANDO_ZONA) dx = ex>0?1:-1;
    if(!dy && Math.abs(ey)>MANDO_ZONA) dy = ey>0?1:-1;
    if(dx && dy){ if(Math.abs(ex)>=Math.abs(ey)) dy=0; else dx=0; }
    ["x","y"].forEach(k=>{
      const v = k==="x" ? dx : dy;
      if(!v){ MANDO.ejes[k]=0; MANDO.prox[k]=0; return; }
      if(MANDO.ejes[k]!==v){ MANDO.ejes[k]=v; MANDO.prox[k]=ahora+MANDO_ESPERA; MANDO.usado=true; mandoMueve(k==="x"?v:0, k==="y"?v:0); return; }
      if(ahora>=MANDO.prox[k]){ MANDO.prox[k]=ahora+MANDO_SEGUIDO; mandoMueve(k==="x"?v:0, k==="y"?v:0); }
    });
    if(MANDO.usado && !MANDO.foco) mandoReengancha();
  }
  MANDO.antes = g.buttons.map(x=>x.pressed);
}

function mandoArranca(){
  MANDO.bloqueado = !mandoApi();
  /* las vistas se redibujan solas: hay que volver a enganchar el cursor, y de
     paso refrescar el estado del panel. Esto va aunque no haya mando, que si
     no el panel se queda en «comprobando» para siempre. */
  const ojo = new MutationObserver(()=>{
    clearTimeout(mandoArranca.reloj);
    mandoArranca.reloj = setTimeout(mandoReengancha, 30);
  });
  ojo.observe(document.querySelector("main"), {childList:true, subtree:true});
  mandoEstado();
  if(MANDO.bloqueado) return;
  addEventListener("gamepadconnected", e=>{
    MANDO.hay = true;
    MANDO.nombre = ((e.gamepad&&e.gamepad.id)||"mando").split("(")[0].trim().slice(0,28);
    mandoEstado();
    mandoAviso("Mando conectado · " + MANDO.nombre);
  });
  addEventListener("gamepaddisconnected", ()=>{
    MANDO.hay=false; MANDO.usado=false; mandoPinta(null); mandoEstado();
    mandoAviso("Mando desconectado");
  });
  /* si vuelves al ratón o al dedo, el cursor del mando se quita de en medio */
  addEventListener("pointerdown", ()=>{ if(MANDO.foco){ MANDO.usado=false; mandoPinta(null); } }, true);
  cancelAnimationFrame(MANDO.lazo);
  mandoLazo();
}
